services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wbcz
      POSTGRES_USER: wbcz
      POSTGRES_PASSWORD: wbcz_dev
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wbcz -d wbcz"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - wbcz_pgdata:/var/lib/postgresql/data
volumes:
  wbcz_pgdata:
