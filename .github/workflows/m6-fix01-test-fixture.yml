name: M6 fix01 fixture

on:
  push:
    branches:
      - m6/aggregation-001

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m6/aggregation-001
          fetch-depth: 0
      - name: Correct stale ordinary-status fixture for mixed-PG test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_m6_aggregation.py')
          s=p.read_text(encoding='utf-8')
          old='    missing_pg=snap(C1,pg=None)\n'
          new='    missing_pg=snap(C1,pg=None,status="INTRODUCED")\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected one fixture match, got {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
      - name: Commit fixture correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_m6_aggregation.py
          git commit -m 'test: align mixed-PG fixture with current status contract'
          git push origin HEAD:m6/aggregation-001
