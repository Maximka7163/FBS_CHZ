name: M6 aggregation validation

on:
  push:
    branches:
      - m6/aggregation-001
  workflow_dispatch:

permissions:
  contents: read

env:
  M6_BASE_SHA: 0b7ae7120a8e634a865c4c6a496505158509213f
  FROZEN_P0_SHA: 395701f1757711b5a11b9348d929182d40f51f0a
  WBCZ_ENV: test
  WBCZ_OWN_INN: "1234567890"
  WBCZ_TRUE_API_WRITE_ENABLED: "false"

jobs:
  linux-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wbcz_m6
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wbcz_m6"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=20
    env:
      WBCZ_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_m6
      WBCZ_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_m6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove M5 base and frozen boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$M6_BASE_SHA")" = "$M6_BASE_SHA"
          test "$(git rev-parse "$M6_BASE_SHA")" = "$M6_BASE_SHA"
          test "$(git rev-parse origin/p0/test-candidate-001)" = "$FROZEN_P0_SHA"
          if git diff --name-only "$M6_BASE_SHA"...HEAD | grep '^frontend/'; then
            echo 'FRONTEND_SOURCE_CHANGES must remain NONE for M6' >&2; exit 1
          fi
          if git diff --name-only "$M6_BASE_SHA"...HEAD | grep '^migrations/versions/000[1-6]'; then
            echo 'historical migration changed in M6' >&2; exit 1
          fi
          if find .github/workflows -maxdepth 1 -type f \( -name '*m6*patch*.yml' -o -name '*m6*bootstrap*.yml' -o -name '*m6*resume*.yml' \) -print -quit | grep .; then
            echo 'temporary M6 workflow remains at final head' >&2; exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: python -m pip install -e ".[ui,test,web]"
      - name: Build deterministic WB regression workbook
        run: |
          sudo install -d -m 0755 -o "$USER" -g "$USER" /mnt/data
          python scripts/generate_regression_workbook.py /mnt/data/REF_WB_archive_9.xlsx
          test -s /mnt/data/REF_WB_archive_9.xlsx
      - name: Migration head is M6
        shell: bash
        run: |
          set -euo pipefail
          test "$(alembic heads | tr -d '\r')" = '0007_m6_aggregation (head)'
          python - <<'PY'
          import os
          from sqlalchemy import create_engine
          e=create_engine(os.environ['WBCZ_TEST_DATABASE_URL'])
          with e.begin() as c:
              c.exec_driver_sql('DROP SCHEMA public CASCADE')
              c.exec_driver_sql('CREATE SCHEMA public')
          e.dispose()
          PY
          alembic upgrade head
          test "$(alembic current | tr -d '\r')" = '0007_m6_aggregation (head)'
      - name: Focused M6 tests
        run: python -m pytest -q tests/test_m6_aggregation.py
      - name: M5 M4 M3 M2 M1 regressions
        run: |
          python -m pytest -q tests/test_m5_turnover.py
          python -m pytest -q tests/test_m4_document_lifecycle.py
          python -m pytest -q tests/test_m3_auth_signing.py
          python -m pytest -q tests/test_m2_reference_products.py
          python -m pytest -q tests/test_m1_cis_inventory.py
      - name: P0 regressions
        run: |
          python -m pytest -q tests/test_p0_document_assembler.py
          python -m pytest -q tests/test_write_pipeline.py
          python -m pytest -q tests/test_p0_endtoend_wiring.py
      - name: Full PostgreSQL backend regression
        run: python -m pytest -q
      - name: Frontend regression
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npm run typecheck
          npm test
          npm run build
          if grep -R -E 'markirovka\.crpt\.ru|WBCZ_AGENT_MACHINE_TOKEN|/api/agent/' dist; then
            echo 'forbidden production/agent boundary leaked into browser bundle' >&2; exit 1
          fi
      - name: M6 security and contract assertions
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -F 'markirovka.crpt.ru' src/wbcz_web
          ! grep -R -E 'GENERIC_AGGREGATION_WRITE|GENERIC_DOCUMENT_SUBMIT|ARBITRARY_DOCUMENT_SUBMIT|RAW_URL|RAW_PATH|RAW_METHOD|CANCEL_AGGREGATION' src
          ! grep -R -E '(^|[^A-Z_])MOVE_CHILD([^A-Z_]|$)' src
          ! grep -R -E -- '-----BEGIN .*PRIVATE KEY-----' src frontend migrations
          ! grep -R -E 'WBCZ_AGENT_MACHINE_TOKEN=[A-Za-z0-9._~-]{16,}' src frontend migrations
          grep -F 'WBCZ_TRUE_API_WRITE_ENABLED=false' .env.production.example
          ! grep -R -E 'class FORMED|FORMED =|"FORMED"' src/wbcz/aggregation.py
          grep -F 'PRODUCT_SET' src/wbcz/aggregation.py
          grep -F 'AUTODISAGGREGATED' src/wbcz/aggregation.py
          grep -F 'AUTODISAGGREGATION' src/wbcz/aggregation.py
          python - <<'PY'
          from wbcz.aggregation import (
              M6_DOCUMENT_TYPES, M6_OPERATION_REGISTRY, AggregationOperationKind,
              M5_AGGREGATION_HARDENING, reconcile_m5_aggregation_side_effect,
              AGGREGATE_IDENTIFIER_ALLOWED_CHARS, validate_aggregate_identifier,
          )
          assert M6_DOCUMENT_TYPES == {'AGGREGATION_DOCUMENT','SETS_AGGREGATION','REAGGREGATION_DOCUMENT','DISAGGREGATION_DOCUMENT','ATK_AGGREGATION','ATK_TRANSFORMATION','ATK_DISAGGREGATION'}
          assert M6_OPERATION_REGISTRY[AggregationOperationKind.FORM_SET].document_type == 'SETS_AGGREGATION'
          assert M6_OPERATION_REGISTRY[AggregationOperationKind.FORM_SET_GENERIC_COMPATIBILITY].document_type == 'AGGREGATION_DOCUMENT'
          assert not M6_OPERATION_REGISTRY[AggregationOperationKind.AUTO_DISAGGREGATION].executable
          assert M5_AGGREGATION_HARDENING['LK_RECEIPT_CANCEL'].startswith('REREAD_RELATION')
          assert callable(reconcile_m5_aggregation_side_effect)
          assert '@' not in AGGREGATE_IDENTIFIER_ALLOWED_CHARS
          assert 'Ж' not in AGGREGATE_IDENTIFIER_ALLOWED_CHARS
          for ch in '-=>':
              assert ch in AGGREGATE_IDENTIFIER_ALLOWED_CHARS
          assert validate_aggregate_identifier('A' * 18) == 'A' * 18
          assert validate_aggregate_identifier("A" * 15 + "-=>") == "A" * 15 + "-=>"
          PY
          python -m pytest -q \
            tests/test_p0_endtoend_wiring.py::test_direct_vps_true_api_production_path_is_absent \
            tests/test_p0_endtoend_wiring.py::test_windows_runtime_and_outbound_agent_have_no_listener \
            tests/test_p0_endtoend_wiring.py::test_preflight_is_mutation_free_even_with_optional_cis

  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove M5 base and frozen P0
        shell: pwsh
        run: |
          $base=(git merge-base HEAD $env:M6_BASE_SHA).Trim()
          if ($base -ne $env:M6_BASE_SHA) { throw "wrong M6 base: $base" }
          $frozen=(git rev-parse origin/p0/test-candidate-001).Trim()
          if ($frozen -ne $env:FROZEN_P0_SHA) { throw "frozen P0 changed: $frozen" }
          $frontend=(git diff --name-only "$env:M6_BASE_SHA...HEAD" | Select-String '^frontend/')
          if ($frontend) { throw 'frontend source changed in M6' }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[ui,test,web]"
      - name: Focused M6 and M5 tests
        shell: pwsh
        run: |
          python -m pytest -q tests/test_m6_aggregation.py
          python -m pytest -q tests/test_m5_turnover.py
      - name: M4 M3 M2 M1 Windows regressions
        shell: pwsh
        run: |
          python -m pytest -q tests/test_m4_document_lifecycle.py
          python -m pytest -q tests/test_m3_auth_signing.py
          python -m pytest -q tests/test_m2_reference_products.py
          python -m pytest -q tests/test_m1_cis_inventory.py
          python -m pytest -q tests/test_windows_agent.py
      - name: P0 Windows safety regressions
        shell: pwsh
        run: |
          python -m pytest -q tests/test_p0_document_assembler.py
          python -m pytest -q `
            tests/test_p0_endtoend_wiring.py::test_windows_runtime_and_outbound_agent_have_no_listener `
            tests/test_p0_endtoend_wiring.py::test_preflight_is_mutation_free_even_with_optional_cis