name: M7 fix01 bootstrap retry

on:
  push:
    branches:
      - m7/edo-lite-foundation-001

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m7/edo-lite-foundation-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply focused M7 FIX-01
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p=Path(path); s=p.read_text(encoding='utf-8'); n=s.count(old)
              if n != 1: raise SystemExit(f'{path}: expected one match, got {n}')
              p.write_text(s.replace(old,new,1), encoding='utf-8')

          path='src/wbcz/edo_lite.py'
          replace_once(path, 'M7_PRODUCT_GROUP = "lp"\nEDO_LITE_ANNUAL_OUTGOING_LIMIT = 1000\n', 'M7_PRODUCT_GROUP = "lp"\nM7_PRODUCT_GROUP_WIRE_VALUE = 1\nEDO_LITE_ANNUAL_OUTGOING_LIMIT = 1000\n')
          replace_once(path, '''        limit = root.get("limit", 10)\n        offset = root.get("offset", 0)\n        if type(limit) is not int or not 1 <= limit <= 100:\n            raise EdoLiteContractError("limit must be 1..100")\n        if type(offset) is not int or offset < 0:\n            raise EdoLiteContractError("offset must be a non-negative integer")\n        out: dict[str, Any] = {"limit": limit, "offset": offset}\n        for key in ("created_from", "created_to", "partner_id", "status", "type", "folder"):\n            if key in root and root[key] is not None:\n                out[key] = _string(root[key], key)\n        if "partner_inn" in root and root["partner_inn"] is not None:\n            out["partner_inn"] = _inn(root["partner_inn"], "partner_inn")\n        asc = root.get("asc", False)\n        if type(asc) is not bool:\n            raise EdoLiteContractError("asc must be boolean")\n        out["asc"] = asc\n        if "product_group" in root and root["product_group"] is not None:\n            pg = _string(root["product_group"], "product_group", max_len=32)\n            if pg != M7_PRODUCT_GROUP:\n                raise EdoLiteContractError("M7 foundation is restricted to product_group=lp")\n            out["product_group"] = pg\n        return out\n''', '''        limit = root.get("limit", 10)\n        offset = root.get("offset", 0)\n        if type(limit) is not int or limit < 1:\n            raise EdoLiteContractError("limit must be a positive integer")\n        if type(offset) is not int or offset < 0:\n            raise EdoLiteContractError("offset must be a non-negative integer")\n        out: dict[str, Any] = {"limit": limit, "offset": offset}\n        for key in ("created_from", "created_to"):\n            if key in root and root[key] is not None:\n                value = root[key]\n                if type(value) is not int or value < 0:\n                    raise EdoLiteContractError(f"{key} must be a non-negative integer timestamp")\n                out[key] = value\n        if "partner_id" in root and root["partner_id"] is not None:\n            out["partner_id"] = _string(root["partner_id"], "partner_id")\n        if "partner_inn" in root and root["partner_inn"] is not None:\n            out["partner_inn"] = _inn(root["partner_inn"], "partner_inn")\n        if "status" in root and root["status"] is not None:\n            status = root["status"]\n            if type(status) is not int or status not in KNOWN_EDO_RAW_STATUSES:\n                raise EdoLiteContractError("status must be a documented numeric EDO status code")\n            out["status"] = status\n        if "type" in root and root["type"] is not None:\n            document_type = root["type"]\n            if type(document_type) is not int or document_type < 0:\n                raise EdoLiteContractError("type must be a non-negative integer official document code")\n            out["type"] = document_type\n        if "folder" in root and root["folder"] is not None:\n            folder = root["folder"]\n            if type(folder) is not int or not 0 <= folder <= 8:\n                raise EdoLiteContractError("folder must be an integer in range 0..8")\n            out["folder"] = folder\n        asc = root.get("asc", False)\n        if type(asc) is not bool:\n            raise EdoLiteContractError("asc must be boolean")\n        out["asc"] = asc\n        if "product_group" in root and root["product_group"] is not None:\n            pg = root["product_group"]\n            if type(pg) is not int or pg != M7_PRODUCT_GROUP_WIRE_VALUE:\n                raise EdoLiteContractError("M7 foundation requires numeric product_group=1 for lp")\n            out["product_group"] = pg\n        return out\n''')
          replace_once(path, '''        return (\n            query.get("sortBy") == ["created_at"]\n            and query.get("asc") in (["true"], ["false"])\n            and "limit" in query and "offset" in query\n        )\n''', '''        def one_uint(name: str) -> int | None:\n            values = query.get(name)\n            if values is None:\n                return None\n            raw = values[0]\n            if re.fullmatch(r"0|[1-9]\\d*", raw) is None:\n                return -1\n            return int(raw)\n\n        limit = one_uint("limit")\n        offset = one_uint("offset")\n        if limit is None or limit < 1 or offset is None or offset < 0:\n            return False\n        for name in ("created_from", "created_to"):\n            if name in query and one_uint(name) < 0:\n                return False\n        if "partner_inn" in query and re.fullmatch(r"\\d{10}|\\d{12}", query["partner_inn"][0]) is None:\n            return False\n        if "partner_id" in query and not query["partner_id"][0]:\n            return False\n        if "status" in query:\n            status = one_uint("status")\n            if status not in KNOWN_EDO_RAW_STATUSES:\n                return False\n        if "type" in query and one_uint("type") < 0:\n            return False\n        if "folder" in query:\n            folder = one_uint("folder")\n            if folder is None or not 0 <= folder <= 8:\n                return False\n        if "product_group" in query and one_uint("product_group") != M7_PRODUCT_GROUP_WIRE_VALUE:\n            return False\n        return query.get("sortBy") == ["created_at"] and query.get("asc") in (["true"], ["false"])\n''')
          replace_once(path, '''PRODUCTION_SCHEMA_REGISTRY: Mapping[str, SchemaDefinition] = {\n    "UPD_970_SELLER": _schema("UPD_970_SELLER", "UPD", "520/522/524", "SELLER"),\n    "UPD_970_BUYER": _schema("UPD_970_BUYER", "UPD", "521/525", "BUYER"),\n    "UPDI_970_SELLER": _schema("UPDI_970_SELLER", "UPDI", "820/822/824", "SELLER"),\n    "UPDI_970_BUYER": _schema("UPDI_970_BUYER", "UPDI", "821/825", "BUYER"),\n    "UKD_736_SELLER": _schema("UKD_736_SELLER", "UKD", "600/602/604", "SELLER", reason="TRUE_API_FNS_FORMAT_CONFLICT"),\n    "UKD_736_BUYER": _schema("UKD_736_BUYER", "UKD", "601/605", "BUYER", reason="TRUE_API_FNS_FORMAT_CONFLICT"),\n    "UKDI_736_SELLER": _schema("UKDI_736_SELLER", "UKDI", "700/702/704", "SELLER", reason="TRUE_API_FNS_FORMAT_CONFLICT"),\n    "UKDI_736_BUYER": _schema("UKDI_736_BUYER", "UKDI", "701/705", "BUYER", reason="TRUE_API_FNS_FORMAT_CONFLICT"),\n    "DP_UVUTOCH": _schema("DP_UVUTOCH", "SERVICE", None, function="UVTOCH"),\n    "DP_PRANNUL": _schema("DP_PRANNUL", "SERVICE", None, function="PRANNUL"),\n    "DP_UNISOOBSCH": _schema("DP_UNISOOBSCH", "SERVICE", None, function="UNISOOBSCH"),\n}\n''', '''PRODUCTION_SCHEMA_REGISTRY: Mapping[str, SchemaDefinition] = {\n    "UPD_970_520_SELLER": _schema("UPD_970_520_SELLER", "UPD", "520", "SELLER", "ДОП"),\n    "UPD_970_521_BUYER": _schema("UPD_970_521_BUYER", "UPD", "521", "BUYER", "ДОП"),\n    "UPD_970_522_SELLER": _schema("UPD_970_522_SELLER", "UPD", "522", "SELLER", "СЧФ"),\n    "UPD_970_524_SELLER": _schema("UPD_970_524_SELLER", "UPD", "524", "SELLER", "СЧФДОП"),\n    "UPD_970_525_BUYER": _schema("UPD_970_525_BUYER", "UPD", "525", "BUYER", "СЧФДОП"),\n    "UPDI_970_820_SELLER": _schema("UPDI_970_820_SELLER", "UPDI", "820", "SELLER", "ДОП"),\n    "UPDI_970_821_BUYER": _schema("UPDI_970_821_BUYER", "UPDI", "821", "BUYER", "ДОП"),\n    "UPDI_970_822_SELLER": _schema("UPDI_970_822_SELLER", "UPDI", "822", "SELLER", "СЧФ"),\n    "UPDI_970_824_SELLER": _schema("UPDI_970_824_SELLER", "UPDI", "824", "SELLER", "СЧФДОП"),\n    "UPDI_970_825_BUYER": _schema("UPDI_970_825_BUYER", "UPDI", "825", "BUYER", "СЧФДОП"),\n    "UKD_736_600_SELLER": _schema("UKD_736_600_SELLER", "UKD", "600", "SELLER", "ДИС", reason="TRUE_API_FNS_FORMAT_CONFLICT"),\n    "UKD_736_601_BUYER": _schema("UKD_736_601_BUYER", "UKD", "601", "BUYER", "ДИС", reason="TRUE_API_FNS_FORMAT_CONFLICT"),\n    "UKD_736_602_SELLER": _schema("UKD_736_602_SELLER", "UKD", "602", "SELLER", "КСЧФ", reason="TRUE_API_FNS_FORMAT_CONFLICT"),\n    "UKD_736_604_SELLER": _schema("UKD_736_604_SELLER", "UKD", "604", "SELLER", "КСФДИС", reason="TRUE_API_FNS_FORMAT_CONFLICT"),\n    "UKD_736_605_BUYER": _schema("UKD_736_605_BUYER", "UKD", "605", "BUYER", "КСФДИС", reason="TRUE_API_FNS_FORMAT_CONFLICT"),\n    "UKDI_736_700_SELLER": _schema("UKDI_736_700_SELLER", "UKDI", "700", "SELLER", "ДИС", reason="TRUE_API_FNS_FORMAT_CONFLICT"),\n    "UKDI_736_701_BUYER": _schema("UKDI_736_701_BUYER", "UKDI", "701", "BUYER", "ДИС", reason="TRUE_API_FNS_FORMAT_CONFLICT"),\n    "UKDI_736_702_SELLER": _schema("UKDI_736_702_SELLER", "UKDI", "702", "SELLER", "КСЧФ", reason="TRUE_API_FNS_FORMAT_CONFLICT"),\n    "UKDI_736_704_SELLER": _schema("UKDI_736_704_SELLER", "UKDI", "704", "SELLER", "КСФДИС", reason="TRUE_API_FNS_FORMAT_CONFLICT"),\n    "UKDI_736_705_BUYER": _schema("UKDI_736_705_BUYER", "UKDI", "705", "BUYER", "КСФДИС", reason="TRUE_API_FNS_FORMAT_CONFLICT"),\n    "DP_UVUTOCH": _schema("DP_UVUTOCH", "SERVICE", None, function="UVTOCH"),\n    "DP_PRANNUL": _schema("DP_PRANNUL", "SERVICE", None, function="PRANNUL"),\n    "DP_UNISOOBSCH": _schema("DP_UNISOOBSCH", "SERVICE", None, function="UNISOOBSCH"),\n}\n''')

          tp=Path('tests/test_m7_edo_lite_foundation.py')
          s=tp.read_text(encoding='utf-8')
          old='    M7_MUTATION_REGISTRY,\n    M7_READ_JOB_TYPES,\n'
          if s.count(old)!=1: raise SystemExit('test import anchor mismatch')
          s=s.replace(old, '    M7_MUTATION_REGISTRY,\n    M7_PRODUCT_GROUP_WIRE_VALUE,\n    M7_READ_JOB_TYPES,\n',1)
          s=s.replace('PRODUCTION_SCHEMA_REGISTRY["UKD_736_SELLER"]', 'PRODUCTION_SCHEMA_REGISTRY["UKD_736_600_SELLER"]')
          count=s.count('schema_identity="UPD_970_SELLER"')
          if count != 2: raise SystemExit(f'expected two old UPD schema references, got {count}')
          s=s.replace('schema_identity="UPD_970_SELLER"', 'schema_identity="UPD_970_520_SELLER"')
          tp.write_text(s, encoding='utf-8')

          tests='''\n\ndef test_list_query_official_numeric_wire_types_and_serialization() -> None:\n    payload = canonical("EDO_OUTGOING_LIST", {\n        "limit": 101, "offset": 0, "created_from": 1770000000, "created_to": 1770003600,\n        "status": 3, "type": 520, "folder": 3, "product_group": 1,\n    })\n    assert payload["limit"] == 101 and M7_PRODUCT_GROUP_WIRE_VALUE == 1\n    spec = build_edo_read_spec("EDO_OUTGOING_LIST", payload)\n    for fragment in ("limit=101", "offset=0", "sortBy=created_at", "asc=false", "created_from=1770000000", "created_to=1770003600", "status=3", "type=520", "folder=3", "product_group=1"):\n        assert fragment in spec.target\n    assert "product_group=lp" not in spec.target\n    assert is_allowed_edo_read_target(spec)\n\n\n@pytest.mark.parametrize("bad", [\n    {"created_from": "1770000000"}, {"created_to": "1770003600"}, {"status": "3"}, {"type": "520"},\n    {"folder": "3"}, {"folder": 9}, {"product_group": "lp"}, {"product_group": 2},\n    {"created_from": True}, {"created_to": True}, {"status": True}, {"type": True}, {"folder": True},\n    {"product_group": True}, {"limit": True}, {"offset": True},\n])\ndef test_list_query_rejects_non_contract_integer_values(bad: dict) -> None:\n    with pytest.raises(EdoLiteContractError):\n        validate_edo_read_payload("EDO_OUTGOING_LIST", bad)\n\n\ndef test_list_query_integer_boundaries_and_no_invented_limit_100() -> None:\n    assert canonical("EDO_OUTGOING_LIST", {"folder": 0})["folder"] == 0\n    assert canonical("EDO_OUTGOING_LIST", {"folder": 8})["folder"] == 8\n    assert canonical("EDO_OUTGOING_LIST", {"limit": 1000})["limit"] == 1000\n    assert canonical("EDO_OUTGOING_LIST", {"offset": 0})["offset"] == 0\n    for bad in ({"limit": 0}, {"offset": -1}, {"created_from": -1}, {"created_to": -1}):\n        with pytest.raises(EdoLiteContractError): validate_edo_read_payload("EDO_OUTGOING_LIST", bad)\n    assert not is_allowed_edo_read_target(EdoReadSpec("EDO_OUTGOING_LIST", "GET", "/api/v3/true-api/elk/outgoing-documents?limit=10&offset=0&sortBy=created_at&asc=false&product_group=lp", "x"))\n\n\ndef test_schema_registry_has_one_exact_official_type_per_disabled_row() -> None:\n    expected = {\n        ("UPD","520","SELLER","ДОП"),("UPD","521","BUYER","ДОП"),("UPD","522","SELLER","СЧФ"),("UPD","524","SELLER","СЧФДОП"),("UPD","525","BUYER","СЧФДОП"),\n        ("UPDI","820","SELLER","ДОП"),("UPDI","821","BUYER","ДОП"),("UPDI","822","SELLER","СЧФ"),("UPDI","824","SELLER","СЧФДОП"),("UPDI","825","BUYER","СЧФДОП"),\n        ("UKD","600","SELLER","ДИС"),("UKD","601","BUYER","ДИС"),("UKD","602","SELLER","КСЧФ"),("UKD","604","SELLER","КСФДИС"),("UKD","605","BUYER","КСФДИС"),\n        ("UKDI","700","SELLER","ДИС"),("UKDI","701","BUYER","ДИС"),("UKDI","702","SELLER","КСЧФ"),("UKDI","704","SELLER","КСФДИС"),("UKDI","705","BUYER","КСФДИС"),\n    }\n    rows=[x for x in PRODUCTION_SCHEMA_REGISTRY.values() if x.family != "SERVICE"]\n    assert {(x.family,x.official_type_code,x.title_role,x.function) for x in rows} == expected\n    assert all(x.official_type_code is None or "/" not in x.official_type_code for x in PRODUCTION_SCHEMA_REGISTRY.values())\n    by_code={x.official_type_code:x for x in rows}\n    for code in {"522","602","702","822"}: assert by_code[code].title_role == "SELLER"\n    assert all(not x.enabled_for_lp for x in PRODUCTION_SCHEMA_REGISTRY.values())\n    assert all(x.disabled_reason == "TRUE_API_FNS_FORMAT_CONFLICT" for x in rows if x.family in {"UKD","UKDI"})\n    assert all(x.disabled_reason == "OFFICIAL_SCHEMA_NOT_PINNED" for x in rows if x.family in {"UPD","UPDI"})\n    for x in PRODUCTION_SCHEMA_REGISTRY.values():\n        assert x.artifact_filename is None and x.artifact_sha256 is None and x.xsd_filename is None and x.xsd_sha256 is None\n        assert x.root is None and x.target_namespace is None\n'''
          tp.write_text(tp.read_text(encoding='utf-8')+tests, encoding='utf-8')

          docs='docs/M7_EDO_LITE_FOUNDATION_CONTRACT.md'
          replace_once(docs, 'List requests expose only `limit`, `offset`, `created_from`, `created_to`, `partner_inn`, `partner_id`, `status`, `type`, `folder`, `asc`, `product_group`; `sortBy` is fixed to `created_at`. Defaults are `limit=10`, `offset=0`. Remote `has_next_page` is preserved as evidence. No cursor, document-number filter, event-id filter or snapshot guarantee is invented.\n', 'List requests expose only the documented §9.2.8 fields. `limit` and `offset` are integers with defaults `10` and `0`; `limit` must be positive and `MAX_LIMIT=NOT_DOCUMENTED` (no CRPT maximum is invented). `created_from`/`created_to` are non-negative integer timestamps. `status` and `type` are numeric codes; `folder` is integer `0..8`; `asc` is boolean; `sortBy` is fixed to `created_at`. The local product-group slug `lp` is **not** the §9.2.8 wire value: optional `product_group` is numeric code `1`, where the official product-group registry maps `1 = lp`. Remote `has_next_page` is preserved as evidence. No cursor, document-number filter, event-id filter or snapshot guarantee is invented.\n')
          replace_once(docs, '## Disabled production schema registry\n\n', '## Disabled production schema registry\n\nRegistry granularity is exact: one production row represents one official type code, never a slash-separated local group. Current disabled rows preserve established UPD/UPDi/UKD/UKDi code, title-role and function metadata. Seller-only types `522`, `602`, `702`, `822` have no synthetic buyer rows. Service rows remain fail-closed without invented type codes.\n\n')
          PY
          python -m compileall -q src/wbcz/edo_lite.py tests/test_m7_edo_lite_foundation.py
          git diff --check
      - name: Run focused tests
        run: |
          python -m pip install -e ".[ui,test,web]"
          python -m pytest -q tests/test_m7_edo_lite_foundation.py tests/test_windows_agent.py
      - name: Commit focused fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/wbcz/edo_lite.py tests/test_m7_edo_lite_foundation.py docs/M7_EDO_LITE_FOUNDATION_CONTRACT.md
          git diff --cached --check
          git commit -m 'fix: align M7 EDO list and schema registry contracts'
          git push origin HEAD:m7/edo-lite-foundation-001
