name: M2 test fix

on:
  push:
    branches:
      - m2/reference-products-readonly-001
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m2/reference-products-readonly-001
      - name: Isolate PostgreSQL persistence regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_m2_reference_products.py')
          s=p.read_text(encoding='utf-8')
          old='''    from wbcz.windows_agent import AgentResult\n    from wbcz_web.repositories import SqlAlchemyAgentJobStore\n\n    job = AgentJob("job_m2_persist_test", AgentJobType.PARTICIPANTS, "m2read:persist", P0_PG, INN, read_payload={"inns": [INN]})\n    engine = create_engine(url)\n    Session = sessionmaker(bind=engine, expire_on_commit=False)\n    with Session.begin() as db:\n        old = db.get(__import__("wbcz_web.models", fromlist=["AgentJobRecord"]).AgentJobRecord, job.job_id)\n'''
          new='''    from wbcz.windows_agent import AgentResult\n    from wbcz_web.models import AgentJobRecord, Base\n    from wbcz_web.repositories import SqlAlchemyAgentJobStore\n\n    job = AgentJob("job_m2_persist_test", AgentJobType.PARTICIPANTS, "m2read:persist", P0_PG, INN, read_payload={"inns": [INN]})\n    engine = create_engine(url)\n    # Other full-suite migration tests intentionally exercise destructive clean-db paths.\n    # Recreate the ORM schema here so this persistence/reopen regression is order-independent.\n    Base.metadata.create_all(engine)\n    Session = sessionmaker(bind=engine, expire_on_commit=False)\n    with Session.begin() as db:\n        old = db.get(AgentJobRecord, job.job_id)\n'''
          if old not in s:
              raise SystemExit('target persistence-test block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit test fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_m2_reference_products.py
          git commit -m 'test: isolate M2 PostgreSQL persistence regression'
          git push origin HEAD:m2/reference-products-readonly-001
