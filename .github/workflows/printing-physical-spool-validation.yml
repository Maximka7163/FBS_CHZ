name: Printing physical spool validation

on:
  push:
    branches: [printing/physical-spool-001]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PRINT_SOURCE_SHA: "13acd00460ce8f7dbfc87280ebcdd3e14123a837"
  PRINT_MIGRATION: "0020_printing_physical_spool"
  WBCZ_AUDIT_PSEUDONYM_KEY: ${{ github.sha }}
  WBCZ_AUDIT_PSEUDONYM_KEY_ID: "printing-physical-spool-ci-v1"

jobs:
  physical-domain-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify source ancestry and migration history
        run: |
          git merge-base --is-ancestor "$PRINT_SOURCE_SHA" HEAD
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          unexpected="$(git diff --name-only "$PRINT_SOURCE_SHA" HEAD -- migrations/versions | grep -v '^migrations/versions/0020_printing_physical_spool.py$' || true)"
          test -z "$unexpected"
      - name: Install DataMatrix runtime
        run: |
          sudo apt-get update
          if apt-cache show libdmtx0b >/dev/null 2>&1; then sudo apt-get install -y libdmtx0b fonts-dejavu-core; else sudo apt-get install -y libdmtx0a fonts-dejavu-core; fi
      - name: Install runtime and tests
        run: |
          python -m pip install -r requirements.production.lock
          python -m pip install --no-deps -e .
          python -m pip install "pytest==9.1.1" "httpx==0.28.1"
      - name: Compile Phase C
        run: python -m compileall -q src tests scripts
      - name: Physical renderer, replay, ambiguity and regressions
        run: |
          python -m pytest -q             tests/test_physical_printing.py             tests/test_printing_sensitive_crypto.py             tests/test_printer_profiles.py             tests/test_printing_foundation.py
      - name: Closed raster-only physical API check
        run: |
          ! grep -R -E 'WritePrinter\(|ZPL|EPL|CPCL|lpszDatatype.*RAW'             src/wbcz/physical_printing.py src/wbcz_web/services/physical_printing.py
      - name: Production execution and SUZ stay blocked
        run: |
          grep -F 'WBCZ_PRINT_EXECUTION_ENABLED: "false"' docker-compose.prod.yml
          grep -F 'WBCZ_SUZ_FULL_KM_REMOTE_ACQUISITION_ENABLED: "false"' docker-compose.prod.yml
          grep -F 'if self.environment == "production" and self.print_execution_enabled:' src/wbcz_web/config.py
      - name: Secret scan
        run: python scripts/m15_secret_scan.py
      - name: Dependency audit
        run: |
          python -m pip install "pip-audit==2.10.1"
          pip-audit -r requirements.production.lock --strict

  postgres-physical-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: wbcz_physical_spool
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d wbcz_physical_spool"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WBCZ_ENV: test
      WBCZ_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/wbcz_physical_spool
      WBCZ_TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/wbcz_physical_spool
      WBCZ_OWN_INN: "1234567890"
      WBCZ_COOKIE_SECURE: "false"
      WBCZ_BUILD_SHA: ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install DataMatrix runtime
        run: |
          sudo apt-get update
          if apt-cache show libdmtx0b >/dev/null 2>&1; then sudo apt-get install -y libdmtx0b fonts-dejavu-core; else sudo apt-get install -y libdmtx0a fonts-dejavu-core; fi
      - name: Install runtime and tests
        run: |
          python -m pip install -r requirements.production.lock
          python -m pip install --no-deps -e .
          python -m pip install "pytest==9.1.1" "httpx==0.28.1"
      - name: Exact migration head
        run: test "$(alembic heads | awk '{print $1}')" = "$PRINT_MIGRATION"
      - name: Fresh database to 0020
        run: |
          alembic upgrade "$PRINT_MIGRATION"
          test "$(alembic current | awk '{print $1}')" = "$PRINT_MIGRATION"
      - name: Focused PostgreSQL printing tests
        run: python -m pytest -q tests/test_printing_postgres.py
      - name: Validate 0019 to 0020 upgrade
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE wbcz_physical_upgrade'
          UPGRADE_URL='postgresql+psycopg://postgres@127.0.0.1:5432/wbcz_physical_upgrade'
          WBCZ_DATABASE_URL="$UPGRADE_URL" alembic upgrade 0019_printing_printer_profiles
          test "$(WBCZ_DATABASE_URL="$UPGRADE_URL" alembic current | awk '{print $1}')" = "0019_printing_printer_profiles"
          WBCZ_DATABASE_URL="$UPGRADE_URL" alembic upgrade "$PRINT_MIGRATION"
          test "$(WBCZ_DATABASE_URL="$UPGRADE_URL" alembic current | awk '{print $1}')" = "$PRINT_MIGRATION"
      - name: Full backend regression
        run: python -m pytest -q tests

  windows-agent-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install DataMatrix runtime
        run: |
          sudo apt-get update
          if apt-cache show libdmtx0b >/dev/null 2>&1; then sudo apt-get install -y libdmtx0b fonts-dejavu-core; else sudo apt-get install -y libdmtx0a fonts-dejavu-core; fi
      - name: Install runtime and tests
        run: |
          python -m pip install -r requirements.production.lock
          python -m pip install --no-deps -e .
          python -m pip install "pytest==9.1.1" "httpx==0.28.1"
      - name: Windows Agent Phase A/B/C regressions
        run: |
          python -m pytest -q             tests/test_windows_agent.py             tests/test_agent_protocol_runtime.py             tests/test_printing_sensitive_crypto.py             tests/test_printer_profiles.py             tests/test_physical_printing.py

  windows-gdi-load-smoke:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and tests
        run: |
          python -m pip install -r requirements.production.lock
          python -m pip install --no-deps -e .
          python -m pip install "pytest==9.1.1"
      - name: Load Windows printing runtime without printing
        run: python -m pytest -q tests/test_physical_printing.py -k "windows_gdi_and_status_adapters_load_without_printing or windows_replay_fsync_smoke_uses_real_os_fsync or windows_libdmtx_is_loaded_from_pinned_package_path_without_printing"
