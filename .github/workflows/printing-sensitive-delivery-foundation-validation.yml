name: Printing sensitive delivery foundation validation

on:
  push:
    branches: [printing/sensitive-delivery-foundation-001]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SENSITIVE_SOURCE_SHA: "142942bde25182b97d05b81e01d3dcef06fcca94"
  SENSITIVE_MIGRATION: "0018_printing_sensitive_delivery"
  WBCZ_AUDIT_PSEUDONYM_KEY: ${{ github.sha }}
  WBCZ_AUDIT_PSEUDONYM_KEY_ID: "printing-sensitive-ci-v1"

jobs:
  hpke-security-redaction:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify source ancestry and migration history
        run: |
          git merge-base --is-ancestor "$SENSITIVE_SOURCE_SHA" HEAD
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          unexpected="$(git diff --name-only "$SENSITIVE_SOURCE_SHA" HEAD -- migrations/versions | grep -v '^migrations/versions/0018_printing_sensitive_delivery.py$' || true)"
          test -z "$unexpected"
      - name: Install DataMatrix runtime
        run: |
          sudo apt-get update
          if apt-cache show libdmtx0b >/dev/null 2>&1; then sudo apt-get install -y libdmtx0b; else sudo apt-get install -y libdmtx0a; fi
      - name: Install runtime and test tools
        run: |
          python -m pip install -r requirements.production.lock
          python -m pip install --no-deps -e .
          python -m pip install "pytest==9.1.1" "httpx==0.28.1" "zxing-cpp==3.1.1" "numpy==2.3.3"
      - name: Compile implementation
        run: python -m compileall -q src tests scripts
      - name: HPKE agent and renderer regressions
        run: python -m pytest -q tests/test_printing_sensitive_crypto.py tests/test_printing_foundation.py
      - name: Phase A excludes printer APIs
        run: |
          ! grep -R -E 'EnumPrinters|StartDoc|win32print|WritePrinter|OpenPrinter|GDI32' src/wbcz/printing_sensitive.py src/wbcz/printing_agent_v2.py src/wbcz_web/services/printing_sensitive_delivery.py
      - name: Fail-closed gates remain
        run: |
          grep -F 'WBCZ_PRINT_EXECUTION_ENABLED: "false"' docker-compose.prod.yml
          grep -F 'WBCZ_SUZ_FULL_KM_REMOTE_ACQUISITION_ENABLED: "false"' docker-compose.prod.yml
          grep -F 'if self.environment == "production" and self.print_execution_enabled:' src/wbcz_web/config.py
          test -f docs/PRINTING_SENSITIVE_DELIVERY_FOUNDATION.md
      - name: Repository secret scan
        run: python scripts/m15_secret_scan.py
      - name: Dependency vulnerability audit
        run: |
          python -m pip install "pip-audit==2.10.1"
          pip-audit -r requirements.production.lock --strict

  postgres-migration-tenancy-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: wbcz_printing_sensitive
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d wbcz_printing_sensitive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WBCZ_ENV: test
      WBCZ_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/wbcz_printing_sensitive
      WBCZ_TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/wbcz_printing_sensitive
      WBCZ_OWN_INN: "1234567890"
      WBCZ_COOKIE_SECURE: "false"
      WBCZ_BUILD_SHA: ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install DataMatrix runtime
        run: |
          sudo apt-get update
          if apt-cache show libdmtx0b >/dev/null 2>&1; then sudo apt-get install -y libdmtx0b; else sudo apt-get install -y libdmtx0a; fi
      - name: Install runtime and test tools
        run: |
          python -m pip install -r requirements.production.lock
          python -m pip install --no-deps -e .
          python -m pip install "pytest==9.1.1" "httpx==0.28.1" "zxing-cpp==3.1.1" "numpy==2.3.3"
      - name: Exact migration head
        run: test "$(alembic heads | awk '{print $1}')" = "$SENSITIVE_MIGRATION"
      - name: Fresh database to 0018
        run: |
          alembic upgrade "$SENSITIVE_MIGRATION"
          test "$(alembic current | awk '{print $1}')" = "$SENSITIVE_MIGRATION"
      - name: Focused PostgreSQL printing tests
        run: python -m pytest -q tests/test_printing_postgres.py
      - name: Validate 0017 to 0018 upgrade
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE wbcz_sensitive_upgrade'
          UPGRADE_URL='postgresql+psycopg://postgres@127.0.0.1:5432/wbcz_sensitive_upgrade'
          WBCZ_DATABASE_URL="$UPGRADE_URL" alembic upgrade 0017_printing_local_foundation
          test "$(WBCZ_DATABASE_URL="$UPGRADE_URL" alembic current | awk '{print $1}')" = "0017_printing_local_foundation"
          WBCZ_DATABASE_URL="$UPGRADE_URL" alembic upgrade "$SENSITIVE_MIGRATION"
          test "$(WBCZ_DATABASE_URL="$UPGRADE_URL" alembic current | awk '{print $1}')" = "$SENSITIVE_MIGRATION"
      - name: Full backend regression
        run: python -m pytest -q tests

  windows-agent-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and test tools
        run: |
          python -m pip install -r requirements.production.lock
          python -m pip install --no-deps -e .
          python -m pip install "pytest==9.1.1" "httpx==0.28.1"
      - name: Existing agent and v2 safe-store regressions
        run: python -m pytest -q tests/test_windows_agent.py tests/test_agent_protocol_runtime.py tests/test_printing_sensitive_crypto.py

  windows-dpapi-synthetic:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install synthetic DPAPI dependencies
        run: |
          python -m pip install "cryptography==50.0.1" "pytest==9.1.1"
          python -m pip install --no-deps -e .
      - name: Real Windows DPAPI synthetic roundtrip
        run: python -m pytest -q tests/test_printing_sensitive_crypto.py -k real_windows_dpapi_roundtrip_synthetic_only
