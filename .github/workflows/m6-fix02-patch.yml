name: M6 fix02 patch

on:
  push:
    branches:
      - m6/aggregation-001

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m6/aggregation-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply focused charset fix only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, got {n}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/wbcz/aggregation.py',
              '"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789%&\'\\"()*+,_./:;<?!"',
              '"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789%&\'\\"()*+,-_./:;<=>?!"',
          )

          replace_once(
              'tests/test_m6_aggregation.py',
              '''    allowed_specials = "A%&'\\"()*+,_./:;<?!"\n    assert len(allowed_specials) == 18\n''',
              '''    allowed_specials = "A%&'\\"()*+,-_./:;<=>?!"\n    assert len(allowed_specials) == 21\n''',
          )

          replace_once(
              'docs/M6_AGGREGATION_CONTRACT.md',
              '''`+`, `,`, `_`, `.`, `/`, `:`, `;`, `<`, `?`, `!`.''',
              '''`+`, `,`, `-`, `_`, `.`, `/`, `:`, `;`, `<`, `=`, `>`, `?`, `!`.''',
          )

          replace_once(
              '.github/workflows/m6-aggregation-validation.yml',
              '''          assert '@' not in AGGREGATE_IDENTIFIER_ALLOWED_CHARS\n          assert 'Ж' not in AGGREGATE_IDENTIFIER_ALLOWED_CHARS\n          assert validate_aggregate_identifier('A' * 18) == 'A' * 18\n''',
              '''          assert '@' not in AGGREGATE_IDENTIFIER_ALLOWED_CHARS\n          assert 'Ж' not in AGGREGATE_IDENTIFIER_ALLOWED_CHARS\n          for ch in '-=>':\n              assert ch in AGGREGATE_IDENTIFIER_ALLOWED_CHARS\n          assert validate_aggregate_identifier('A' * 18) == 'A' * 18\n          assert validate_aggregate_identifier("A" * 15 + "-=>") == "A" * 15 + "-=>"\n''',
          )
          PY
          python -m compileall -q src tests/test_m6_aggregation.py
          git diff --check
          python -m pytest -q tests/test_m6_aggregation.py
      - name: Commit focused fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/wbcz/aggregation.py tests/test_m6_aggregation.py docs/M6_AGGREGATION_CONTRACT.md .github/workflows/m6-aggregation-validation.yml
          git diff --cached --check
          git commit -m 'fix: include official aggregate identifier characters'
          git push origin HEAD:m6/aggregation-001
