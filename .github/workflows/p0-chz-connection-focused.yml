name: P0 CHZ connection focused validation

on:
  push:
    branches: [fix/fbs-worker-healthcheck-001]
  workflow_dispatch:

permissions:
  contents: read

env:
  WBCZ_ENV: test
  WBCZ_OWN_INN: "1234567890"
  WBCZ_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_p0_chz
  WBCZ_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_p0_chz
  WBCZ_MIGRATION_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_p0_chz
  WBCZ_AGENT_ENABLED: "true"
  WBCZ_AGENT_LEGACY_BOOTSTRAP_ENABLED: "true"
  WBCZ_AGENT_MACHINE_TOKEN: "focused-test-agent-token-0123456789"
  WBCZ_TRUE_API_REAL_READ_ENABLED: "false"
  WBCZ_TRUE_API_WRITE_ENABLED: "false"
  WBCZ_FBS_DRY_RUN_ONLY: "true"
  WBCZ_PRINTING_ENABLED: "false"
  WBCZ_PRINT_EXECUTION_ENABLED: "false"
  WBCZ_SUZ_FULL_KM_REMOTE_ACQUISITION_ENABLED: "false"

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wbcz_p0_chz
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wbcz_p0_chz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install focused backend dependencies
        run: |
          python -m pip install -r requirements.production.lock
          python -m pip install --no-deps -e .
          python -m pip install "pytest==9.1.1" "httpx==0.28.1"

      - name: Prepare isolated PostgreSQL schema
        run: python -m alembic -c alembic.ini upgrade 0020_printing_physical_spool

      - name: P0 CHZ focused backend tests
        run: >-
          python -m pytest -q
          tests/test_p0_chz_connection_e2e.py
          tests/test_m1_cis_inventory.py
          tests/test_control.py
          tests/test_wb_regression.py
          tests/test_m14_integration_settings.py
          tests/test_m15_postgres_runtime.py
          tests/test_windows_agent.py
          tests/test_fbs_worker_healthcheck.py
          tests/test_fbs_dryrun_deployment_prep.py

      - name: Frontend tests and typecheck
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build
