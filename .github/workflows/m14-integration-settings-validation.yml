name: M14 integration settings backend validation

on:
  push:
    branches: [m14/integration-settings-001]
  workflow_dispatch:

env:
  WBCZ_ENV: test
  WBCZ_OWN_INN: "1234567890"
  WBCZ_PUBLIC_REGISTRATION_ENABLED: "false"
  WBCZ_AGENT_ENABLED: "true"
  WBCZ_AGENT_LEGACY_BOOTSTRAP_ENABLED: "true"
  WBCZ_AGENT_MACHINE_TOKEN: "M14-CI-LEGACY-BOOTSTRAP-TOKEN-0123456789"
  WBCZ_TRUE_API_WRITE_ENABLED: "false"
  WBCZ_TRUE_API_REPORTS_ENABLED: "false"
  WBCZ_AUDIT_PSEUDONYM_KEY: "m14-test-only-audit-pseudonym-key-0000000000000001"
  WBCZ_AUDIT_PSEUDONYM_KEY_ID: "m14-test-v1"
  M14_ACCEPTED_BASE: "fda8dcd12d66f4c363e9239e6cc2783982ec4da3"

jobs:
  validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wbcz_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d wbcz_test"
          --health-interval=2s --health-timeout=3s --health-retries=20
    env:
      WBCZ_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_test
      WBCZ_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_test
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}

      - name: Accepted base and frozen surfaces
        shell: bash
        run: |
          git merge-base --is-ancestor "$M14_ACCEPTED_BASE" HEAD
          bad="$(git diff --name-only "$M14_ACCEPTED_BASE" HEAD -- migrations/versions | grep -E '^migrations/versions/(000[1-9]|001[0-4])_' || true)"
          test -z "$bad"
          git diff --exit-code "$M14_ACCEPTED_BASE" HEAD -- frontend src/wbcz_ui
          changed="$(git diff --name-only "$M14_ACCEPTED_BASE" HEAD)"
          ! printf '%s\n' "$changed" | grep -Ei '(^|[/_.-])m15([/_.-]|$)'

      - run: python -m pip install -e ".[ui,test,web]"
      - run: python -m compileall -q src migrations tests/test_m14_integration_settings.py

      - name: Migration head
        run: test "$(alembic heads | awk '{print $1}')" = "0015_m14_integration_settings"

      - run: alembic upgrade head
      - run: python -m pytest -q tests/test_m14_integration_settings.py
      - run: python -m pytest -q tests/test_m13_audit_history.py tests/test_m12_users_roles.py
      - run: python -m pytest -q tests

      - name: M14 safety flags
        run: python scripts/m14_ci_contract.py

      - name: Frontend regression
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build

  migration-path:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wbcz_m14
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d wbcz_m14"
          --health-interval=2s --health-timeout=3s --health-retries=20
    env:
      WBCZ_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_m14
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[ui,test,web]"
      - run: alembic upgrade 0014_m13_audit_history
      - run: alembic upgrade 0015_m14_integration_settings
      - run: test "$(alembic current | awk '{print $1}')" = "0015_m14_integration_settings"
      - run: alembic downgrade 0014_m13_audit_history
