name: M8 one-shot tightening

on:
  push:
    branches:
      - m8/suz-foundation-001

permissions:
  contents: write

jobs:
  tighten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m8/suz-foundation-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply tightening
        run: python scripts/m8_contract_tightening.py
      - name: Install focused test dependencies
        run: python -m pip install -e ".[test,web]"
      - name: Focused verification
        run: python -m pytest -q tests/test_m8_suz_foundation.py
      - name: Commit source changes and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/wbcz/suz_foundation.py src/wbcz_web/models/suz.py tests/test_m8_suz_foundation.py
          git rm scripts/m8_contract_tightening.py .github/workflows/m8-one-shot-tightening.yml
          git commit -m 'fix: tighten M8 source-confirmed foundation contracts'
          git push origin HEAD:m8/suz-foundation-001
