name: M10 Ozon safe foundation validation

on:
  push:
    branches:
      - m10/ozon-foundation-001
  workflow_dispatch:

permissions:
  contents: read

env:
  M10_BASE_SHA: c0fed29533d4522d12015e15bfa2a15e9ff73002
  FROZEN_P0_SHA: 395701f1757711b5a11b9348d929182d40f51f0a
  WBCZ_ENV: test
  WBCZ_OWN_INN: "1234567890"
  WBCZ_TRUE_API_WRITE_ENABLED: "false"
  WBCZ_WB_WRITE_ENABLED: "false"
  WBCZ_OZON_WRITE_ENABLED: "false"

jobs:
  linux-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wbcz_m10
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wbcz_m10"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=20
    env:
      WBCZ_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_m10
      WBCZ_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_m10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact M9 base, frozen P0, historical migrations and frontend freeze
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$M10_BASE_SHA")" = "$M10_BASE_SHA"
          test "$(git rev-parse "$M10_BASE_SHA")" = "$M10_BASE_SHA"
          test "$(git rev-parse origin/p0/test-candidate-001)" = "$FROZEN_P0_SHA"

          if git diff --name-only "$M10_BASE_SHA"...HEAD | grep '^frontend/'; then
            echo 'FRONTEND_SOURCE_CHANGES must remain NONE in M10 foundation' >&2; exit 1
          fi

          if git diff --name-only "$M10_BASE_SHA"...HEAD | grep -E '^migrations/versions/00(0[1-9]|10)_'; then
            echo 'historical migration changed in M10' >&2; exit 1
          fi

          git diff --quiet "$M10_BASE_SHA"...HEAD --             src/wbcz/wb_fbs.py             src/wbcz_web/models/wb_fbs.py             migrations/versions/0010_m9_wb.py             docs/M9_WB_FBS_READONLY_CONTRACT.md             tests/test_m9_wb_fbs.py             .github/workflows/m9-wb-fbs-readonly-validation.yml

          if git diff --name-only "$M10_BASE_SHA"...HEAD | grep -Ei '(^|/)(m11)(_|/|\.)'; then
            echo 'future milestone must not start in M10 foundation' >&2; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        run: python -m pip install -e ".[ui,test,web]"

      - name: Build deterministic WB regression workbook
        run: |
          sudo install -d -m 0755 -o "$USER" -g "$USER" /mnt/data
          python scripts/generate_regression_workbook.py /mnt/data/REF_WB_archive_9.xlsx
          test -s /mnt/data/REF_WB_archive_9.xlsx

      - name: Migration head is M10 foundation
        shell: bash
        run: |
          set -euo pipefail
          test "$(alembic heads | tr -d '\r')" = '0011_m10_ozon (head)'
          python - <<'PY'
          import os
          from sqlalchemy import create_engine
          e=create_engine(os.environ['WBCZ_TEST_DATABASE_URL'])
          with e.begin() as c:
              c.exec_driver_sql('DROP SCHEMA public CASCADE')
              c.exec_driver_sql('CREATE SCHEMA public')
          e.dispose()
          PY
          alembic upgrade head
          test "$(alembic current | tr -d '\r')" = '0011_m10_ozon (head)'
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          e=create_engine(os.environ['WBCZ_TEST_DATABASE_URL'])
          with e.connect() as c:
              tables={r[0] for r in c.execute(text("select table_name from information_schema.tables where table_schema='public'"))}
              expected={
                  'ozon_connections','ozon_postings','ozon_items','ozon_marking_bindings',
                  'ozon_events','ozon_returns','ozon_sync_cursors','ozon_reconciliation','ozon_paid_evidence'
              }
              assert expected <= tables
              conn={r[0].lower() for r in c.execute(text("select column_name from information_schema.columns where table_name='ozon_connections'"))}
              assert {'client_id','api_key_secret_ref','api_key_expires_at','participant_inn'} <= conn
              assert not {'api_key','raw_api_key','authorization','auth_header','secret'} & conn
              mark={r[0].lower() for r in c.execute(text("select column_name from information_schema.columns where table_name='ozon_marking_bindings'"))}
              assert {'ciphertext','nonce','auth_tag','plaintext_sha256','ciphertext_sha256','key_version'} <= mark
              assert not {'cis','sgtin','kiz','plaintext','full_marking','marking_code'} & mark
          e.dispose()
          PY

      - name: Focused M10 foundation tests
        run: python -m pytest -q tests/test_m10_ozon_foundation.py

      - name: M9 through M1 regressions
        run: |
          python -m pytest -q tests/test_m9_wb_fbs.py
          python -m pytest -q tests/test_m8_suz_foundation.py
          python -m pytest -q tests/test_m7_edo_lite_foundation.py
          python -m pytest -q tests/test_m6_aggregation.py
          python -m pytest -q tests/test_m5_turnover.py
          python -m pytest -q tests/test_m4_document_lifecycle.py
          python -m pytest -q tests/test_m3_auth_signing.py
          python -m pytest -q tests/test_m2_reference_products.py
          python -m pytest -q tests/test_m1_cis_inventory.py

      - name: P0 regressions
        run: |
          python -m pytest -q tests/test_p0_document_assembler.py
          python -m pytest -q tests/test_write_pipeline.py
          python -m pytest -q tests/test_p0_endtoend_wiring.py

      - name: Full PostgreSQL backend regression
        run: python -m pytest -q

      - name: Frontend regression
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npm run typecheck
          npm test
          npm run build
          if grep -R -Ei 'api-seller\.ozon\.ru|WBCZ_OZON_|wildberries\.ru|WBCZ_WB_|markirovka\.crpt\.ru|WBCZ_AGENT_MACHINE_TOKEN|/api/agent/' dist; then
            echo 'backend production boundary leaked into browser bundle' >&2; exit 1
          fi

      - name: M10 security and contract assertions
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E 'GenericOzonClient|RAW_OZON_URL|RAW_OZON_HOST|RAW_OZON_PATH|RAW_OZON_METHOD|RAW_OZON_HEADERS' src/wbcz/ozon_foundation.py
          ! grep -R -E 'requests\.|httpx\.|urllib\.request|adapter\.send\(' src/wbcz/ozon_foundation.py
          ! grep -R -E -- '-----BEGIN .*PRIVATE KEY-----' src frontend migrations
          ! grep -Ei 'Column\("api_key"|Column\("raw_api_key"|Column\("authorization"|Column\("cis"|Column\("sgtin"|Column\("kiz"|Column\("plaintext"' migrations/versions/0011_m10_ozon.py
          python - <<'PY'
          from wbcz.ozon_foundation import (
              API_KEY_LOGGING_ALLOWED,
              AUTO_DISTANCE_READY_ENABLED,
              AUTO_REMOTE_SALE_RETURN_READY_ENABLED,
              GLOBAL_OZON_LIMIT_RPS,
              INVENTED_BURST_CAPACITY,
              M10_WIRE_READY,
              OZON_API_CIS_AUTOBIND_ENABLED,
              OZON_EXECUTABLE_REMOTE_CAPABILITIES,
              OZON_REMOTE_CAPABILITIES,
              PAID_SOURCE_PINNED,
              PAYMENT_CONFIRMATION_CONTRACT_PINNED,
              PHYSICAL_SELLER_RETURN_CONTRACT_PINNED,
              PRODUCTION_OZON_WRITE_ENABLED,
              TRUE_API_WRITE_FROM_M10,
              OzonCapabilityName,
              sanitize_ozon_evidence,
          )
          from wbcz_web.models.ozon import OzonConnectionRecord, OzonMarkingBindingRecord

          assert not M10_WIRE_READY
          assert not PRODUCTION_OZON_WRITE_ENABLED
          assert not OZON_API_CIS_AUTOBIND_ENABLED
          assert not PAYMENT_CONFIRMATION_CONTRACT_PINNED
          assert not PAID_SOURCE_PINNED
          assert not PHYSICAL_SELLER_RETURN_CONTRACT_PINNED
          assert not AUTO_DISTANCE_READY_ENABLED
          assert not AUTO_REMOTE_SALE_RETURN_READY_ENABLED
          assert not TRUE_API_WRITE_FROM_M10
          assert not API_KEY_LOGGING_ALLOWED
          assert GLOBAL_OZON_LIMIT_RPS == 50
          assert not INVENTED_BURST_CAPACITY
          assert OZON_EXECUTABLE_REMOTE_CAPABILITIES == ()
          assert len(OZON_REMOTE_CAPABILITIES) == 8
          for cap in OZON_REMOTE_CAPABILITIES.values():
              assert not cap.enabled
              assert not cap.contract_pinned
              assert not cap.rate_profile_pinned
              assert cap.request_contract is None
              assert cap.response_contract is None
              assert cap.pagination_contract is None
              assert cap.endpoint_rate_limit is None

          assert OZON_REMOTE_CAPABILITIES[OzonCapabilityName.FBS_LIST].path == '/v4/posting/fbs/list'
          assert OZON_REMOTE_CAPABILITIES[OzonCapabilityName.FBS_UNFULFILLED].path == '/v4/posting/fbs/unfulfilled/list'

          conn=set(OzonConnectionRecord.__table__.columns.keys())
          assert not {'api_key','raw_api_key','authorization','auth_header','secret'} & conn
          mark=set(OzonMarkingBindingRecord.__table__.columns.keys())
          assert not {'cis','sgtin','kiz','plaintext','full_marking','marking_code'} & mark

          canary='CIS-CI-M10-CANARY'
          safe=sanitize_ozon_evidence({'products':[{'exemplars':[{'marks':[{'value':canary}]}]}]})
          assert canary not in repr(safe)
          PY

  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove exact M9 base and frozen P0
        shell: pwsh
        run: |
          $base=(git merge-base HEAD $env:M10_BASE_SHA).Trim()
          if ($base -ne $env:M10_BASE_SHA) { throw "wrong M10 base: $base" }
          $frozen=(git rev-parse origin/p0/test-candidate-001).Trim()
          if ($frozen -ne $env:FROZEN_P0_SHA) { throw "frozen P0 changed: $frozen" }
          $frontend=(git diff --name-only "$env:M10_BASE_SHA...HEAD" | Select-String '^frontend/')
          if ($frontend) { throw 'frontend source changed in M10' }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -e ".[ui,test,web]"

      - name: M10 M9 M8 M7 M6 M5 focused tests
        shell: pwsh
        run: |
          python -m pytest -q tests/test_m10_ozon_foundation.py
          python -m pytest -q tests/test_m9_wb_fbs.py
          python -m pytest -q tests/test_m8_suz_foundation.py
          python -m pytest -q tests/test_m7_edo_lite_foundation.py
          python -m pytest -q tests/test_m6_aggregation.py
          python -m pytest -q tests/test_m5_turnover.py

      - name: M4 M3 M2 M1 Windows regressions
        shell: pwsh
        run: |
          python -m pytest -q tests/test_m4_document_lifecycle.py
          python -m pytest -q tests/test_m3_auth_signing.py
          python -m pytest -q tests/test_m2_reference_products.py
          python -m pytest -q tests/test_m1_cis_inventory.py
          python -m pytest -q tests/test_windows_agent.py

      - name: P0 Windows safety regressions
        shell: pwsh
        run: |
          python -m pytest -q tests/test_p0_document_assembler.py
          python -m pytest -q `
            tests/test_p0_endtoend_wiring.py::test_windows_runtime_and_outbound_agent_have_no_listener `
            tests/test_p0_endtoend_wiring.py::test_preflight_is_mutation_free_even_with_optional_cis
