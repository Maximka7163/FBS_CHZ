name: Web v0.5.1 deployment validation
on:
  push:
    branches: [web/v0.5.1-deployment-package]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wbcz_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d wbcz_test"
          --health-interval=2s --health-timeout=3s --health-retries=20
    env:
      WBCZ_ENV: test
      WBCZ_OWN_INN: "1234567890"
      WBCZ_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_test
      WBCZ_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: python -m pip install -e ".[ui,test,web]"
      - working-directory: frontend
        run: npm install --no-audit --no-fund --no-package-lock
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run build
      - name: Production bundle contains no localhost API URL
        run: |
          if grep -R -E 'https?://(localhost|127\.0\.0\.1)' frontend/dist; then
            echo 'localhost URL found in production frontend bundle' >&2
            exit 1
          fi
      - run: alembic upgrade head
      - run: python -m pytest -q
      - name: Build production frontend artifact
        run: docker build -f frontend/Dockerfile.production --target artifact .
      - name: Create safe CI production env
        run: |
          cat > "$RUNNER_TEMP/wbcz-production.env" <<EOF
          WBCZ_ENV=production
          WBCZ_DATABASE_URL=postgresql+psycopg://wbcz:ci_only_password_123456789@marking-postgres:5432/wbcz
          WBCZ_OWN_INN=1234567890
          WBCZ_SESSION_TTL_SECONDS=3600
          WBCZ_COOKIE_SECURE=true
          WBCZ_SESSION_COOKIE_NAME=wbcz_session
          WBCZ_CSRF_COOKIE_NAME=wbcz_csrf
          WBCZ_DEBUG=false
          WBCZ_TRUSTED_HOSTS=mark.sellari.ru
          WBCZ_APP_VERSION=0.5.1
          WBCZ_BUILD_SHA=${GITHUB_SHA}
          WBCZ_HEALTHCHECK_HOST=mark.sellari.ru
          WBCZ_POSTGRES_DB=wbcz
          WBCZ_POSTGRES_USER=wbcz
          WBCZ_POSTGRES_PASSWORD=ci_only_password_123456789
          WBCZ_BACKEND_IMAGE=sellari-marking-backend
          WBCZ_BACKEND_PORT=18765
          EOF
      - name: Docker compose config validation
        run: |
          docker compose --env-file "$RUNNER_TEMP/wbcz-production.env" -f docker-compose.prod.yml config --format json > "$RUNNER_TEMP/compose.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          cfg=json.loads(Path(os.environ['RUNNER_TEMP'],'compose.json').read_text())
          pg=cfg['services']['marking-postgres']
          backend=cfg['services']['marking-backend']
          assert not pg.get('ports')
          ports=backend.get('ports') or []
          assert ports and ports[0].get('host_ip') == '127.0.0.1'
          assert cfg['networks']['marking_internal']['internal'] is True
          PY
      - name: Build backend production image
        run: docker compose --env-file "$RUNNER_TEMP/wbcz-production.env" -f docker-compose.prod.yml build marking-backend
      - name: Production container migration and healthcheck
        run: |
          set -euo pipefail
          docker compose --env-file "$RUNNER_TEMP/wbcz-production.env" -f docker-compose.prod.yml up -d marking-postgres
          docker compose --env-file "$RUNNER_TEMP/wbcz-production.env" -f docker-compose.prod.yml run --rm marking-backend alembic upgrade head
          docker compose --env-file "$RUNNER_TEMP/wbcz-production.env" -f docker-compose.prod.yml up -d marking-backend
          CID="$(docker compose --env-file "$RUNNER_TEMP/wbcz-production.env" -f docker-compose.prod.yml ps -q marking-backend)"
          status=starting
          for i in $(seq 1 40); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$CID")"
            [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && { docker logs "$CID"; exit 1; }
            sleep 2
          done
          test "$status" = healthy
          curl --fail --silent --show-error -H 'Host: mark.sellari.ru' http://127.0.0.1:18765/api/health
          curl --fail --silent --show-error -H 'Host: mark.sellari.ru' http://127.0.0.1:18765/api/version | grep "$GITHUB_SHA"
      - name: Safety boundary
        run: |
          python - <<'PY'
          from wbcz_web.main import create_app
          from wbcz_web.config import WebConfig
          app=create_app(WebConfig.from_env())
          paths={getattr(r,'path',None) for r in app.routes}
          forbidden={'/register','/signup','/api/register','/api/auth/register','/api/lk/documents/create','/api/submit'}
          assert not paths.intersection(forbidden)
          print('WEB_PRODUCTION_TRUE_API=ABSENT')
          print('TRUE_API_WRITE=FALSE')
          print('DOCUMENT_SIGNING=FALSE')
          print('SUBMISSION=FALSE')
          print('WINDOWS_BRIDGE=FALSE')
          PY
        env:
          WBCZ_ENV: production
          WBCZ_DATABASE_URL: postgresql+psycopg://wbcz:ci_only_password_123456789@marking-postgres:5432/wbcz
          WBCZ_OWN_INN: "1234567890"
          WBCZ_COOKIE_SECURE: "true"
          WBCZ_DEBUG: "false"
          WBCZ_TRUSTED_HOSTS: mark.sellari.ru
          WBCZ_BUILD_SHA: ${{ github.sha }}
      - if: always()
        run: docker compose --env-file "$RUNNER_TEMP/wbcz-production.env" -f docker-compose.prod.yml down -v || true
