name: M8 contract tightening

on:
  push:
    branches:
      - m8/suz-foundation-001

permissions:
  contents: write

jobs:
  tighten:
    if: github.event.head_commit.message == 'chore: bootstrap M8 contract tightening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m8/suz-foundation-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tighten source-confirmed M8 metadata contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/wbcz/suz_foundation.py')
          s=p.read_text(encoding='utf-8')

          needle='''        _opaque(self.environment, "environment")\n        _opaque(self.installation_name, "installation_name")\n\n\nclass TokenLifecycleState(str, Enum):\n'''
          replacement='''        _opaque(self.environment, "environment")\n        _opaque(self.installation_name, "installation_name")\n\n\n@dataclass(frozen=True, slots=True)\nclass SuzRemoteIdentifiers:\n    remote_order_id: str | None = None\n    remote_block_id: str | None = None\n    remote_package_id: str | None = None\n    remote_report_id: str | None = None\n    oms_id: str | None = None\n    oms_connection: str | None = None\n\n    def __post_init__(self) -> None:\n        for field_name in (\n            "remote_order_id", "remote_block_id", "remote_package_id",\n            "remote_report_id", "oms_id", "oms_connection",\n        ):\n            value = getattr(self, field_name)\n            if value is not None:\n                _opaque(value, field_name)\n\n\nclass TokenLifecycleState(str, Enum):\n'''
          assert needle in s
          s=s.replace(needle,replacement,1)

          old='''@dataclass(frozen=True, slots=True)\nclass SuzErrorEvidence:\n    raw_code: str\n    category: str | None\n    knowledge: ErrorKnowledge\n    meaning: str | None = None\n\n\n_EXACT_ERROR_CATEGORIES: Mapping[str, str] = {\n    **{code: "AUTH" for code in ("1090", "1100", "1110", "1140", "1150", "1160", "1170", "1350")},\n    **{code: "SIGNATURE" for code in ("1010", "1050", "1055", "1060", "1065", "1330")},\n    **{code: "ORDER" for code in ("3030", "3050", "3100", "3120", "3150", "3300", "3320", "3325", "3340", "3350", "3770", "3780", "3820", "3910", "3920", "3996", "5010", "5020", "5050")},\n    **{code: "FETCH" for code in ("3310", "3360", "3370", "3390", "3800")},\n    **{code: "CLOSE" for code in ("2200", "3010", "3810")},\n    "3710": "REPEAT_FETCH",\n}\n\n\ndef classify_suz_error(raw_code: str | int) -> SuzErrorEvidence:\n    code = str(raw_code)\n    if code in _EXACT_ERROR_CATEGORIES:\n        return SuzErrorEvidence(code, _EXACT_ERROR_CATEGORIES[code], ErrorKnowledge.CONFIRMED_EXACT)\n    try:\n        number = int(code)\n    except ValueError:\n        number = -1\n    if 3160 <= number <= 3220:\n        return SuzErrorEvidence(code, "SERIAL_ERROR_FAMILY", ErrorKnowledge.CONFIRMED_FAMILY_ONLY)\n    return SuzErrorEvidence(code, None, ErrorKnowledge.UNKNOWN_FUTURE)\n'''
          new='''@dataclass(frozen=True, slots=True)\nclass SuzErrorEvidence:\n    raw_code: str\n    categories: tuple[str, ...]\n    knowledge: ErrorKnowledge\n    meaning: str | None = None\n\n\nSUZ_ERROR_REGISTRY: Mapping[str, tuple[str, ...]] = {\n    **{code: ("AUTH",) for code in ("1090", "1100", "1110", "1140", "1150", "1160", "1170", "1350")},\n    **{code: ("SIGNATURE",) for code in ("1010", "1050", "1055", "1060", "1065", "1330")},\n    **{code: ("ORDER",) for code in ("3030", "3050", "3100", "3120", "3150", "3300", "3320", "3325", "3340", "3350", "3770", "3780", "3820", "3910", "3920", "3996", "5010", "5020", "5050")},\n    **{code: ("FETCH",) for code in ("3310", "3370", "3390", "3800")},\n    "3360": ("FETCH", "CLOSE"),\n    **{code: ("CLOSE",) for code in ("2200", "3010", "3810")},\n    "3710": ("REPEAT_FETCH",),\n}\n\n\ndef classify_suz_error(raw_code: str | int) -> SuzErrorEvidence:\n    code = str(raw_code)\n    if code in SUZ_ERROR_REGISTRY:\n        return SuzErrorEvidence(code, SUZ_ERROR_REGISTRY[code], ErrorKnowledge.CONFIRMED_EXACT)\n    try:\n        number = int(code)\n    except ValueError:\n        number = -1\n    if 3160 <= number <= 3220:\n        return SuzErrorEvidence(code, ("SERIAL_ERROR_FAMILY",), ErrorKnowledge.CONFIRMED_FAMILY_ONLY)\n    return SuzErrorEvidence(code, (), ErrorKnowledge.UNKNOWN_FUTURE)\n'''
          assert old in s
          s=s.replace(old,new,1)

          needle='''    def unresolved(self) -> "FetchRecovery":\n        return FetchRecovery(FetchRecoveryState.MANUAL_REVIEW)\n\n\nclass KmPayloadKind(str, Enum):\n'''
          replacement='''    def unresolved(self) -> "FetchRecovery":\n        return FetchRecovery(FetchRecoveryState.MANUAL_REVIEW)\n\n\ndef verify_repeat_recovery_payload(\n    *,\n    expected_payload_sha256: str,\n    expected_code_count: int,\n    exact_payload: bytes,\n    code_count: int,\n) -> bool:\n    if len(expected_payload_sha256) != 64:\n        raise SuzContractError("expected_payload_sha256 must be a SHA-256 hex digest")\n    if type(expected_code_count) is not int or expected_code_count < 0:\n        raise SuzContractError("expected_code_count must be non-negative")\n    if type(code_count) is not int or code_count < 0:\n        raise SuzContractError("code_count must be non-negative")\n    return code_count == expected_code_count and sha256_hex(exact_payload) == expected_payload_sha256\n\n\nclass KmPayloadKind(str, Enum):\n'''
          assert needle in s
          s=s.replace(needle,replacement,1)
          p.write_text(s,encoding='utf-8')

          p=Path('src/wbcz_web/models/suz.py')
          s=p.read_text(encoding='utf-8')
          old='''    order_operation_id: Mapped[str] = mapped_column(String(128), nullable=False, index=True)\n'''
          new='''    order_operation_id: Mapped[str] = mapped_column(String(128), ForeignKey("suz_orders.operation_id", ondelete="CASCADE"), nullable=False, index=True)\n'''
          assert s.count(old) == 1
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/test_m8_suz_foundation.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('''    SuzOrderItem,\n    SuzSecurityError,\n''','''    SuzOrderItem,\n    SuzRemoteIdentifiers,\n    SuzSecurityError,\n''',1)
          s=s.replace('''    serials_sha256,\n)\n''','''    serials_sha256,\n    verify_repeat_recovery_payload,\n)\n''',1)
          marker='''def test_dynamic_token_is_10h_memory_only_and_redacted() -> None:\n'''
          addition='''def test_all_suz_remote_identifiers_are_opaque_and_exact() -> None:\n    ids = SuzRemoteIdentifiers(\n        remote_order_id="Order/Mixed-01",\n        remote_block_id="Block/Mixed-02",\n        remote_package_id="Package/Mixed-03",\n        remote_report_id="Report/Mixed-04",\n        oms_id="Oms/Mixed-05",\n        oms_connection="Conn/Mixed-06",\n    )\n    assert ids.remote_order_id == "Order/Mixed-01"\n    assert ids.remote_block_id == "Block/Mixed-02"\n    assert ids.remote_package_id == "Package/Mixed-03"\n    assert ids.remote_report_id == "Report/Mixed-04"\n    with pytest.raises(SuzContractError):\n        SuzRemoteIdentifiers(remote_report_id="")\n\n\n'''
          assert marker in s
          s=s.replace(marker,addition+marker,1)
          old='''        assert evidence.knowledge is ErrorKnowledge.CONFIRMED_EXACT\n        assert not hasattr(evidence, "retryable")\n'''
          new='''        assert evidence.knowledge is ErrorKnowledge.CONFIRMED_EXACT\n        assert evidence.categories\n        assert not hasattr(evidence, "retryable")\n'''
          assert old in s
          s=s.replace(old,new,1)
          old='''    for code in (3160, 3180, 3220):\n'''
          new='''    assert classify_suz_error(3360).categories == ("FETCH", "CLOSE")\n    for code in (3160, 3180, 3220):\n'''
          assert old in s
          s=s.replace(old,new,1)
          marker='''def test_immutable_km_block_evidence_hashes_exact_bytes() -> None:\n'''
          addition='''def test_repeat_recovery_requires_exact_hash_and_count_match_before_commit() -> None:\n    raw = b"historical-exact-block"\n    digest = hashlib.sha256(raw).hexdigest()\n    assert verify_repeat_recovery_payload(\n        expected_payload_sha256=digest, expected_code_count=3, exact_payload=raw, code_count=3\n    )\n    assert not verify_repeat_recovery_payload(\n        expected_payload_sha256=digest, expected_code_count=3, exact_payload=raw + b"x", code_count=3\n    )\n    assert not verify_repeat_recovery_payload(\n        expected_payload_sha256=digest, expected_code_count=3, exact_payload=raw, code_count=2\n    )\n\n\n'''
          assert marker in s
          s=s.replace(marker,addition+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Install test dependencies
        run: python -m pip install -e '.[test,web]'
      - name: Run focused tests
        run: python -m pytest -q tests/test_m8_suz_foundation.py
      - name: Commit tightening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/wbcz/suz_foundation.py src/wbcz_web/models/suz.py tests/test_m8_suz_foundation.py
          git commit -m 'fix: tighten M8 source-confirmed foundation contracts'
          git push origin HEAD:m8/suz-foundation-001
