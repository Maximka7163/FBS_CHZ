name: M1 source fix

on:
  push:
    branches:
      - m1/cis-inventory-readonly-001
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix SQLite-only test fixture identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_m1_cis_inventory.py')
          s=p.read_text(encoding='utf-8')
          old='db.add(User(username="owner", password_hash=hash_password("pw-strong-enough"), is_active=True, is_admin=True))'
          new='db.add(User(id=1, username="owner", password_hash=hash_password("pw-strong-enough"), is_active=True, is_admin=True))'
          if old not in s:
              raise SystemExit('expected fixture line not found')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_m1_cis_inventory.py
          git commit -m 'test: make M1 API fixture SQLite-compatible'
          git push origin HEAD:m1/cis-inventory-readonly-001
