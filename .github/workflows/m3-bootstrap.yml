          Path('docs/M3_AUTH_SIGNING_CONTRACT.md').write_text('''# M3 Auth / Signing hardening contract\n\nOfficial source baseline: **True API v726.0 (04.09.2026)**.\n\n## Authentication\n\nPrimary UUID flow remains Windows-local: `GET /api/v3/true-api/auth/key` -> validate `uuid` + `data` -> sign the exact UTF-8 challenge using the locally selected CryptoPro certificate in **attached** mode -> `POST /api/v3/true-api/auth/simpleSignIn` with `uuid`, attached signature in `data`, participant `inn`, and `unitedToken=true`. The bearer credential is strictly `uuidToken`; an optional/legacy `token` field is not used. `expireDate` must carry timezone information and is normalized to UTC. The token is memory-only on the Windows agent.\n\nThere is no refresh endpoint. On local expiry/near-expiry or HTTP 401 the local session is invalidated; the next request repeats the full challenge/sign/sign-in flow. No True API bearer is persisted, returned to the backend, or exposed to the browser.\n\nThe backend cannot provide an auth challenge or arbitrary bytes to a signer: agent jobs have no auth-sign job or challenge/signature fields. The authentication signer is wired only inside the Windows runtime to `TrueApiAuthenticator`, which obtains challenge provenance directly from `/auth/key`.\n\n## Signing modes\n\nAuthentication challenge signing is structurally separate from business-document signing. `WindowsCryptoProAuthSigner` uses CryptoPro `cryptcp -signf -attached ...`. `WindowsCryptoProDocumentSigner` signs only the immutable P0 business-document bytes and intentionally omits `-attached`, producing the detached CMS/CAdES-BES-compatible signature required by document create. There is no generic `sign(bytes)` RPC.\n\nBefore document signing, the Windows boundary revalidates allowed document type (`LK_RECEIPT` / `LP_RETURN`), `pg=lp`, participant INN, SHA-256, Base64-decoded exact bytes, valid UTF-8 JSON, and object root. Certificate thumbprint is taken from local trusted runtime configuration and cannot be overridden by a job.\n\n## Error and secret handling\n\nAuth HTTP errors reuse the M1 safe transport-error policy for JSON, XML, text, and empty bodies. Persisted/audited diagnostics are bounded and redacted; bearer/token/PIN/private-key material is not logged.\n\n## Boundaries preserved\n\n- Windows outbound-only; no inbound listener.\n- CryptoPro CSP + stunnel_msspi/MSSPI GOST TLS architecture unchanged.\n- Private key export: **NO**.\n- PIN in backend/DB/job/log/browser: **NO**.\n- Direct VPS True API: **NO**.\n- Generic HTTP/True API proxy: **NO**.\n- Production write remains default-off/hard-disabled pending runtime contract tests.\n- No new document types, product groups, mutation operations, or frontend capability.\n- No DB migration and no auth-session persistence.\n\n## Runtime-only acceptance\n\nThis M3 task does **not** claim real certificate discovery, real CryptoPro CSP/Rutoken/PIN prompting, real GOST TLS negotiation, or real True API authentication. Those require an explicit runtime task on the authorized Windows machine and must not be faked in CI.\n''', encoding='utf-8')

          Path('tests/test_m3_auth_signing.py').write_text(r'''from __future__ import annotations

import base64
from dataclasses import fields
from datetime import datetime, timedelta, timezone
import hashlib
import json
from pathlib import Path
import subprocess

import pytest

from wbcz.windows_agent import (
    AgentHttpResponse,
    AgentJob,
    AgentJobType,
    AgentSecurityError,
    AgentSessionManager,
    WindowsCryptoProDocumentSigner,
)
from wbcz_ui.live_true_api import (
    AuthSession,
    JsonlLiveAudit,
    ReadOnlyTrueApiTransport,
    TrueApiAuthenticator,
    TrueApiHttpError,
    TrueApiProtocolError,
    WindowsCryptoProAuthSigner,
)

OWN = "1234567890"


class FakeHeaders(dict):
    pass


class FakeHttpResponse:
    def __init__(self, status, body, headers=None):
        self.status = status
        self._body = body
        self.headers = FakeHeaders(headers or {})

    def read(self):
        return self._body


class FakeConnection:
    def __init__(self, response, calls, host, port, timeout=None):
        self.response = response
        self.calls = calls
        self.host = host
        self.port = port
        self.timeout = timeout
        self.headers = {}
        self.data = None

    def putrequest(self, method, target, skip_host=False):
        self.method = method
        self.target = target

    def putheader(self, name, value):
        self.headers[name] = value

    def endheaders(self, data=None):
        self.data = data
        self.calls.append(self)

    def getresponse(self):
        return self.response

    def close(self):
        pass


class FakeTunnel:
    local_port = 41414

    def session_marker(self):
        return 0

    def assert_gost_session(self, marker=0):
        return None

    def diagnostics(self):
        return {"mechanism": "test"}


def transport_for(tmp_path, responses):
    calls = []
    queue = list(responses)

    def factory(host, port, timeout=None):
        response = queue.pop(0)
        return FakeConnection(response, calls, host, port, timeout)

    return ReadOnlyTrueApiTransport(
        audit=JsonlLiveAudit(tmp_path / "auth.jsonl"),
        tunnel=FakeTunnel(),
        connection_factory=factory,
    ), calls


def test_auth_key_is_get_without_authorization_and_signin_uses_uuidtoken(tmp_path):
    key = FakeHttpResponse(200, json.dumps({"uuid": "u-1", "data": "  exact\nchallenge  "}).encode(), {})
    signin = FakeHttpResponse(
        200,
        json.dumps({
            "token": "must-not-be-used",
            "uuidToken": "uuid-token-used",
            "expireDate": "2026-09-17T10:00:00+05:00",
        }).encode(),
        {},
    )
    transport, calls = transport_for(tmp_path, [key, signin])

    class Signer:
        def __init__(self): self.values=[]
        def sign_auth_challenge(self, value):
            self.values.append(value)
            return "ATTACHED"

    signer=Signer()
    session=TrueApiAuthenticator(transport, signer, OWN).authenticate()
    assert signer.values == ["  exact\nchallenge  "]
    assert session.uuid_token == "uuid-token-used"
    assert session.bearer_token == "uuid-token-used"
    assert session.expire_date == datetime(2026, 9, 17, 5, 0, tzinfo=timezone.utc)
    assert calls[0].method == "GET"
    assert calls[0].target == "/api/v3/true-api/auth/key"
    assert "Authorization" not in calls[0].headers
    assert calls[1].method == "POST"
    assert calls[1].target == "/api/v3/true-api/auth/simpleSignIn"
    assert json.loads(calls[1].data) == {
        "uuid": "u-1",
        "data": "ATTACHED",
        "inn": OWN,
        "unitedToken": True,
    }
    assert "Authorization" not in calls[1].headers


def test_auth_requires_uuid_data_uuidtoken_and_timezone_expiry():
    class Transport:
        def __init__(self, key, signin): self.key=key; self.signin=signin
        def request_json(self, method, path, **kwargs): return self.key if path.endswith("/key") else self.signin
    class Signer:
        def sign_auth_challenge(self, value): return "sig"

    with pytest.raises(TrueApiProtocolError):
        TrueApiAuthenticator(Transport({"data":"x"}, {}), Signer(), OWN).authenticate()
    with pytest.raises(TrueApiProtocolError):
        TrueApiAuthenticator(Transport({"uuid":"u","data":"x"}, {"token":"legacy","expireDate":"2026-09-17T10:00:00Z"}), Signer(), OWN).authenticate()
    with pytest.raises(TrueApiProtocolError, match="timezone"):
        TrueApiAuthenticator(Transport({"uuid":"u","data":"x"}, {"uuidToken":"u","expireDate":"2026-09-17T10:00:00"}), Signer(), OWN).authenticate()


def test_session_expiry_clears_old_token_and_reauthenticates():
    now = datetime(2026, 9, 17, 5, 0, tzinfo=timezone.utc)
    class Auth:
        def __init__(self): self.calls=0
        def authenticate(self):
            self.calls += 1
            return AuthSession(f"uuid-{self.calls}", now + timedelta(minutes=3*self.calls))
    clock=[now]
    auth=Auth()
    manager=AgentSessionManager(auth, now=lambda: clock[0])
    assert manager.bearer_token() == "uuid-1"
    clock[0] = now + timedelta(minutes=2)
    assert manager.bearer_token() == "uuid-2"
    manager.observe_http_status(401)
    assert manager.expire_date is None
    assert manager.bearer_token() == "uuid-3"
    assert auth.calls == 3


def test_failed_reauth_does_not_leave_expired_session():
    now=datetime(2026,9,17,5,0,tzinfo=timezone.utc)
    class Auth:
        def __init__(self): self.calls=0
        def authenticate(self):
            self.calls += 1
            if self.calls == 1:
                return AuthSession("old", now + timedelta(minutes=1))
            raise RuntimeError("auth failed")
    manager=AgentSessionManager(Auth(), now=lambda: now, refresh_margin=timedelta(0))
    assert manager.bearer_token() == "old"
    manager._now=lambda: now + timedelta(minutes=2)
    with pytest.raises(RuntimeError): manager.bearer_token()
    assert manager.expire_date is None


def test_auth_signer_is_attached_and_preserves_exact_utf8_challenge(tmp_path):
    cryptcp=tmp_path/'cryptcp.exe'; cryptcp.write_bytes(b'x')
    seen={}
    class Inspector:
        def inspect(self): return {}
    def runner(command, **kwargs):
        source=Path(command[command.index('-fext')-1])
        seen['bytes']=source.read_bytes(); seen['command']=command
        source.with_name(source.name+'.sgn').write_bytes(b'AUTH')
        return subprocess.CompletedProcess(command,0,stdout='',stderr='')
    signer=WindowsCryptoProAuthSigner('AA11', cryptcp_path=cryptcp, inspector=Inspector(), runner=runner)
    challenge='  строка\nwith-space  '
    assert base64.b64decode(signer.sign_auth_challenge(challenge)) == b'AUTH'
    assert seen['bytes'] == challenge.encode('utf-8')
    assert '-attached' in seen['command']
    assert '-pin' not in seen['command']


def test_document_signer_is_detached_and_revalidates_exact_json_bytes(tmp_path):
    cryptcp=tmp_path/'cryptcp.exe'; cryptcp.write_bytes(b'x')
    seen={}
    class Inspector:
        def inspect(self): return {}
    def runner(command, **kwargs):
        source=Path(command[command.index('-fext')-1])
        seen['bytes']=source.read_bytes(); seen['command']=command
        source.with_name(source.name+'.sgn').write_bytes(b'DOC')
        return subprocess.CompletedProcess(command,0,stdout='',stderr='')
    signer=WindowsCryptoProDocumentSigner(certificate_thumbprint='AA11', participant_inn=OWN, cryptcp_path=cryptcp, inspector=Inspector(), runner=runner)
    payload=b'{"inn":"1234567890","x":1}'
    sig,_=signer.sign_document_bytes(operation_id='op', document_type='LK_RECEIPT', pg='lp', expected_inn=OWN, document_sha256=hashlib.sha256(payload).hexdigest(), payload=payload)
    assert base64.b64decode(sig)==b'DOC'
    assert seen['bytes']==payload
    assert '-attached' not in seen['command']
    assert '-der' in seen['command'] and '-strict' in seen['command']
    with pytest.raises(AgentSecurityError):
        signer.sign_document_bytes(operation_id='op', document_type='LK_RECEIPT', pg='lp', expected_inn=OWN, document_sha256='0'*64, payload=payload)
    bad=b'[1,2,3]'
    with pytest.raises(AgentSecurityError, match='root'):
        signer.sign_document_bytes(operation_id='op', document_type='LK_RECEIPT', pg='lp', expected_inn=OWN, document_sha256=hashlib.sha256(bad).hexdigest(), payload=bad)


def test_backend_job_protocol_has_no_auth_signing_rpc_or_thumbprint_override():
    names={f.name for f in fields(AgentJob)}
    forbidden={'auth_challenge','challenge','bytes_to_sign','sign_payload','certificate_thumbprint','pin','private_key'}
    assert names.isdisjoint(forbidden)
    assert all('AUTH_SIGN' not in item.value and 'SIGN_AUTH' not in item.value for item in AgentJobType)


def test_auth_error_json_xml_text_empty_are_safe_and_redacted(tmp_path):
    bodies=[
        (b'{"message":"Bearer SUPERSECRET"}', 'application/json'),
        (b'<error><token>SUPERSECRET</token></error>', 'application/xml'),
        (b'pin=SUPERSECRET', 'text/plain'),
        (b'', 'text/plain'),
    ]
    for i,(body,ctype) in enumerate(bodies):
        transport,calls=transport_for(tmp_path, [FakeHttpResponse(401, body, {'Content-Type':ctype})])
        with pytest.raises(TrueApiHttpError) as exc:
            transport.request_json('GET','/auth/key')
        err=exc.value
        assert err.status==401
        assert err.body_sha256==hashlib.sha256(body).hexdigest()
        assert 'SUPERSECRET' not in str(err)
        assert 'SUPERSECRET' not in (tmp_path/'auth.jsonl').read_text(encoding='utf-8')


def test_no_auth_session_secret_fields_in_agent_protocol():
    job_fields={f.name for f in fields(AgentJob)}
    assert 'uuid_token' not in job_fields and 'bearer_token' not in job_fields
    assert 'token' not in job_fields and 'pin' not in job_fields and 'private_key' not in job_fields
