name: M6 contract hardening patch
on:
  push:
    branches: [m6/aggregation-001]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m6/aggregation-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply M6 hardening without M5 rewrite
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              count=s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:100]!r}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          p='src/wbcz/aggregation.py'
          rep(p,
          '''def validate_lp_relation(parent: PackageType, child: PackageType, *, child_pg: str = M6_PG, mixed_pg: bool = False) -> None:\n    if parent is PackageType.GROUP:\n''',
          '''def validate_lp_relation(parent: PackageType, child: PackageType, *, child_pg: str = M6_PG, mixed_pg: bool = False) -> None:\n    if child is PackageType.BUNDLE and child_pg != M6_PG:\n        raise AggregationContractError("BUNDLE/KIK is supported only for lp")\n    if parent is PackageType.GROUP:\n''')

          rep(p,
          '''    tnved: str | None = None\n    fetched_at: datetime | None = None\n''',
          '''    tnved: str | None = None\n    fetched_at: datetime | None = None\n    nested_tnveds: tuple[str, ...] = ()\n''')

          marker='''def validate_atk_preconditions(*, role: str, participant_inn: str, children: Sequence[CisAggregationSnapshot], allow_fts_control: bool = False) -> None:\n'''
          start=Path(p).read_text(encoding='utf-8').index(marker)
          s=Path(p).read_text(encoding='utf-8')
          end=s.index('\n\n@dataclass(frozen=True, slots=True)\nclass PreparedAggregationDocument:', start)
          replacement='''def validate_reaggregation_preconditions(\n    *,\n    parent: CisAggregationSnapshot,\n    children: Sequence[CisAggregationSnapshot],\n    reaggregation_type: str,\n    participant_inn: str,\n    nested_box_codes: frozenset[str] = frozenset(),\n    remaining_children: Sequence[CisAggregationSnapshot] = (),\n    leading_pg: str = M6_PG,\n    mixed_pg: bool = False,\n) -> None:\n    owner = _inn(participant_inn, "participant_inn")\n    if parent.package_type not in {PackageType.BOX, PackageType.SET}:\n        raise AggregationManualReview("REAGGREGATION_PARENT_NOT_SUPPORTED_FOR_LP")\n    if parent.owner_inn != owner:\n        raise AggregationManualReview("LEGACY_NON_OWNER_FLOW_NOT_ENABLED")\n    if parent.status_raw not in {"APPLIED", "INTRODUCED"}:\n        raise AggregationManualReview("REAGGREGATION_PARENT_STATUS_NOT_SUPPORTED")\n    if parent.status_ex_raw not in (None, ""):\n        raise AggregationManualReview("REAGGREGATION_PARENT_STATUS_EX_NOT_SUPPORTED")\n    if reaggregation_type not in {"ADDING", "REMOVING"}:\n        raise AggregationContractError("reaggregation_type must be ADDING or REMOVING")\n    if not children:\n        raise AggregationContractError("reaggregation children required")\n    seen: set[str] = set()\n    for child in children:\n        if child.cis in seen:\n            raise AggregationContractError("reaggregation children must be unique")\n        seen.add(child.cis)\n        if child.owner_inn != owner:\n            raise AggregationManualReview("LEGACY_NON_OWNER_FLOW_NOT_ENABLED")\n        if child.status_raw != parent.status_raw:\n            raise AggregationManualReview("REAGGREGATION_STATUS_MISMATCH")\n        allowed_status_ex = {None, ""}\n        if child.cis in nested_box_codes:\n            allowed_status_ex.add("WAIT_TRANSFER_TO_OWNER")\n            if child.package_type is not PackageType.BOX or parent.package_type is not PackageType.BOX:\n                raise AggregationContractError("kitu item is only valid for BOX inside BOX")\n        if child.status_ex_raw not in allowed_status_ex:\n            raise AggregationManualReview("REAGGREGATION_STATUS_EX_NOT_SUPPORTED")\n        if parent.status_raw == "APPLIED" and child.emission_type in {"REMARK", "REAPPLY"}:\n            raise AggregationManualReview("REAGGREGATION_APPLIED_REMARK_REAPPLY_FORBIDDEN")\n        if child.package_type is None:\n            raise AggregationManualReview("UNKNOWN_RAW_PACKAGE_TYPE")\n        validate_lp_relation(parent.package_type, child.package_type, child_pg=child.product_group or M6_PG, mixed_pg=mixed_pg)\n        if reaggregation_type == "ADDING" and child.parent not in (None, ""):\n            raise AggregationManualReview("ADDING_CHILD_ALREADY_AGGREGATED")\n        if reaggregation_type == "REMOVING" and child.parent != parent.cis:\n            raise AggregationManualReview("REMOVING_CHILD_NOT_IN_PARENT")\n    if parent.package_type is PackageType.SET and any(x.package_type not in {PackageType.UNIT, PackageType.BUNDLE} for x in children):\n        raise AggregationContractError("SET transformation permits only UNIT/BUNDLE")\n    if parent.package_type is PackageType.BOX and mixed_pg and remaining_children:\n        if not any(x.product_group == leading_pg for x in remaining_children):\n            raise AggregationManualReview("KITU_LEADING_PG_CHILD_REQUIRED_AFTER_REMOVAL")\n\n\ndef validate_disaggregation_preconditions(\n    *,\n    parents: Sequence[CisAggregationSnapshot],\n    participant_inn: str,\n    runtime_formed_status_values: frozenset[str] = frozenset(),\n) -> None:\n    owner = _inn(participant_inn, "participant_inn")\n    if not parents:\n        raise AggregationContractError("disaggregation parents required")\n    for parent in parents:\n        if parent.package_type is PackageType.GROUP:\n            raise AggregationManualReview("GROUP_PARENT_NOT_EXPOSED_FOR_LP")\n        if parent.package_type not in {PackageType.BOX, PackageType.SET}:\n            raise AggregationContractError("DISAGGREGATION_DOCUMENT supports BOX/SET for lp")\n        if parent.owner_inn != owner:\n            raise AggregationManualReview("LEGACY_NON_OWNER_FLOW_NOT_ENABLED")\n        if parent.status_raw not in {"APPLIED", "INTRODUCED"} and parent.status_raw not in runtime_formed_status_values:\n            raise AggregationManualReview("DISAGGREGATION_PARENT_STATUS_NOT_CONFIRMED")\n        if parent.status_ex_raw not in (None, "", "WAIT_TRANSFER_TO_OWNER"):\n            raise AggregationManualReview("DISAGGREGATION_STATUS_EX_NOT_SUPPORTED")\n        if parent.package_type is PackageType.SET and parent.status_raw == "APPLIED" and parent.status_ex_raw not in (None, ""):\n            raise AggregationManualReview("APPLIED_SET_SPECIAL_STATE_FORBIDDEN")\n\n\ndef _validate_atk_common_child(*, child: CisAggregationSnapshot, owner: str, allow_fts_control: bool) -> None:\n    if child.owner_inn != owner:\n        raise AggregationManualReview("ATK_OWNER_REQUIRED")\n    if child.status_raw != "APPLIED" or child.emission_type != "FOREIGN":\n        raise AggregationManualReview("ATK_CHILD_MUST_BE_APPLIED_FOREIGN")\n    allowed_ex = {None, "", "FTS_RESPOND_NOT_OK"} | ({"FTS_CONTROL"} if allow_fts_control else set())\n    if child.status_ex_raw not in allowed_ex:\n        raise AggregationManualReview("ATK_STATUS_EX_NOT_ALLOWED")\n    if child.package_type is None:\n        raise AggregationManualReview("UNKNOWN_RAW_PACKAGE_TYPE")\n    validate_lp_relation(PackageType.ATK, child.package_type, child_pg=child.product_group or M6_PG, mixed_pg=False)\n    if child.package_type in {PackageType.SET, PackageType.BOX, PackageType.GROUP} and not child.direct_children:\n        raise AggregationManualReview("ATK_AGGREGATE_CHILD_MUST_BE_NONEMPTY")\n    if not child.tnved or len(child.tnved) < 4:\n        raise AggregationManualReview("ATK_TNVED_REQUIRED")\n    if child.package_type is PackageType.SET:\n        if not child.nested_tnveds:\n            raise AggregationManualReview("ATK_KIN_NESTED_TNVED_EVIDENCE_REQUIRED")\n        if any(value != child.tnved for value in child.nested_tnveds):\n            raise AggregationManualReview("ATK_KIN_NESTED_TNVED_MISMATCH")\n\n\ndef validate_atk_preconditions(*, role: str, participant_inn: str, children: Sequence[CisAggregationSnapshot], allow_fts_control: bool = False) -> None:\n    if role != "IMPORTER":\n        raise AggregationManualReview("ATK_IMPORTER_ROLE_REQUIRED")\n    owner = _inn(participant_inn, "participant_inn")\n    if not children:\n        raise AggregationContractError("ATK children required")\n    pgs = {x.product_group for x in children}\n    if len(pgs) != 1:\n        raise AggregationManualReview("ATK_SINGLE_PRODUCT_GROUP_REQUIRED")\n    prefixes: set[str] = set()\n    for child in children:\n        _validate_atk_common_child(child=child, owner=owner, allow_fts_control=allow_fts_control)\n        if child.parent:\n            raise AggregationManualReview("ATK_CHILD_ALREADY_AGGREGATED")\n        assert child.tnved is not None\n        prefixes.add(child.tnved[:4])\n    if len(prefixes) != 1:\n        raise AggregationManualReview("ATK_TNVED_FIRST4_MUST_MATCH")\n\n\ndef validate_atk_transformation_preconditions(\n    *,\n    role: str,\n    participant_inn: str,\n    parent: CisAggregationSnapshot,\n    children: Sequence[CisAggregationSnapshot],\n    transformation_type: str,\n) -> None:\n    if role != "IMPORTER":\n        raise AggregationManualReview("ATK_IMPORTER_ROLE_REQUIRED")\n    owner = _inn(participant_inn, "participant_inn")\n    if parent.package_type is not PackageType.ATK or parent.owner_inn != owner or parent.status_raw != "APPLIED":\n        raise AggregationManualReview("ATK_PARENT_PRECONDITION_FAILED")\n    if parent.status_ex_raw not in (None, "", "FTS_RESPOND_NOT_OK"):\n        raise AggregationManualReview("ATK_PARENT_STATUS_EX_NOT_ALLOWED")\n    if transformation_type not in {"ADDING", "REMOVING"}:\n        raise AggregationContractError("transformation_type must be ADDING or REMOVING")\n    if not children:\n        raise AggregationContractError("ATK transformation children required")\n    pgs={x.product_group for x in children}\n    prefixes:set[str]=set()\n    for child in children:\n        _validate_atk_common_child(child=child, owner=owner, allow_fts_control=False)\n        if transformation_type == "ADDING" and child.parent not in (None, ""):\n            raise AggregationManualReview("ATK_ADD_CHILD_ALREADY_AGGREGATED")\n        if transformation_type == "REMOVING" and child.parent != parent.cis:\n            raise AggregationManualReview("ATK_REMOVE_CHILD_NOT_IN_PARENT")\n        assert child.tnved is not None\n        prefixes.add(child.tnved[:4])\n    if len(pgs) != 1 or len(prefixes) != 1:\n        raise AggregationManualReview("ATK_SINGLE_PG_TNVED_REQUIRED")\n\n\ndef validate_atk_disaggregation_preconditions(*, role: str, participant_inn: str, parents: Sequence[CisAggregationSnapshot]) -> None:\n    if role != "IMPORTER":\n        raise AggregationManualReview("ATK_IMPORTER_ROLE_REQUIRED")\n    owner = _inn(participant_inn, "participant_inn")\n    if not parents:\n        raise AggregationContractError("ATK parents required")\n    pgs=set()\n    for parent in parents:\n        if parent.package_type is not PackageType.ATK or parent.owner_inn != owner or parent.status_raw != "APPLIED":\n            raise AggregationManualReview("ATK_PARENT_PRECONDITION_FAILED")\n        if parent.status_ex_raw not in (None, "", "FTS_RESPOND_NOT_OK", "FTS_CONTROL"):\n            raise AggregationManualReview("ATK_DISAGGREGATION_STATUS_EX_NOT_ALLOWED")\n        pgs.add(parent.product_group)\n    if len(pgs) != 1:\n        raise AggregationManualReview("ATK_DISAGGREGATION_SINGLE_PG_REQUIRED")\n'''
          path=Path(p); s=path.read_text(encoding='utf-8'); path.write_text(s[:start]+replacement+s[end:],encoding='utf-8')

          rep(p,
          '''    if document.document_type != definition.document_type:\n        raise AggregationContractError("operation/document type mismatch")\n    if op in {AggregationOperationKind.TRANSFORM_PACKAGE_ADD, AggregationOperationKind.TRANSFORM_ATK_ADD} and document.to_wire().get("reaggregation_type", document.to_wire().get("transformation_type")) != "ADDING":\n''',
          '''    if document.document_type != definition.document_type:\n        raise AggregationContractError("operation/document type mismatch")\n    if isinstance(document, AggregationDocument):\n        required_type = UnitSerialNumberType.PRODUCT_SET if op is AggregationOperationKind.FORM_SET_GENERIC_COMPATIBILITY else UnitSerialNumberType.BOX\n        if any(unit.unit_serial_number_type is not required_type for unit in document.aggregation_units):\n            raise AggregationContractError(f"{op.value} requires unitSerialNumberType={required_type.value}")\n    if op in {AggregationOperationKind.TRANSFORM_PACKAGE_ADD, AggregationOperationKind.TRANSFORM_ATK_ADD} and document.to_wire().get("reaggregation_type", document.to_wire().get("transformation_type")) != "ADDING":\n''')

          old='''def build_aggregate_tree(root_cis: str, *, direct_children: Callable[[str], Sequence[str]], package_type_of: Callable[[str], str | None], safety_max_depth: int = INTERNAL_SAFETY_MAX_TREE_DEPTH) -> AggregateTreeResult:\n    warnings: list[str] = []\n    truncated = False\n    visiting: set[str] = set()\n    seen_edges: set[tuple[str, str]] = set()\n    def walk(cis: str, depth: int) -> AggregateTreeNode:\n        nonlocal truncated\n        if depth > safety_max_depth:\n            truncated = True; warnings.append("INTERNAL_SAFETY_LIMIT"); return AggregateTreeNode(cis, package_type_of(cis), ())\n        if cis in visiting:\n            warnings.append("CYCLE_DETECTED"); return AggregateTreeNode(cis, package_type_of(cis), ())\n        visiting.add(cis)\n        children_nodes: list[AggregateTreeNode] = []\n        for child in direct_children(cis):\n            edge = (cis, child)\n            if edge in seen_edges:\n                warnings.append("DUPLICATE_EDGE_DROPPED"); continue\n            seen_edges.add(edge)\n            children_nodes.append(walk(child, depth + 1))\n        visiting.remove(cis)\n        return AggregateTreeNode(cis, package_type_of(cis), tuple(children_nodes))\n    root = walk(_code(root_cis, "root_cis"), 0)\n    return AggregateTreeResult(root, not truncated and "CYCLE_DETECTED" not in warnings, truncated, tuple(warnings))\n'''
          new='''def build_aggregate_tree(root_cis: str, *, direct_children: Callable[[str], Sequence[str]], package_type_of: Callable[[str], str | None], safety_max_depth: int = INTERNAL_SAFETY_MAX_TREE_DEPTH) -> AggregateTreeResult:\n    warnings: list[str] = []\n    truncated = False\n    incomplete = False\n    visiting: set[str] = set()\n    seen_edges: set[tuple[str, str]] = set()\n    known_types = {item.value for item in PackageType}\n    def walk(cis: str, depth: int) -> AggregateTreeNode:\n        nonlocal truncated, incomplete\n        package_raw = package_type_of(cis)\n        if package_raw not in known_types:\n            warnings.append(f"UNKNOWN_RAW_PACKAGE_TYPE:{package_raw}")\n            incomplete = True\n        if depth > safety_max_depth:\n            truncated = True; incomplete = True; warnings.append("INTERNAL_SAFETY_LIMIT"); return AggregateTreeNode(cis, package_raw, ())\n        if cis in visiting:\n            warnings.append("CYCLE_DETECTED"); incomplete = True; return AggregateTreeNode(cis, package_raw, ())\n        visiting.add(cis)\n        children_nodes: list[AggregateTreeNode] = []\n        for child in direct_children(cis):\n            edge = (cis, child)\n            if edge in seen_edges:\n                warnings.append("DUPLICATE_EDGE_DROPPED"); incomplete = True; continue\n            seen_edges.add(edge)\n            children_nodes.append(walk(child, depth + 1))\n        visiting.remove(cis)\n        return AggregateTreeNode(cis, package_raw, tuple(children_nodes))\n    root = walk(_code(root_cis, "root_cis"), 0)\n    return AggregateTreeResult(root, not incomplete and not truncated, truncated, tuple(warnings))\n'''
          rep(p,old,new)

          old_sig='''    def reconcile_relation(self, *, operation: AggregationOperationKind, document_status_raw: str | None, expected_parent: str | None, expected_children: Sequence[str], actual_children: Sequence[str], removed_children: Sequence[str] = (), child_parents: Mapping[str, str | None] | None = None, history_events: Sequence[AggregationHistoryEvent] = ()) -> AggregationReconciliationResult:\n'''
          new_sig='''    def reconcile_relation(self, *, operation: AggregationOperationKind, document_status_raw: str | None, expected_parent: str | None, expected_children: Sequence[str], actual_children: Sequence[str], removed_children: Sequence[str] = (), child_parents: Mapping[str, str | None] | None = None, history_events: Sequence[AggregationHistoryEvent] = (), parent_status_raw_observed: str | None = None) -> AggregationReconciliationResult:\n'''
          rep(p,old_sig,new_sig)
          rep(p,
          '''        if operation in {AggregationOperationKind.FORM_TRANSPORT_PACKAGE, AggregationOperationKind.FORM_MULTIPRODUCT_TRANSPORT_PACKAGE, AggregationOperationKind.FORM_SET, AggregationOperationKind.FORM_SET_GENERIC_COMPATIBILITY}:\n            if actual == expected and (not child_parents or all(child_parents.get(c) == expected_parent for c in expected)):\n                return AggregationReconciliationResult(AggregationReconciliationState.RECONCILED, "EXACT_RELATION_CONFIRMED", expected_parent)\n        elif operation is AggregationOperationKind.TRANSFORM_PACKAGE_ADD:\n            if expected <= actual:\n                return AggregationReconciliationResult(AggregationReconciliationState.RECONCILED, "ADD_RELATION_CONFIRMED", expected_parent)\n        elif operation is AggregationOperationKind.TRANSFORM_PACKAGE_REMOVE:\n            if actual == expected and not (removed & actual):\n                return AggregationReconciliationResult(AggregationReconciliationState.RECONCILED, "REMOVE_RELATION_CONFIRMED", expected_parent)\n        elif operation is AggregationOperationKind.DISAGGREGATE_PACKAGE:\n            history_ok = any(x.semantic in {AggregationHistorySemantic.DISAGGREGATION, AggregationHistorySemantic.AUTO_DISAGGREGATION} for x in history_events)\n            parents_clear = not child_parents or all(child_parents.get(c) != expected_parent for c in expected | removed)\n            if not actual and parents_clear and history_ok:\n                return AggregationReconciliationResult(AggregationReconciliationState.RECONCILED, "DISAGGREGATION_RELATION_AND_HISTORY_CONFIRMED", expected_parent)\n''',
          '''        if operation in {AggregationOperationKind.FORM_TRANSPORT_PACKAGE, AggregationOperationKind.FORM_MULTIPRODUCT_TRANSPORT_PACKAGE, AggregationOperationKind.FORM_SET, AggregationOperationKind.FORM_SET_GENERIC_COMPATIBILITY}:\n            if actual == expected and child_parents is not None and all(child_parents.get(c) == expected_parent for c in expected):\n                return AggregationReconciliationResult(AggregationReconciliationState.RECONCILED, "EXACT_RELATION_CONFIRMED", expected_parent)\n        elif operation is AggregationOperationKind.TRANSFORM_PACKAGE_ADD:\n            if actual == expected and child_parents is not None and all(child_parents.get(c) == expected_parent for c in expected):\n                return AggregationReconciliationResult(AggregationReconciliationState.RECONCILED, "ADD_RELATION_CONFIRMED", expected_parent)\n        elif operation is AggregationOperationKind.TRANSFORM_PACKAGE_REMOVE:\n            remaining_ok = child_parents is not None and all(child_parents.get(c) == expected_parent for c in expected)\n            removed_ok = child_parents is not None and all(child_parents.get(c) != expected_parent for c in removed)\n            if actual == expected and not (removed & actual) and remaining_ok and removed_ok:\n                return AggregationReconciliationResult(AggregationReconciliationState.RECONCILED, "REMOVE_RELATION_CONFIRMED", expected_parent)\n        elif operation is AggregationOperationKind.DISAGGREGATE_PACKAGE:\n            history_ok = any(x.semantic in {AggregationHistorySemantic.DISAGGREGATION, AggregationHistorySemantic.AUTO_DISAGGREGATION} for x in history_events)\n            parents_clear = child_parents is not None and all(child_parents.get(c) != expected_parent for c in expected | removed)\n            if not actual and parents_clear and history_ok and parent_status_raw_observed is not None:\n                return AggregationReconciliationResult(AggregationReconciliationState.RECONCILED, "DISAGGREGATION_RELATION_HISTORY_STATE_READBACK_CONFIRMED", expected_parent)\n''')

          insert_after='''        return AggregationReconciliationResult(AggregationReconciliationState.RECONCILED, "ATK_PARENT_DISCOVERED_AND_RELATION_CONFIRMED", parent)\n'''
          extension='''\n\n    def reconcile_atk_transformation(self, *, document_status_raw: str | None, parent: str, expected_children: Sequence[str], actual_children: Sequence[str], changed_children: Sequence[str], transformation_type: str, child_parents: Mapping[str, str | None]) -> AggregationReconciliationResult:\n        if document_status_raw != "CHECKED_OK":\n            return AggregationReconciliationResult(AggregationReconciliationState.RECONCILIATION_PENDING, "DOCUMENT_NOT_CONFIRMED_SUCCESS", parent)\n        expected=set(expected_children); actual=set(actual_children); changed=set(changed_children)\n        if actual != expected:\n            return AggregationReconciliationResult(AggregationReconciliationState.MANUAL_REVIEW, "ATK_RELATION_MISMATCH", parent)\n        if transformation_type == "ADDING":\n            ok=all(child_parents.get(c)==parent for c in expected)\n        elif transformation_type == "REMOVING":\n            ok=all(child_parents.get(c)==parent for c in expected) and all(child_parents.get(c)!=parent for c in changed)\n        else:\n            return AggregationReconciliationResult(AggregationReconciliationState.MANUAL_REVIEW, "ATK_TRANSFORMATION_TYPE_UNKNOWN", parent)\n        return AggregationReconciliationResult(AggregationReconciliationState.RECONCILED if ok else AggregationReconciliationState.MANUAL_REVIEW, "ATK_TRANSFORMATION_RELATION_CONFIRMED" if ok else "ATK_CHILD_PARENT_MISMATCH", parent)\n\n    def reconcile_atk_disaggregation(self, *, document_status_raw: str | None, parent: str, actual_children: Sequence[str], former_children: Sequence[str], child_parents: Mapping[str, str | None], history_events: Sequence[AggregationHistoryEvent]) -> AggregationReconciliationResult:\n        if document_status_raw != "CHECKED_OK":\n            return AggregationReconciliationResult(AggregationReconciliationState.RECONCILIATION_PENDING, "DOCUMENT_NOT_CONFIRMED_SUCCESS", parent)\n        history_ok=any(x.semantic is AggregationHistorySemantic.DISAGGREGATION for x in history_events)\n        clear=not actual_children and all(child_parents.get(c)!=parent for c in former_children)\n        if clear and history_ok:\n            return AggregationReconciliationResult(AggregationReconciliationState.RECONCILED, "ATK_DISAGGREGATION_RELATION_AND_HISTORY_CONFIRMED", parent)\n        return AggregationReconciliationResult(AggregationReconciliationState.MANUAL_REVIEW, "ATK_DISAGGREGATION_MISMATCH", parent)\n'''
          rep(p,insert_after,insert_after+extension)

          anchor='''M5_AGGREGATION_HARDENING: Mapping[str, str] = {\n    "LK_RECEIPT_DISTANCE": "CAPTURE_PARENT_GRAPH_AND_RECONCILE_AUTO_DISAGGREGATION",\n    "LP_RETURN": "DISTINGUISH_AGGREGATE_RETURN_FROM_NESTED_CHILD_RETURN",\n    "WRITE_OFF_KITU": "RECONCILE_AUTO_DISAGGREGATION",\n    "WRITE_OFF_KIN": "MANUAL_REVIEW_AND_RAW_RECONCILIATION",\n    "LK_REMARK_KIN": "TYPE_SPECIFIC_INTRODUCED_RETIRED_RECONCILIATION",\n    "INTRODUCTION": "CAPTURE_PARENT_AND_RECONCILE_CHILD_SEPARATE_INTRODUCTION",\n    "LP_FTS_INTRODUCE": "USE_EXACT_AGGREGATE_EXCEPTION_PATHS",\n    "LK_RECEIPT_CANCEL": "REREAD_RELATION_GRAPH_DO_NOT_ASSUME_RESTORATION",\n}\n'''
          m5ext='''\n\n@dataclass(frozen=True, slots=True)\nclass M5AggregationObservation:\n    cis: str\n    pre_parent: str | None\n    pre_parent_package_type: PackageType | None\n    post_parent: str | None\n    target_package_type: PackageType | None = None\n    relation_read_complete: bool = False\n    relation_preserved: bool | None = None\n    history_semantics: tuple[AggregationHistorySemantic, ...] = ()\n    old_status_raw: str | None = None\n    remark_replacement_confirmed: bool = False\n    fts_color_size_exception: bool = False\n\n\ndef reconcile_m5_aggregation_side_effect(*, operation_kind: str, observations: Sequence[M5AggregationObservation]) -> AggregationReconciliationResult:\n    if not observations:\n        return AggregationReconciliationResult(AggregationReconciliationState.RECONCILIATION_PENDING, "M5_AGGREGATION_READBACK_REQUIRED")\n    disagg_events={AggregationHistorySemantic.DISAGGREGATION, AggregationHistorySemantic.AUTO_DISAGGREGATION}\n    introductions={"INTRODUCE_DOMESTIC","INTRODUCE_FROM_INDIVIDUAL","INTRODUCE_IMPORT_PRE_MANDATORY","INTRODUCE_EAEU","INTRODUCE_REMAINS","INTRODUCE_CONTRACT","INTRODUCE_FTS"}\n    for obs in observations:\n        if not obs.relation_read_complete:\n            return AggregationReconciliationResult(AggregationReconciliationState.RECONCILIATION_PENDING, "M5_AGGREGATION_RELATION_REREAD_REQUIRED", obs.pre_parent)\n        if obs.pre_parent is None:\n            continue\n        parent_type=obs.pre_parent_package_type\n        history_ok=bool(set(obs.history_semantics) & disagg_events)\n        if operation_kind == "CANCEL_WITHDRAWAL":\n            continue  # Readback is mandatory; restoration itself is never assumed.\n        if operation_kind in {"WITHDRAW_DISTANCE"} or operation_kind in introductions:\n            if operation_kind == "INTRODUCE_FTS" and obs.fts_color_size_exception:\n                if obs.post_parent != obs.pre_parent:\n                    return AggregationReconciliationResult(AggregationReconciliationState.MANUAL_REVIEW, "FTS_COLOR_SIZE_RELATION_UNEXPECTEDLY_CHANGED", obs.pre_parent)\n                continue\n            if obs.post_parent == obs.pre_parent or not history_ok:\n                return AggregationReconciliationResult(AggregationReconciliationState.MANUAL_REVIEW, "EXPECTED_AUTO_DISAGGREGATION_NOT_CONFIRMED", obs.pre_parent)\n        elif operation_kind in {"RETURN_TO_CIRCULATION", "RETURN_REMOTE_SALE"}:\n            if obs.target_package_type in {PackageType.SET, PackageType.GROUP}:\n                if obs.relation_preserved is not True:\n                    return AggregationReconciliationResult(AggregationReconciliationState.MANUAL_REVIEW, "AGGREGATE_RETURN_RELATION_NOT_PRESERVED", obs.pre_parent)\n            elif obs.post_parent == obs.pre_parent or not history_ok:\n                return AggregationReconciliationResult(AggregationReconciliationState.MANUAL_REVIEW, "NESTED_RETURN_AUTO_DISAGGREGATION_NOT_CONFIRMED", obs.pre_parent)\n        elif operation_kind == "WRITE_OFF":\n            if parent_type is PackageType.SET:\n                return AggregationReconciliationResult(AggregationReconciliationState.MANUAL_REVIEW, "WRITE_OFF_KIN_EFFECT_NOT_DOCUMENTED", obs.pre_parent)\n            if parent_type in {PackageType.BOX, PackageType.ATK} and (obs.post_parent == obs.pre_parent or not history_ok):\n                return AggregationReconciliationResult(AggregationReconciliationState.MANUAL_REVIEW, "WRITE_OFF_AUTO_DISAGGREGATION_NOT_CONFIRMED", obs.pre_parent)\n        elif operation_kind == "REMARK":\n            if parent_type is PackageType.SET:\n                if obs.old_status_raw == "INTRODUCED":\n                    if not obs.remark_replacement_confirmed or obs.post_parent != obs.pre_parent:\n                        return AggregationReconciliationResult(AggregationReconciliationState.MANUAL_REVIEW, "KIN_INTRODUCED_REMARK_REPLACEMENT_NOT_CONFIRMED", obs.pre_parent)\n                elif obs.old_status_raw == "RETIRED":\n                    if obs.post_parent == obs.pre_parent or not history_ok:\n                        return AggregationReconciliationResult(AggregationReconciliationState.MANUAL_REVIEW, "KIN_RETIRED_REMARK_DISAGGREGATION_NOT_CONFIRMED", obs.pre_parent)\n                else:\n                    return AggregationReconciliationResult(AggregationReconciliationState.MANUAL_REVIEW, "KIN_REMARK_SOURCE_STATE_UNKNOWN", obs.pre_parent)\n            elif parent_type is PackageType.BOX and (obs.post_parent == obs.pre_parent or not history_ok):\n                return AggregationReconciliationResult(AggregationReconciliationState.MANUAL_REVIEW, "KITU_REMARK_AUTO_DISAGGREGATION_NOT_CONFIRMED", obs.pre_parent)\n        else:\n            return AggregationReconciliationResult(AggregationReconciliationState.MANUAL_REVIEW, "M5_AGGREGATION_EFFECT_NOT_MODELLED", obs.pre_parent)\n    return AggregationReconciliationResult(AggregationReconciliationState.RECONCILED, "M5_AGGREGATION_EFFECT_CONFIRMED")\n'''
          rep(p,anchor,anchor+m5ext)

          # Harden accepted M5 with aggregation evidence fields + optional reconciliation hook.
          p='src/wbcz/turnover.py'
          rep(p,
          '''    commission_from_individual_confirmed: bool | None = None\n    fetched_at: datetime | None = None\n''',
          '''    commission_from_individual_confirmed: bool | None = None\n    fetched_at: datetime | None = None\n    parent: str | None = None\n    package_type: str | None = None\n    direct_children: tuple[str, ...] = ()\n''')
          rep(p,
          '''                    "emissionType": item.emission_type,\n                }\n''',
          '''                    "emissionType": item.emission_type,\n                    "parent": item.parent,\n                    "packageType": item.package_type,\n                    "directChildren": list(item.direct_children),\n                }\n''')
          rep(p,
          '''        latest_operation_is_original: bool,\n    ) -> PreconditionEvidence:\n''',
          '''        latest_operation_is_original: bool,\n        target_snapshots: Sequence[CisSnapshot] = (),\n    ) -> PreconditionEvidence:\n''')
          rep(p,
          '''        if not latest_operation_is_original:\n            raise TurnoverManualReview("CANCEL_SOURCE_NOT_LATEST_ELIGIBLE_OPERATION")\n        return PreconditionEvidence(\n            TurnoverOperationKind.CANCEL_WITHDRAWAL,\n            (),\n            ({"sourceDocumentStatus": original_document_status, "sourceSenderInn": original_sender_inn},),\n            self._now().astimezone(timezone.utc).isoformat(),\n        )\n''',
          '''        if not latest_operation_is_original:\n            raise TurnoverManualReview("CANCEL_SOURCE_NOT_LATEST_ELIGIBLE_OPERATION")\n        for snapshot in target_snapshots:\n            self._fresh(snapshot)\n        observed = [{"sourceDocumentStatus": original_document_status, "sourceSenderInn": original_sender_inn}]\n        observed.extend({"cis": item.cis, "status": item.status, "statusEx": item.status_ex, "ownerInn": item.owner_inn, "withdrawReason": item.withdraw_reason, "parent": item.parent, "packageType": item.package_type, "directChildren": list(item.direct_children)} for item in target_snapshots)\n        return PreconditionEvidence(\n            TurnoverOperationKind.CANCEL_WITHDRAWAL,\n            tuple(item.cis for item in target_snapshots),\n            tuple(observed),\n            self._now().astimezone(timezone.utc).isoformat(),\n        )\n''')
          rep(p,
          '''        expected_restore: Mapping[str, tuple[str | None, str | None]] | None = None,\n    ) -> ReconciliationResult:\n''',
          '''        expected_restore: Mapping[str, tuple[str | None, str | None]] | None = None,\n        pre_parent_map: Mapping[str, str | None] | None = None,\n        aggregation_observations: Sequence[Any] = (),\n    ) -> ReconciliationResult:\n''')
          rep(p,
          '''                "withdrawReason": item.withdraw_reason,\n            }\n''',
          '''                "withdrawReason": item.withdraw_reason,\n                "parent": item.parent,\n                "packageType": item.package_type,\n            }\n''')
          rep(p,
          '''        else:\n            ok = False\n        return ReconciliationResult(\n            ReconciliationState.RECONCILED if ok else ReconciliationState.PENDING,\n''',
          '''        else:\n            ok = False\n        aggregation_relevant = {\n            TurnoverOperationKind.WITHDRAW_DISTANCE, TurnoverOperationKind.RETURN_TO_CIRCULATION,\n            TurnoverOperationKind.RETURN_REMOTE_SALE, TurnoverOperationKind.REMARK, TurnoverOperationKind.WRITE_OFF,\n            TurnoverOperationKind.CANCEL_WITHDRAWAL, TurnoverOperationKind.INTRODUCE_DOMESTIC,\n            TurnoverOperationKind.INTRODUCE_FROM_INDIVIDUAL, TurnoverOperationKind.INTRODUCE_IMPORT_PRE_MANDATORY,\n            TurnoverOperationKind.INTRODUCE_EAEU, TurnoverOperationKind.INTRODUCE_REMAINS,\n            TurnoverOperationKind.INTRODUCE_CONTRACT, TurnoverOperationKind.INTRODUCE_FTS,\n        }\n        if ok and kind in aggregation_relevant and pre_parent_map and any(pre_parent_map.values()):\n            if not aggregation_observations:\n                return ReconciliationResult(ReconciliationState.PENDING, document_status_raw, "AGGREGATION_RECONCILIATION_REQUIRED", observed)\n            from wbcz.aggregation import AggregationReconciliationState, reconcile_m5_aggregation_side_effect\n            aggregate = reconcile_m5_aggregation_side_effect(operation_kind=kind.value, observations=aggregation_observations)\n            if aggregate.state is not AggregationReconciliationState.RECONCILED:\n                state = ReconciliationState.PENDING if aggregate.state is AggregationReconciliationState.RECONCILIATION_PENDING else ReconciliationState.MANUAL_REVIEW\n                return ReconciliationResult(state, document_status_raw, aggregate.reason, observed)\n        return ReconciliationResult(\n            ReconciliationState.RECONCILED if ok else ReconciliationState.PENDING,\n''')

          p='src/wbcz_web/services/turnover.py'
          rep(p,
          '''        expected_restore: Mapping[str, tuple[str | None, str | None]] | None = None,\n    ) -> dict[str, Any]:\n''',
          '''        expected_restore: Mapping[str, tuple[str | None, str | None]] | None = None,\n        aggregation_observations: Sequence[Any] = (),\n    ) -> dict[str, Any]:\n''')
          rep(p,
          '''        result = self.reconciler.reconcile(\n            operation_kind=ledger.operation_kind,\n            document_status_raw=document_status_raw,\n            snapshots=cis_snapshots,\n            expected_restore=expected_restore,\n        )\n''',
          '''        observed_pre = ledger.precondition_snapshot.get("observed", []) if isinstance(ledger.precondition_snapshot, dict) else []\n        pre_parent_map = {str(item.get("cis")): item.get("parent") for item in observed_pre if isinstance(item, dict) and item.get("cis")}\n        result = self.reconciler.reconcile(\n            operation_kind=ledger.operation_kind,\n            document_status_raw=document_status_raw,\n            snapshots=cis_snapshots,\n            expected_restore=expected_restore,\n            pre_parent_map=pre_parent_map,\n            aggregation_observations=aggregation_observations,\n        )\n''')

          # Expand M6 tests with exact missing hardening cases.
          p='tests/test_m6_aggregation.py'
          path=Path(p); s=path.read_text(encoding='utf-8')
          insert='''\nfrom wbcz.aggregation import (\n    M5AggregationObservation, validate_atk_disaggregation_preconditions,\n    validate_atk_transformation_preconditions, validate_disaggregation_preconditions,\n    validate_reaggregation_preconditions, reconcile_m5_aggregation_side_effect,\n)\nfrom wbcz.turnover import CisSnapshot as TurnoverCisSnapshot, OperationReconciliationService, ReconciliationState, TurnoverOperationKind\n'''
          marker='''INN = "1234567890"\n'''
          if insert.strip() not in s:
              s=s.replace(marker,insert+'\n'+marker,1)
          s += '''\n\ndef test_generic_set_compatibility_requires_product_set_and_transport_requires_box() -> None:\n    generic = AggregationDocument(INN, (AggregationUnit(PARENT, UnitSerialNumberType.PRODUCT_SET, (C1,)),))\n    prepare_aggregation_document(AggregationOperationKind.FORM_SET_GENERIC_COMPATIBILITY, generic)\n    with pytest.raises(AggregationContractError):\n        prepare_aggregation_document(AggregationOperationKind.FORM_SET_GENERIC_COMPATIBILITY, AggregationDocument(INN, (AggregationUnit(PARENT, UnitSerialNumberType.BOX, (C1,)),)))\n    with pytest.raises(AggregationContractError):\n        prepare_aggregation_document(AggregationOperationKind.FORM_TRANSPORT_PACKAGE, generic)\n\n\ndef test_bundle_is_lp_only_and_tree_unknown_package_is_incomplete() -> None:\n    with pytest.raises(AggregationContractError, match="only for lp"):\n        validate_lp_relation(PackageType.BOX, PackageType.BUNDLE, child_pg="milk", mixed_pg=True)\n    result=build_aggregate_tree(PARENT, direct_children=lambda _: (), package_type_of=lambda _: "FUTURE_PACKAGE")\n    assert not result.complete and any(x.startswith("UNKNOWN_RAW_PACKAGE_TYPE") for x in result.warnings)\n\n\ndef test_reaggregation_preconditions_set_box_remove_and_leading_pg() -> None:\n    set_parent=snap(PARENT, PackageType.SET, status="INTRODUCED")\n    child=snap(C1, PackageType.UNIT, status="INTRODUCED", parent=PARENT)\n    validate_reaggregation_preconditions(parent=set_parent, children=(child,), reaggregation_type="REMOVING", participant_inn=INN)\n    with pytest.raises(AggregationContractError):\n        validate_reaggregation_preconditions(parent=set_parent, children=(snap(C2, PackageType.BOX, status="INTRODUCED", parent=PARENT),), reaggregation_type="REMOVING", participant_inn=INN)\n    box_parent=snap(PARENT, PackageType.BOX, status="INTRODUCED")\n    removed=snap(C1, PackageType.UNIT, status="INTRODUCED", parent=PARENT)\n    with pytest.raises(AggregationManualReview, match="LEADING_PG"):\n        validate_reaggregation_preconditions(parent=box_parent, children=(removed,), reaggregation_type="REMOVING", participant_inn=INN, remaining_children=(snap(C2, PackageType.GROUP, pg="milk", status="INTRODUCED", parent=PARENT),), mixed_pg=True, leading_pg="lp")\n\n\ndef test_disaggregation_preconditions_no_formed_enum_and_runtime_formed_value_is_explicit() -> None:\n    validate_disaggregation_preconditions(parents=(snap(PARENT, PackageType.BOX, status="INTRODUCED"),), participant_inn=INN)\n    formed=snap(PARENT, PackageType.BOX, status="RUNTIME_FORMED_VALUE")\n    with pytest.raises(AggregationManualReview):\n        validate_disaggregation_preconditions(parents=(formed,), participant_inn=INN)\n    validate_disaggregation_preconditions(parents=(formed,), participant_inn=INN, runtime_formed_status_values=frozenset({"RUNTIME_FORMED_VALUE"}))\n    with pytest.raises(AggregationManualReview, match="GROUP"):\n        validate_disaggregation_preconditions(parents=(snap(PARENT, PackageType.GROUP, status="INTRODUCED"),), participant_inn=INN)\n\n\ndef test_atk_transformation_and_disaggregation_status_ex_are_operation_specific() -> None:\n    atk_parent=snap(PARENT, PackageType.ATK, status="APPLIED", emission="FOREIGN", status_ex="FTS_RESPOND_NOT_OK", children=(C1,))\n    child=snap(C1, PackageType.UNIT, status="APPLIED", emission="FOREIGN", parent=PARENT)\n    validate_atk_transformation_preconditions(role="IMPORTER", participant_inn=INN, parent=atk_parent, children=(child,), transformation_type="REMOVING")\n    with pytest.raises(AggregationManualReview, match="STATUS_EX"):\n        validate_atk_transformation_preconditions(role="IMPORTER", participant_inn=INN, parent=snap(PARENT, PackageType.ATK, status="APPLIED", emission="FOREIGN", status_ex="FTS_CONTROL"), children=(child,), transformation_type="REMOVING")\n    validate_atk_disaggregation_preconditions(role="IMPORTER", participant_inn=INN, parents=(snap(PARENT, PackageType.ATK, status="APPLIED", emission="FOREIGN", status_ex="FTS_CONTROL"),))\n\n\ndef test_reconciliation_requires_exact_add_parents_and_disaggregation_state_readback() -> None:\n    svc=AggregationReconciliationService()\n    bad_add=svc.reconcile_relation(operation=AggregationOperationKind.TRANSFORM_PACKAGE_ADD, document_status_raw="CHECKED_OK", expected_parent=PARENT, expected_children=(C1,C2), actual_children=(C1,C2,C3), child_parents={C1:PARENT,C2:PARENT,C3:PARENT})\n    assert bad_add.state is AggregationReconciliationState.MANUAL_REVIEW\n    event=normalize_aggregation_history_event({"operationType":"DISAGGREGATION","operationDate":"2021-08-10 10:11:01"})\n    pending=svc.reconcile_relation(operation=AggregationOperationKind.DISAGGREGATE_PACKAGE, document_status_raw="CHECKED_OK", expected_parent=PARENT, expected_children=(C1,), actual_children=(), child_parents={C1:None}, history_events=(event,))\n    assert pending.state is AggregationReconciliationState.MANUAL_REVIEW\n    ok=svc.reconcile_relation(operation=AggregationOperationKind.DISAGGREGATE_PACKAGE, document_status_raw="CHECKED_OK", expected_parent=PARENT, expected_children=(C1,), actual_children=(), child_parents={C1:None}, history_events=(event,), parent_status_raw_observed="SOME_RUNTIME_STATUS")\n    assert ok.state is AggregationReconciliationState.RECONCILED\n\n\ndef test_atk_transform_and_disaggregation_reconciliation() -> None:\n    svc=AggregationReconciliationService()\n    add=svc.reconcile_atk_transformation(document_status_raw="CHECKED_OK", parent=PARENT, expected_children=(C1,C2), actual_children=(C1,C2), changed_children=(C2,), transformation_type="ADDING", child_parents={C1:PARENT,C2:PARENT})\n    assert add.state is AggregationReconciliationState.RECONCILED\n    event=normalize_aggregation_history_event({"operationType":"DISAGGREGATION","operationDate":"2021-08-10T10:11:01Z"})\n    dis=svc.reconcile_atk_disaggregation(document_status_raw="CHECKED_OK", parent=PARENT, actual_children=(), former_children=(C1,), child_parents={C1:None}, history_events=(event,))\n    assert dis.state is AggregationReconciliationState.RECONCILED\n\n\ndef test_m5_aggregation_hardening_requires_relation_readback_and_models_known_effects() -> None:\n    obs=M5AggregationObservation(C1,PARENT,PackageType.BOX,None,relation_read_complete=True,history_semantics=(AggregationHistorySemantic.AUTO_DISAGGREGATION,))\n    result=reconcile_m5_aggregation_side_effect(operation_kind="WITHDRAW_DISTANCE", observations=(obs,))\n    assert result.state is AggregationReconciliationState.RECONCILED\n    missing=M5AggregationObservation(C1,PARENT,PackageType.BOX,PARENT,relation_read_complete=False)\n    assert reconcile_m5_aggregation_side_effect(operation_kind="WITHDRAW_DISTANCE", observations=(missing,)).state is AggregationReconciliationState.RECONCILIATION_PENDING\n    kin=M5AggregationObservation(C1,PARENT,PackageType.SET,PARENT,relation_read_complete=True)\n    assert reconcile_m5_aggregation_side_effect(operation_kind="WRITE_OFF", observations=(kin,)).state is AggregationReconciliationState.MANUAL_REVIEW\n\n\ndef test_m5_reconciliation_does_not_accept_checked_ok_when_parent_effect_unreconciled() -> None:\n    svc=OperationReconciliationService()\n    post=TurnoverCisSnapshot(C1,"RETIRED",None,INN,"DISTANCE",fetched_at=NOW,parent=None,package_type="UNIT")\n    pending=svc.reconcile(operation_kind=TurnoverOperationKind.WITHDRAW_DISTANCE, document_status_raw="CHECKED_OK", snapshots=(post,), pre_parent_map={C1:PARENT})\n    assert pending.state is ReconciliationState.PENDING and pending.reason == "AGGREGATION_RECONCILIATION_REQUIRED"\n    obs=M5AggregationObservation(C1,PARENT,PackageType.BOX,None,relation_read_complete=True,history_semantics=(AggregationHistorySemantic.AUTO_DISAGGREGATION,))\n    ok=svc.reconcile(operation_kind=TurnoverOperationKind.WITHDRAW_DISTANCE, document_status_raw="CHECKED_OK", snapshots=(post,), pre_parent_map={C1:PARENT}, aggregation_observations=(obs,))\n    assert ok.state is ReconciliationState.RECONCILED\n\n\ndef test_cancel_withdrawal_requires_relation_reread_when_pre_parent_exists() -> None:\n    svc=OperationReconciliationService()\n    restored=TurnoverCisSnapshot(C1,"INTRODUCED",None,INN,None,fetched_at=NOW,parent=PARENT,package_type="UNIT")\n    pending=svc.reconcile(operation_kind=TurnoverOperationKind.CANCEL_WITHDRAWAL, document_status_raw="CHECKED_OK", snapshots=(restored,), expected_restore={C1:("INTRODUCED",None)}, pre_parent_map={C1:PARENT})\n    assert pending.state is ReconciliationState.PENDING\n    obs=M5AggregationObservation(C1,PARENT,PackageType.BOX,PARENT,relation_read_complete=True)\n    ok=svc.reconcile(operation_kind=TurnoverOperationKind.CANCEL_WITHDRAWAL, document_status_raw="CHECKED_OK", snapshots=(restored,), expected_restore={C1:("INTRODUCED",None)}, pre_parent_map={C1:PARENT}, aggregation_observations=(obs,))\n    assert ok.state is ReconciliationState.RECONCILED\n'''
          path.write_text(s,encoding='utf-8')

          # Docs: make applied hardening explicit, not merely a registry statement.
          p='docs/M6_AGGREGATION_CONTRACT.md'
          path=Path(p); s=path.read_text(encoding='utf-8')
          old='''Accepted M5 is not rewritten. Aggregate-aware hardening requires capturing the parent graph before relevant M5 writes and reconciling after success. DISTANCE and nested introductions reconcile expected KITU effects; LP_RETURN distinguishes returning the aggregate itself from returning a nested child; WRITE_OFF KITU expects auto-disaggregation while WRITE_OFF KIN remains raw/manual when exact effect is not documented; LK_REMARK KIN uses type-specific rules; LK_RECEIPT_CANCEL re-reads the relation graph and never assumes relationship restoration from restored statuses alone.\n'''
          new='''Accepted M5 is not rewritten. Aggregate-aware hardening is wired into M5 evidence/reconciliation: fresh precondition snapshots persist `parent`, package type and direct-child evidence; if the accepted M5 operation had a parent relation, business reconciliation does not become `RECONCILED` until a fresh M6 relation observation is supplied. DISTANCE and nested introductions require the documented disaggregation readback/history; LP_RETURN distinguishes aggregate return from nested-child return; WRITE_OFF KITU/ATK requires expected disaggregation while WRITE_OFF KIN remains MANUAL_REVIEW; LK_REMARK KIN uses INTRODUCED/RETIRED-specific confirmation; LK_RECEIPT_CANCEL requires relation re-read but never assumes graph restoration from restored statuses alone.\n'''
          if old not in s: raise SystemExit('docs hardening paragraph not found')
          path.write_text(s.replace(old,new,1),encoding='utf-8')

          for f in ('src/wbcz/aggregation.py','src/wbcz/turnover.py','src/wbcz_web/services/turnover.py','tests/test_m6_aggregation.py'):
              compile(Path(f).read_text(encoding='utf-8'),f,'exec')
          PY
          git diff --check
          python -m pip install -e '.[ui,test,web]'
          python -m pytest -q tests/test_m6_aggregation.py tests/test_m5_turnover.py
      - name: Commit M6 hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/wbcz/aggregation.py src/wbcz/turnover.py src/wbcz_web/services/turnover.py tests/test_m6_aggregation.py docs/M6_AGGREGATION_CONTRACT.md
          git diff --cached --check
          git commit -m 'feat: harden M6 aggregation and M5 aggregate reconciliation'
          git push origin HEAD:m6/aggregation-001
