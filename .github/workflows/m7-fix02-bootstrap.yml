name: M7 fix02 bootstrap

on:
  push:
    branches:
      - m7/edo-lite-foundation-001

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m7/edo-lite-foundation-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply micro M7 FIX-02
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected one match, got {n}")
              p.write_text(s.replace(old, new, 1), encoding="utf-8")

          path = "src/wbcz/edo_lite.py"
          replace_once(
              path,
              'def _schema(identity: str, family: str, type_code: str | None, role: str | None = None, function: str | None = None, *, reason: str = "OFFICIAL_SCHEMA_NOT_PINNED") -> SchemaDefinition:\n    return SchemaDefinition(identity, family, type_code, role, function, None, None, None, None, None, None, None, None, None, None, None, False, True, reason)\n',
              'def _schema(\n    identity: str,\n    family: str,\n    type_code: str | None,\n    role: str | None = None,\n    function: str | None = None,\n    *,\n    official_order: str | None = None,\n    reason: str = "OFFICIAL_SCHEMA_NOT_PINNED",\n) -> SchemaDefinition:\n    return SchemaDefinition(identity, family, type_code, role, function, official_order, None, None, None, None, None, None, None, None, None, None, False, True, reason)\n',
          )

          p = Path(path)
          s = p.read_text(encoding="utf-8")
          replacements = {
              '_schema("UPD_970_520_SELLER", "UPD", "520", "SELLER", "ДОП")': '_schema("UPD_970_520_SELLER", "UPD", "520", "SELLER", "ДОП", official_order="ЕД-7-26/970@")',
              '_schema("UPD_970_521_BUYER", "UPD", "521", "BUYER", "ДОП")': '_schema("UPD_970_521_BUYER", "UPD", "521", "BUYER", "ДОП", official_order="ЕД-7-26/970@")',
              '_schema("UPD_970_522_SELLER", "UPD", "522", "SELLER", "СЧФ")': '_schema("UPD_970_522_SELLER", "UPD", "522", "SELLER", "СЧФ", official_order="ЕД-7-26/970@")',
              '_schema("UPD_970_524_SELLER", "UPD", "524", "SELLER", "СЧФДОП")': '_schema("UPD_970_524_SELLER", "UPD", "524", "SELLER", "СЧФДОП", official_order="ЕД-7-26/970@")',
              '_schema("UPD_970_525_BUYER", "UPD", "525", "BUYER", "СЧФДОП")': '_schema("UPD_970_525_BUYER", "UPD", "525", "BUYER", "СЧФДОП", official_order="ЕД-7-26/970@")',
              '_schema("UPDI_970_820_SELLER", "UPDI", "820", "SELLER", "ДОП")': '_schema("UPDI_970_820_SELLER", "UPDI", "820", "SELLER", "ДОП", official_order="ЕД-7-26/970@")',
              '_schema("UPDI_970_821_BUYER", "UPDI", "821", "BUYER", "ДОП")': '_schema("UPDI_970_821_BUYER", "UPDI", "821", "BUYER", "ДОП", official_order="ЕД-7-26/970@")',
              '_schema("UPDI_970_822_SELLER", "UPDI", "822", "SELLER", "СЧФ")': '_schema("UPDI_970_822_SELLER", "UPDI", "822", "SELLER", "СЧФ", official_order="ЕД-7-26/970@")',
              '_schema("UPDI_970_824_SELLER", "UPDI", "824", "SELLER", "СЧФДОП")': '_schema("UPDI_970_824_SELLER", "UPDI", "824", "SELLER", "СЧФДОП", official_order="ЕД-7-26/970@")',
              '_schema("UPDI_970_825_BUYER", "UPDI", "825", "BUYER", "СЧФДОП")': '_schema("UPDI_970_825_BUYER", "UPDI", "825", "BUYER", "СЧФДОП", official_order="ЕД-7-26/970@")',
              '_schema("UKD_736_600_SELLER", "UKD", "600", "SELLER", "ДИС", reason="TRUE_API_FNS_FORMAT_CONFLICT")': '_schema("UKD_736_600_SELLER", "UKD", "600", "SELLER", "ДИС", official_order="ЕД-7-26/736@", reason="TRUE_API_FNS_FORMAT_CONFLICT")',
              '_schema("UKD_736_601_BUYER", "UKD", "601", "BUYER", "ДИС", reason="TRUE_API_FNS_FORMAT_CONFLICT")': '_schema("UKD_736_601_BUYER", "UKD", "601", "BUYER", "ДИС", official_order="ЕД-7-26/736@", reason="TRUE_API_FNS_FORMAT_CONFLICT")',
              '_schema("UKD_736_602_SELLER", "UKD", "602", "SELLER", "КСЧФ", reason="TRUE_API_FNS_FORMAT_CONFLICT")': '_schema("UKD_736_602_SELLER", "UKD", "602", "SELLER", "КСЧФ", official_order="ЕД-7-26/736@", reason="TRUE_API_FNS_FORMAT_CONFLICT")',
              '_schema("UKD_736_604_SELLER", "UKD", "604", "SELLER", "КСФДИС", reason="TRUE_API_FNS_FORMAT_CONFLICT")': '_schema("UKD_736_604_SELLER", "UKD", "604", "SELLER", "КСФДИС", official_order="ЕД-7-26/736@", reason="TRUE_API_FNS_FORMAT_CONFLICT")',
              '_schema("UKD_736_605_BUYER", "UKD", "605", "BUYER", "КСФДИС", reason="TRUE_API_FNS_FORMAT_CONFLICT")': '_schema("UKD_736_605_BUYER", "UKD", "605", "BUYER", "КСФДИС", official_order="ЕД-7-26/736@", reason="TRUE_API_FNS_FORMAT_CONFLICT")',
              '_schema("UKDI_736_700_SELLER", "UKDI", "700", "SELLER", "ДИС", reason="TRUE_API_FNS_FORMAT_CONFLICT")': '_schema("UKDI_736_700_SELLER", "UKDI", "700", "SELLER", "ДИС", official_order="ЕД-7-26/736@", reason="TRUE_API_FNS_FORMAT_CONFLICT")',
              '_schema("UKDI_736_701_BUYER", "UKDI", "701", "BUYER", "ДИС", reason="TRUE_API_FNS_FORMAT_CONFLICT")': '_schema("UKDI_736_701_BUYER", "UKDI", "701", "BUYER", "ДИС", official_order="ЕД-7-26/736@", reason="TRUE_API_FNS_FORMAT_CONFLICT")',
              '_schema("UKDI_736_702_SELLER", "UKDI", "702", "SELLER", "КСЧФ", reason="TRUE_API_FNS_FORMAT_CONFLICT")': '_schema("UKDI_736_702_SELLER", "UKDI", "702", "SELLER", "КСЧФ", official_order="ЕД-7-26/736@", reason="TRUE_API_FNS_FORMAT_CONFLICT")',
              '_schema("UKDI_736_704_SELLER", "UKDI", "704", "SELLER", "КСФДИС", reason="TRUE_API_FNS_FORMAT_CONFLICT")': '_schema("UKDI_736_704_SELLER", "UKDI", "704", "SELLER", "КСФДИС", official_order="ЕД-7-26/736@", reason="TRUE_API_FNS_FORMAT_CONFLICT")',
              '_schema("UKDI_736_705_BUYER", "UKDI", "705", "BUYER", "КСФДИС", reason="TRUE_API_FNS_FORMAT_CONFLICT")': '_schema("UKDI_736_705_BUYER", "UKDI", "705", "BUYER", "КСФДИС", official_order="ЕД-7-26/736@", reason="TRUE_API_FNS_FORMAT_CONFLICT")',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f"schema row anchor mismatch: {old}")
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          test_path = "tests/test_m7_edo_lite_foundation.py"
          replace_once(
              test_path,
              '    assert all(x.disabled_reason == "TRUE_API_FNS_FORMAT_CONFLICT" for x in rows if x.family in {"UKD","UKDI"})\n    assert all(x.disabled_reason == "OFFICIAL_SCHEMA_NOT_PINNED" for x in rows if x.family in {"UPD","UPDI"})\n',
              '    assert all(x.disabled_reason == "TRUE_API_FNS_FORMAT_CONFLICT" for x in rows if x.family in {"UKD","UKDI"})\n    assert all(x.disabled_reason == "OFFICIAL_SCHEMA_NOT_PINNED" for x in rows if x.family in {"UPD","UPDI"})\n    assert all(x.official_order == "ЕД-7-26/970@" for x in rows if x.family in {"UPD","UPDI"})\n    assert all(x.official_order == "ЕД-7-26/736@" for x in rows if x.family in {"UKD","UKDI"})\n    assert all(x.official_order is None for x in PRODUCTION_SCHEMA_REGISTRY.values() if x.family == "SERVICE")\n',
          )

          docs = "docs/M7_EDO_LITE_FOUNDATION_CONTRACT.md"
          replace_once(
              docs,
              'Registry rows describe family/type/title/function metadata only where known. All production entries have `enabled_for_lp=false`. Missing official order, artifact/XSD filename, checksum, root, target namespace, encoding, filename grammar, parent-link rule and marking capability remain explicit NULL/unknown values; no `latest` alias or fake schema metadata exists.\n',
              'Registry rows describe family/type/title/function metadata only where known and store the True-API-declared format order where source-confirmed. UPD/UPDi rows carry `ЕД-7-26/970@`; UKD/UKDi rows carry the current True API endpoint-contract order `ЕД-7-26/736@`. Recording `736@` identifies the True API contract only and does not resolve or override the current FNS repeal/replacement conflict with `ЕД-1-26/29@`; UKD/UKDi writers remain disabled. Service rows keep `official_order=NULL` where accepted research has not established a finalized exact order identity. All production entries have `enabled_for_lp=false`. Missing artifact/XSD filename, checksum, root, target namespace, encoding, filename grammar, parent-link rule and marking capability remain explicit NULL/unknown values; no `latest` alias or fake schema metadata exists.\n',
          )
          PY
          python -m compileall -q src/wbcz/edo_lite.py tests/test_m7_edo_lite_foundation.py
          git diff --check
      - name: Run focused tests
        run: |
          python -m pip install -e ".[ui,test,web]"
          python -m pytest -q tests/test_m7_edo_lite_foundation.py tests/test_windows_agent.py
      - name: Commit micro fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/wbcz/edo_lite.py tests/test_m7_edo_lite_foundation.py docs/M7_EDO_LITE_FOUNDATION_CONTRACT.md
          git diff --cached --check
          git commit -m 'fix: retain M7 official format orders'
          git push origin HEAD:m7/edo-lite-foundation-001
