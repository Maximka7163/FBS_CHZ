name: Local FBS foundation validation

on:
  push:
    branches: [local/fbs-only]
  pull_request:
    paths:
      - "src/wbcz_local/**"
      - "Setup-Local.ps1"
      - "Start-Sellari.ps1"
      - "Stop-Sellari.ps1"
      - "Check-Local.ps1"
      - "scripts/local/**"
      - ".env.local.example"
      - "LOCAL_README.md"
      - "frontend/src/main.ts"
      - "frontend/tsconfig.json"
      - "pyproject.toml"
      - "tests/test_local_fbs_foundation.py"
      - "tests/test_local_true_api_read.py"
      - ".github/workflows/local-fbs-foundation-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sellari_local_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sellari_local_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      WBCZ_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/sellari_local_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install focused backend dependencies
        run: python -m pip install -e ".[web,test]"

      - name: Local foundation tests
        run: >-
          python -m pytest -q
          tests/test_local_fbs_foundation.py
          tests/test_local_true_api_read.py
          tests/test_fbs_control_policy.py
          tests/test_control.py

      - name: Local FBS frontend build
        working-directory: frontend
        env:
          VITE_SELLARI_LOCAL_FBS_ONLY: "true"
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build

  powershell-syntax:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Parse local PowerShell scripts
        shell: pwsh
        run: |
          $files = @(
            "Setup-Local.ps1",
            "Start-Sellari.ps1",
            "Stop-Sellari.ps1",
            "Check-Local.ps1",
            "scripts/local/Common-Local.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List | Out-String | Write-Error
              throw "PowerShell parse failed: $file"
            }
          }
