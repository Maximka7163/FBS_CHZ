name: Printing local backend foundation validation

on:
  push:
    branches: [printing/local-backend-foundation-001]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PRINTING_BASE_SHA: "c2f0ab43aaa8b43a0358dfab3440e71ad397eadf"
  PRINTING_MIGRATION: "0017_printing_local_foundation"
  WBCZ_AUDIT_PSEUDONYM_KEY: "printing-ci-only-audit-pseudonym-key-0000000000000001"
  WBCZ_AUDIT_PSEUDONYM_KEY_ID: "printing-ci-v1"

jobs:
  focused-renderer-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify branch ancestry and migration history
        run: |
          git merge-base --is-ancestor "$PRINTING_BASE_SHA" HEAD
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          unexpected="$(git diff --name-only "$PRINTING_BASE_SHA" HEAD -- migrations/versions | grep -v '^migrations/versions/0017_printing_local_foundation.py$' || true)"
          test -z "$unexpected" || { echo "historical migrations changed: $unexpected"; exit 1; }
      - name: Install independent DataMatrix decoder runtime
        run: |
          sudo apt-get update
          if apt-cache show libdmtx0b >/dev/null 2>&1; then
            sudo apt-get install -y libdmtx0b
          else
            sudo apt-get install -y libdmtx0a
          fi
      - name: Install locked runtime and fixed test tools
        run: |
          python -m pip install -r requirements.production.lock
          python -m pip install --no-deps -e .
          python -m pip install "pytest==9.1.1" "httpx==0.28.1" "pylibdmtx==0.1.10" "Pillow==11.3.0" "numpy==2.3.3"
      - name: Dependency lock contract
        run: python scripts/m15_verify_dependency_lock.py
      - name: Compile printing and web modules
        run: python -m compileall -q src scripts tests
      - name: Focused closed-schema renderer and agent-contract tests
        run: python -m pytest -q tests/test_printing_foundation.py
      - name: Repository secret scan
        run: python scripts/m15_secret_scan.py
      - name: Production dependency vulnerability audit
        run: |
          python -m pip install "pip-audit==2.10.1"
          pip-audit -r requirements.production.lock --strict
      - name: Fail-closed production printing contract
        run: |
          grep -F 'WBCZ_PRINTING_ENABLED: "false"' docker-compose.prod.yml
          grep -F 'WBCZ_PRINT_EXECUTION_ENABLED: "false"' docker-compose.prod.yml
          grep -F 'WBCZ_SUZ_FULL_KM_REMOTE_ACQUISITION_ENABLED: "false"' docker-compose.prod.yml
          grep -F 'WBCZ_TRUE_API_WRITE_ENABLED: "false"' docker-compose.prod.yml
          grep -F 'WBCZ_AGENT_LEGACY_BOOTSTRAP_ENABLED: "false"' docker-compose.prod.yml
          test -f docs/PRINTING_LOCAL_BACKEND_FOUNDATION.md

  postgres-migration-and-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wbcz_printing
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d wbcz_printing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WBCZ_ENV: test
      WBCZ_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_printing
      WBCZ_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_printing
      WBCZ_OWN_INN: "1234567890"
      WBCZ_COOKIE_SECURE: "false"
      WBCZ_BUILD_SHA: ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install independent DataMatrix decoder runtime
        run: |
          sudo apt-get update
          if apt-cache show libdmtx0b >/dev/null 2>&1; then
            sudo apt-get install -y libdmtx0b
          else
            sudo apt-get install -y libdmtx0a
          fi
      - name: Install locked runtime and fixed test tools
        run: |
          python -m pip install -r requirements.production.lock
          python -m pip install --no-deps -e .
          python -m pip install "pytest==9.1.1" "httpx==0.28.1" "pylibdmtx==0.1.10" "Pillow==11.3.0" "numpy==2.3.3"
      - name: Exact migration head
        run: test "$(alembic heads | awk '{print $1}')" = "$PRINTING_MIGRATION"
      - name: Fresh database to 0017
        run: |
          alembic upgrade "$PRINTING_MIGRATION"
          test "$(alembic current | awk '{print $1}')" = "$PRINTING_MIGRATION"
      - name: Focused printing PostgreSQL tests on fresh migration
        run: python -m pytest -q tests/test_printing_postgres.py
      - name: Validate accepted 0016 to 0017 upgrade in independent database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE wbcz_printing_upgrade'
          UPGRADE_URL='postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_printing_upgrade'
          WBCZ_DATABASE_URL="$UPGRADE_URL" alembic upgrade 0016_m15_production_hardening
          test "$(WBCZ_DATABASE_URL="$UPGRADE_URL" alembic current | awk '{print $1}')" = "0016_m15_production_hardening"
          WBCZ_DATABASE_URL="$UPGRADE_URL" alembic upgrade "$PRINTING_MIGRATION"
          test "$(WBCZ_DATABASE_URL="$UPGRADE_URL" alembic current | awk '{print $1}')" = "$PRINTING_MIGRATION"
      - name: Full backend regression
        run: python -m pytest -q tests

  windows-agent-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked runtime and test tools
        run: |
          python -m pip install -r requirements.production.lock
          python -m pip install --no-deps -e .
          python -m pip install "pytest==9.1.1" "httpx==0.28.1"
      - name: Existing Windows-agent regressions
        run: python -m pytest -q tests/test_windows_agent.py tests/test_agent_protocol_runtime.py
      - name: Fake print executor contract remains local and blocked
        run: |
          python - <<'PY'
          from wbcz.printing_agent import FakePrintExecutor
          value = {
              "contract_version":"printing-agent-v1",
              "job_id":"job-ci",
              "organisation_id":"org-ci",
              "participant_id":"part-ci",
              "template_version_id":"template-ci",
              "mode":"INITIAL_PRINT",
              "printer_profile_id":None,
              "printer_profile_fingerprint":None,
              "items":[{"print_job_item_id":"item-ci","stored_full_km_item_id":"stored-ci","ordinal":0,"payload_sha256":"a"*64}],
              "sensitive_payload_delivery":"BLOCKED_NOT_IMPLEMENTED",
          }
          result = FakePrintExecutor().execute(value)
          assert result.outcome == "BLOCKED"
          assert result.physical_printer_called is False
          assert result.sensitive_payload_received is False
          PY
