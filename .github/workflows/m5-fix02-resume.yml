name: M5 fix02 resume

on:
  push:
    branches:
      - m5/turnover-operations-001

permissions:
  contents: write

jobs:
  resume:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5/turnover-operations-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[test]"
      - name: Reuse staged authoritative patch
        shell: bash
        run: |
          set -euo pipefail
          awk '/python - <<'"'"'PY'"'"'/{flag=1;next} /^          PY$/{flag=0;exit} flag{sub(/^          /,""); print}' .github/workflows/m5-fix02-patch.yml > /tmp/m5_fix02.py
          test -s /tmp/m5_fix02.py
          python /tmp/m5_fix02.py
          git diff --check
          python -m compileall -q src tests/test_m5_turnover.py
          python -m pytest -q tests/test_m5_turnover.py
      - name: Commit authoritative LP_RETURN contract fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/wbcz/turnover.py tests/test_m5_turnover.py docs/M5_TURNOVER_CONTRACT.md
          git diff --cached --check
          git commit -m 'fix: enforce authoritative LP_RETURN wire contract'
          git push origin HEAD:m5/turnover-operations-001
