name: M4 architect review fix retry

on:
  push:
    branches:
      - m4/document-lifecycle-001

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4/document-lifecycle-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reuse verified architect patch logic
        shell: bash
        run: |
          set -euo pipefail
          sed -n "/python - <<'PY'/,/^          PY$/p" .github/workflows/m4-architect-fix.yml | sed '1d;$d;s/^          //' > /tmp/m4_architect_fix.py
          python /tmp/m4_architect_fix.py
          git checkout -- .github/workflows/m4-document-lifecycle-validation.yml
          python -m compileall -q src tests
      - name: Commit source fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests docs
          git diff --cached --check
          git commit -m 'fix: align M4 with architect resolution'
          git push origin HEAD:m4/document-lifecycle-001
