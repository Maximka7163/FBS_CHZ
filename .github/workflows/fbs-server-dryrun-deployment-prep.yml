name: FBS server dry-run deployment prep

on:
  push:
    branches: [fix/fbs-worker-healthcheck-001]
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_MIGRATION_REVISION: 0020_printing_physical_spool
  WBCZ_ENV: test
  WBCZ_OWN_INN: "1234567890"
  WBCZ_AUDIT_PSEUDONYM_KEY: "focused-ci-test-only-pseudonym-key-20260924"
  WBCZ_AUDIT_PSEUDONYM_KEY_ID: "focused-ci-v1"
  WBCZ_TRUE_API_WRITE_ENABLED: "false"
  WBCZ_FBS_DRY_RUN_ONLY: "true"
  WBCZ_AGENT_ENABLED: "true"
  WBCZ_AGENT_LEGACY_BOOTSTRAP_ENABLED: "false"
  WBCZ_PRINTING_ENABLED: "false"
  WBCZ_PRINT_EXECUTION_ENABLED: "false"
  WBCZ_SUZ_FULL_KM_REMOTE_ACQUISITION_ENABLED: "false"

jobs:
  deployment-prep:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wbcz_fbs_dryrun
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d wbcz_fbs_dryrun"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WBCZ_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_fbs_dryrun
      WBCZ_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_fbs_dryrun
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prove exact source and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "${{ github.ref_name }}" = "fix/fbs-worker-healthcheck-001"

      - name: Install locked runtime and focused test tools
        run: |
          python -m pip install -r requirements.production.lock
          python -m pip install --no-deps -e .
          python -m pip install "pytest==9.1.1" "httpx==0.28.1"

      - name: Focused deployment-prep tests
        run: python -m pytest -q tests/test_fbs_worker_healthcheck.py tests/test_fbs_dryrun_deployment_prep.py tests/test_p0_chz_connection_e2e.py tests/test_m1_cis_inventory.py tests/test_control.py tests/test_wb_regression.py tests/test_m14_integration_settings.py tests/test_m15_postgres_runtime.py tests/test_windows_agent.py

      - name: Production dependency and secret contracts
        run: |
          python scripts/m15_verify_dependency_lock.py
          python scripts/m15_secret_scan.py

      - name: Build accepted frontend outside verified source tree
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build
          if grep -R -E 'https?://(localhost|127\.0\.0\.1)' dist; then
            echo "localhost URL found in production frontend bundle" >&2
            exit 1
          fi
          rm -rf "$RUNNER_TEMP/fbs-frontend-dist"
          cp -a dist "$RUNNER_TEMP/fbs-frontend-dist"
          rm -rf dist
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Build deterministic FBS dry-run bundle twice
        shell: bash
        run: |
          set -euo pipefail
          TS="$(git show -s --format=%cI HEAD)"
          for NAME in build-a build-b; do
            OUT="$RUNNER_TEMP/$NAME"
            python scripts/build_fbs_dryrun_runtime_bundle.py \
              --source-root . \
              --frontend-dist "$RUNNER_TEMP/fbs-frontend-dist" \
              --output-dir "$OUT" \
              --source-sha "${{ github.sha }}" \
              --source-branch fix/fbs-worker-healthcheck-001 \
              --build-timestamp-utc "$TS" \
              --builder-sha "${{ github.sha }}"
          done
          ARCHIVE="sellari-marking-fbs-dryrun-0.5.1-${GITHUB_SHA:0:12}.tar.gz"
          cmp "$RUNNER_TEMP/build-a/$ARCHIVE" "$RUNNER_TEMP/build-b/$ARCHIVE"
          cmp "$RUNNER_TEMP/build-a/$ARCHIVE.sha256" "$RUNNER_TEMP/build-b/$ARCHIVE.sha256"
          (cd "$RUNNER_TEMP/build-a" && sha256sum -c "$ARCHIVE.sha256")
          mkdir "$RUNNER_TEMP/extracted"
          tar -xzf "$RUNNER_TEMP/build-a/$ARCHIVE" -C "$RUNNER_TEMP/extracted"
          ROOT="$RUNNER_TEMP/extracted/sellari-marking-fbs-dryrun-0.5.1-${GITHUB_SHA:0:12}"
          (cd "$ROOT" && sha256sum -c SHA256SUMS)
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"]) / "extracted" / f"sellari-marking-fbs-dryrun-0.5.1-{os.environ['GITHUB_SHA'][:12]}"
          data=json.loads((root/"RELEASE.json").read_text())
          assert data["source_git_sha"] == os.environ["GITHUB_SHA"]
          assert data["source_branch"] == "fix/fbs-worker-healthcheck-001"
          assert data["alembic_head"] == "0020_printing_physical_spool"
          assert data["fbs_dry_run_only"] is True
          assert data["agent_enabled"] is True
          assert data["legacy_global_agent_bootstrap"] is False
          assert data["true_api_write_enabled"] is False
          assert data["printing_enabled"] is False
          assert data["print_execution_enabled"] is False
          assert data["suz_full_km_remote_acquisition_enabled"] is False
          PY
          python "$ROOT/scripts/m15_release_safety.py" "$ROOT/RELEASE.json"
          test ! -e "$ROOT/src/wbcz_ui"
          echo "NEW_ARCHIVE_NAME=$ARCHIVE"
          echo "NEW_ARCHIVE_SHA256=$(cut -d' ' -f1 "$RUNNER_TEMP/build-a/$ARCHIVE.sha256")"
          echo "DETERMINISTIC_BUILD=PASS"
          echo "INTERNAL_SHA256SUMS=PASS"
          echo "RELEASE_SAFETY=PASS"

      - name: Packaged imports and artifact-only PostgreSQL migrations
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/extracted/sellari-marking-fbs-dryrun-0.5.1-${GITHUB_SHA:0:12}"
          test ! -e "$ROOT/src/wbcz_ui"

          VENV="$RUNNER_TEMP/fbs-artifact-venv"
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install --disable-pip-version-check -r "$ROOT/requirements.production.lock"
          "$VENV/bin/python" -m pip install --disable-pip-version-check --no-deps "$ROOT"

          (
            cd "$RUNNER_TEMP"
            unset PYTHONPATH
            ARTIFACT_ROOT="$ROOT" "$VENV/bin/python" -I - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          assert importlib.util.find_spec("wbcz_ui") is None
          import wbcz
          import wbcz.windows_agent
          import wbcz_web
          import wbcz_web.main
          import wbcz_web.worker

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          for module in (wbcz, wbcz_web):
              module_path = Path(module.__file__).resolve()
              assert workspace not in module_path.parents, (module.__name__, module_path)
          print("PACKAGED_WEB_IMPORT=PASS")
          print("PACKAGED_WORKER_IMPORT=PASS")
          print("WBCZ_UI_RUNTIME_REQUIRED_BY_SERVER=NO")
          PY
          )

          export WBCZ_ENV=production
          export WBCZ_MIGRATION_DATABASE_URL="$WBCZ_TEST_DATABASE_URL"
          export WBCZ_DATABASE_URL="$WBCZ_TEST_DATABASE_URL"
          export WBCZ_FBS_DRY_RUN_ONLY=true
          export WBCZ_TRUE_API_WRITE_ENABLED=false
          export WBCZ_PRINTING_ENABLED=false
          export WBCZ_PRINT_EXECUTION_ENABLED=false
          export WBCZ_SUZ_FULL_KM_REMOTE_ACQUISITION_ENABLED=false
          export WBCZ_AGENT_ENABLED=false
          export WBCZ_AGENT_LEGACY_BOOTSTRAP_ENABLED=false
          unset PYTHONPATH

          reset_db() {
            "$VENV/bin/python" - <<'PY'
          import os
          from sqlalchemy import create_engine
          engine = create_engine(os.environ["WBCZ_TEST_DATABASE_URL"], future=True)
          try:
              with engine.begin() as connection:
                  connection.exec_driver_sql("DROP SCHEMA public CASCADE")
                  connection.exec_driver_sql("CREATE SCHEMA public")
          finally:
              engine.dispose()
          PY
          }

          revision() {
            "$VENV/bin/python" - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["WBCZ_TEST_DATABASE_URL"], future=True)
          try:
              with engine.connect() as connection:
                  value = connection.execute(text("SELECT version_num FROM alembic_version")).scalar_one()
                  print(value)
          finally:
              engine.dispose()
          PY
          }

          reset_db
          (cd "$ROOT" && "$VENV/bin/python" -m alembic -c alembic.ini upgrade 0020_printing_physical_spool)
          test "$(revision)" = "0020_printing_physical_spool"
          echo "ARTIFACT_FRESH_DB_TO_0020=PASS"
          echo "PACKAGED_ALEMBIC_IMPORT=PASS"

          reset_db
          (cd "$ROOT" && "$VENV/bin/python" -m alembic -c alembic.ini upgrade 0016_m15_production_hardening)
          test "$(revision)" = "0016_m15_production_hardening"
          (cd "$ROOT" && "$VENV/bin/python" -m alembic -c alembic.ini upgrade 0020_printing_physical_spool)
          test "$(revision)" = "0020_printing_physical_spool"
          echo "ARTIFACT_0016_TO_0020=PASS"

      - name: Docker build smoke from extracted artifact only
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/extracted/sellari-marking-fbs-dryrun-0.5.1-${GITHUB_SHA:0:12}"
          docker build \
            -f "$ROOT/Dockerfile.backend" \
            --build-arg APP_VERSION=0.5.1 \
            --build-arg BUILD_SHA="$GITHUB_SHA" \
            -t "wbcz-fbs-artifact-smoke:${GITHUB_SHA:0:12}" \
            "$ROOT"
          echo "DOCKER_ARTIFACT_BUILD=PASS"

      - name: Validate packaged compose contract
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/extracted/sellari-marking-fbs-dryrun-0.5.1-${GITHUB_SHA:0:12}"
          grep -F 'command: ["alembic", "upgrade", "0020_printing_physical_spool"]' "$ROOT/docker-compose.prod.yml"
          grep -F 'WBCZ_FBS_DRY_RUN_ONLY: "true"' "$ROOT/docker-compose.prod.yml"
          grep -F 'WBCZ_AGENT_ENABLED: "true"' "$ROOT/docker-compose.prod.yml"
          grep -F 'WBCZ_AGENT_LEGACY_BOOTSTRAP_ENABLED: "false"' "$ROOT/docker-compose.prod.yml"
          grep -F 'WBCZ_TRUE_API_WRITE_ENABLED: "false"' "$ROOT/docker-compose.prod.yml"
          grep -F 'WBCZ_PRINTING_ENABLED: "false"' "$ROOT/docker-compose.prod.yml"
          grep -F 'WBCZ_PRINT_EXECUTION_ENABLED: "false"' "$ROOT/docker-compose.prod.yml"
          grep -F 'WBCZ_SUZ_FULL_KM_REMOTE_ACQUISITION_ENABLED: "false"' "$ROOT/docker-compose.prod.yml"

      - name: Upload validated FBS dry-run release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sellari-marking-fbs-dryrun-0.5.1-${{ github.sha }}
          path: |
            ${{ runner.temp }}/build-a/sellari-marking-fbs-dryrun-0.5.1-*.tar.gz
            ${{ runner.temp }}/build-a/sellari-marking-fbs-dryrun-0.5.1-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
