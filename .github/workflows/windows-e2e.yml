name: Final v0.4 acceptance validation

on:
  push:
    branches:
      - ci/windows-e2e-temp
    paths:
      - e2e_private/READY

jobs:
  validate-final-head:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      FINAL_SHA: 9f60cb6ca0d52521bc1f4dc7d837e7d6c65eb188
    steps:
      - name: Checkout validation carrier
        uses: actions/checkout@v4

      - name: Reconstruct regression workbook outside worktree
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "REF_WB_archive_9.xlsx"
          $parts = Get-ChildItem "e2e_private\chunk*" | Sort-Object Name
          if ($parts.Count -ne 11) { throw "Expected 11 workbook chunks, got $($parts.Count)" }
          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [System.IO.File]::WriteAllBytes($target, [Convert]::FromBase64String($base64))
          $sha = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "WBCZ_REF_XLSX=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "WORKBOOK_SHA256=$sha"
          Write-Host "WORKBOOK_BYTES=$((Get-Item $target).Length)"

      - name: Checkout exact final HEAD
        uses: actions/checkout@v4
        with:
          ref: 9f60cb6ca0d52521bc1f4dc7d837e7d6c65eb188
          clean: true

      - name: Prove exact checkout and clean tree
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          Write-Host "HEAD=$head"
          if ($head -ne $env:FINAL_SHA) { throw "Wrong HEAD: $head" }
          $dirty = git status --porcelain
          Write-Host "GIT_STATUS_BEFORE=[$dirty]"
          if ($dirty) { throw "Worktree is not clean before validation" }

      - name: GOST fallback search
        shell: pwsh
        run: |
          $bad = git grep -n -F 'if "GOST" in' -- . 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host $bad; throw "Broad GOST success fallback remains" }
          if ($LASTEXITCODE -ne 1) { throw "git grep failed" }
          Write-Host "BROAD_GOST_FALLBACK=NONE"
          Write-Host "--- _gost_session_seen ---"
          git grep -n '_gost_session_seen' -- .
          Write-Host "--- GOST2012 ---"
          git grep -n 'GOST2012' -- .
          Write-Host "--- C100/C101/C102 ---"
          git grep -n -E 'C100|C101|C102|c100|c101|c102' -- .

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ui,test]"

      - name: Pytest exact final HEAD
        shell: pwsh
        run: python -m pytest -q

      - name: npm install
        working-directory: frontend
        shell: pwsh
        run: npm install --no-audit --no-fund --no-package-lock

      - name: TypeScript tsc --noEmit
        working-directory: frontend
        shell: pwsh
        run: npm run typecheck

      - name: Vite production build
        working-directory: frontend
        shell: pwsh
        run: npm run build

      - name: Final safety boundary check
        shell: pwsh
        run: |
          @'
          from wbcz_ui.live_true_api import ReadOnlyTrueApiTransport, ProductionMutationDisabled, WindowsCryptoProAuthSigner
          ReadOnlyTrueApiTransport.assert_allowed("GET", "/auth/key")
          ReadOnlyTrueApiTransport.assert_allowed("POST", "/auth/simpleSignIn")
          ReadOnlyTrueApiTransport.assert_allowed("POST", "/cises/info", {"pg": "lp"})
          for method, path, params in [
              ("POST", "/lk/documents/create", None),
              ("POST", "/documents/LK_RECEIPT", None),
              ("POST", "/documents/LP_RETURN", None),
              ("POST", "/lk/documents/cancel", None),
              ("POST", "/lk/documents/retry", None),
          ]:
              try:
                  ReadOnlyTrueApiTransport.assert_allowed(method, path, params)
              except ProductionMutationDisabled:
                  pass
              else:
                  raise AssertionError(f"Mutation route unexpectedly allowed: {method} {path}")
          signer = WindowsCryptoProAuthSigner("AA11")
          for name in ("sign_document", "sign_payload_for_submission", "submit_signed_document", "submit", "sign"):
              assert not hasattr(signer, name), name
          print("ALLOWLIST_EXACT=YES")
          print("DOCUMENT_SIGNING_PATH=ABSENT")
          print("SUBMISSION_PATH=ABSENT")
          '@ | python -

      - name: Final git status
        shell: pwsh
        run: |
          $dirty = git status --porcelain
          Write-Host "GIT_STATUS_FINAL=[$dirty]"
          if ($dirty) { throw "Worktree is not clean after validation" }
