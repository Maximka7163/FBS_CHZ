name: Final v0.4 acceptance validation

on:
  push:
    branches:
      - ci/windows-e2e-temp
    paths:
      - e2e_private/READY

jobs:
  validate-final-head:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      FINAL_SHA: faa6af1c93fab1f77b2c18eab196fe4b2243025e
    steps:
      - name: Checkout exact final HEAD
        uses: actions/checkout@v4
        with:
          ref: faa6af1c93fab1f77b2c18eab196fe4b2243025e
          clean: true

      - name: Prove exact checkout and clean tree
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          Write-Host "HEAD=$head"
          if ($head -ne $env:FINAL_SHA) { throw "Wrong HEAD: $head" }
          $dirty = git status --porcelain
          Write-Host "GIT_STATUS_BEFORE=[$dirty]"
          if ($dirty) { throw "Worktree is not clean before validation" }

      - name: GOST fallback search
        shell: pwsh
        run: |
          $bad = git grep -n -F 'if "GOST" in' -- . 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host $bad; throw "Broad GOST success fallback remains" }
          if ($LASTEXITCODE -ne 1) { throw "git grep failed" }
          Write-Host "BROAD_GOST_FALLBACK=NONE"
          Write-Host "--- _gost_session_seen ---"
          git grep -n '_gost_session_seen' -- .
          Write-Host "--- GOST2012 ---"
          git grep -n 'GOST2012' -- .
          Write-Host "--- C100/C101/C102 ---"
          git grep -n -E 'C100|C101|C102|c100|c101|c102' -- .

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ui,test]"

      - name: Build deterministic regression workbook for full suite
        shell: pwsh
        run: |
          @'
          from openpyxl import Workbook
          import os
          from pathlib import Path

          target = Path(os.environ["RUNNER_TEMP"]) / "REF_WB_archive_9.xlsx"
          headers = [
              "№ задания", "Стикер", "КИЗ", "Номер чека", "Стоимость",
              "Валюта", "Номер фискального накопителя", "Дата",
              "Тип операции", "Признак продажи юрлицу",
          ]
          wb = Workbook()
          ws = wb.active
          ws.title = "КИЗ"
          ws.append(headers)
          row_no = 0

          def add(operation, dated):
              global row_no
              row_no += 1
              kiz = f"CI-KIZ-{row_no:04d}"
              receipt = f"CHK-{row_no:04d}" if dated else None
              fn = f"FN-{row_no:04d}" if dated else None
              dt = f"12:34:56 {((row_no - 1) % 28) + 1:02d}.08.2026" if dated else None
              ws.append([
                  f"TASK-{row_no:04d}", f"ST-{row_no:04d}", kiz,
                  receipt, 100, "RUB", fn, dt, operation, "нет",
              ])

          # Sales: all 13 missing-receipt rows occur within the first 64 sale
          # positions; positions 14..64 are the 51 READY_TO_WITHDRAW rows.
          for _ in range(13): add("Продажа", False)
          for _ in range(51): add("Продажа", True)
          for _ in range(12): add("Продажа", True)

          # Returns: first 140 are withdrawn/distance in the deterministic fake.
          # Exactly 3 of those have evidence; the remaining two dated returns
          # are already-in-circulation positions 141..142.
          for _ in range(137): add("Возврат", False)
          for _ in range(3): add("Возврат", True)
          for _ in range(2): add("Возврат", True)
          for _ in range(20): add("Возврат", False)

          assert row_no == 238
          wb.save(target)
          print(f"WBCZ_REF_XLSX={target}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"WBCZ_REF_XLSX={target}\n")
          '@ | python -

      - name: Pytest exact final HEAD
        shell: pwsh
        run: python -m pytest -q

      - name: npm install
        working-directory: frontend
        shell: pwsh
        run: npm install --no-audit --no-fund --no-package-lock

      - name: TypeScript tsc --noEmit
        working-directory: frontend
        shell: pwsh
        run: npm run typecheck

      - name: Vite production build
        working-directory: frontend
        shell: pwsh
        run: npm run build

      - name: Final safety boundary check
        shell: pwsh
        run: |
          @'
          from wbcz.event_store import EventStore
          from wbcz_ui.live_true_api import ReadOnlyTrueApiTransport, ProductionMutationDisabled, WindowsCryptoProAuthSigner
          ReadOnlyTrueApiTransport.assert_allowed("GET", "/auth/key")
          ReadOnlyTrueApiTransport.assert_allowed("POST", "/auth/simpleSignIn")
          ReadOnlyTrueApiTransport.assert_allowed("POST", "/cises/info", {"pg": "lp"})
          for method, path, params in [
              ("POST", "/lk/documents/create", None),
              ("POST", "/documents/LK_RECEIPT", None),
              ("POST", "/documents/LP_RETURN", None),
              ("POST", "/lk/documents/cancel", None),
              ("POST", "/lk/documents/retry", None),
          ]:
              try:
                  ReadOnlyTrueApiTransport.assert_allowed(method, path, params)
              except ProductionMutationDisabled:
                  pass
              else:
                  raise AssertionError(f"Mutation route unexpectedly allowed: {method} {path}")
          signer = WindowsCryptoProAuthSigner("AA11")
          for name in ("sign_document", "sign_payload_for_submission", "submit_signed_document", "submit", "sign"):
              assert not hasattr(signer, name), name
          print("ALLOWLIST_EXACT=YES")
          print("DOCUMENT_SIGNING_PATH=ABSENT")
          print("SUBMISSION_PATH=ABSENT")
          '@ | python -

      - name: Final git status
        shell: pwsh
        run: |
          $dirty = git status --porcelain
          Write-Host "GIT_STATUS_FINAL=[$dirty]"
          if ($dirty) { throw "Worktree is not clean after validation" }
