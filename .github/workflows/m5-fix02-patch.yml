name: M5 fix02 patch

on:
  push:
    branches:
      - m5/turnover-operations-001

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5/turnover-operations-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply authoritative v726 LP_RETURN fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:120]!r}")
              p.write_text(s.replace(old, new, 1), encoding="utf-8")

          p = "src/wbcz/turnover.py"
          replace_once(
              p,
              '''_RETURN_PRIMARY_TYPES = frozenset({"RECEIPT", "SALES_RECEIPT", "OTHER"})\n''',
              '''_RETURN_PRIMARY_TYPES = frozenset({"RECEIPT", "SALES_RECEIPT", "OTHER"})\n_RETURN_PRIMARY_TYPES_BY_RETURN_TYPE: Mapping[str, frozenset[str]] = {\n    "REMOTE_SALE_RETURN": _RETURN_PRIMARY_TYPES,\n    "RETAIL_RETURN": _RETURN_PRIMARY_TYPES,\n    "NOT_FOR_SALE_RETURN": frozenset({"OTHER"}),\n    "OWN_USE_RETURN": frozenset(),\n    "STATE_CONTRACT_RETURN": frozenset(),\n}\n_STATE_CONTRACT_ID_RE = re.compile(r"^\\d{25}$")\n''',
          )

          replace_once(
              p,
              '''    def to_return_wire(self) -> dict[str, Any]:\n        return self._common(\n            kind_label="primary_document_type",\n            number_label="primary_document_number",\n            date_label="primary_document_date",\n            allowed=_RETURN_PRIMARY_TYPES,\n        )\n''',
              '''    def to_return_wire(self, *, allowed: frozenset[str] = _RETURN_PRIMARY_TYPES) -> dict[str, Any]:\n        return self._common(\n            kind_label="primary_document_type",\n            number_label="primary_document_number",\n            date_label="primary_document_date",\n            allowed=allowed,\n        )\n''',
          )

          path = Path(p)
          s = path.read_text(encoding="utf-8")
          start = s.index("@dataclass(frozen=True, slots=True)\nclass ReturnProduct:\n")
          end = s.index("\n\n@dataclass(frozen=True, slots=True)\nclass RemarkProduct:\n", start)
          replacement = '''@dataclass(frozen=True, slots=True)\nclass ReturnProduct:\n    ki: str\n    paid: bool | None = None\n    primary_document: PrimaryDocument | None = None\n    permit: PermitDocument | None = None\n\n    def to_wire(self, *, allowed_primary_types: frozenset[str]) -> dict[str, Any]:\n        result: dict[str, Any] = {"ki": _cis(self.ki, "ki")}\n        if self.paid is not None:\n            if type(self.paid) is not bool:\n                raise TurnoverContractError("products_list[].paid must be boolean")\n            result["paid"] = self.paid\n        if self.primary_document is not None:\n            result.update(self.primary_document.to_return_wire(allowed=allowed_primary_types))\n        if self.permit is not None:\n            result.update(self.permit.to_wire())\n        return result\n\n\n@dataclass(frozen=True, slots=True)\nclass LpReturnDocument:\n    trade_participant_inn: str\n    products_list: tuple[ReturnProduct, ...]\n    paid: bool | None = None\n    primary_document: PrimaryDocument | None = None\n    permit: PermitDocument | None = None\n    state_contract_id: str | None = None\n    return_type: str = "REMOTE_SALE_RETURN"\n    document_type = "LP_RETURN"\n\n    @staticmethod\n    def _validated_state_contract_id(value: str) -> str:\n        text = _nonempty(value, "state_contract_id", max_len=25)\n        if _STATE_CONTRACT_ID_RE.fullmatch(text) is None:\n            raise TurnoverContractError("state_contract_id must contain exactly 25 digits")\n        if text[12] not in {"1", "2", "3"}:\n            raise TurnoverContractError("state_contract_id 13th character must be 1, 2, or 3")\n        return text\n\n    def to_wire(self) -> dict[str, Any]:\n        return_type = self.return_type\n        if return_type in UNSUPPORTED_LP_RETURN_TYPES:\n            raise TurnoverManualReview("RETURN_TYPE_NOT_APPLICABLE_TO_LP")\n        if return_type not in KNOWN_LP_RETURN_TYPES:\n            raise TurnoverManualReview("RETURN_TYPE_MATRIX_NOT_CONFIRMED_FOR_LP")\n        if not self.products_list:\n            raise TurnoverContractError("products_list must be non-empty")\n\n        item_paid_present = any(item.paid is not None for item in self.products_list)\n        item_primary_present = any(item.primary_document is not None for item in self.products_list)\n        item_permit_present = any(item.permit is not None for item in self.products_list)\n\n        if return_type == "REMOTE_SALE_RETURN":\n            if self.paid is not None and type(self.paid) is not bool:\n                raise TurnoverContractError("paid must be boolean")\n        else:\n            if self.paid is not None or item_paid_present:\n                raise TurnoverContractError("paid must be absent unless return_type=REMOTE_SALE_RETURN")\n\n        if return_type == "STATE_CONTRACT_RETURN":\n            if self.state_contract_id is None:\n                raise TurnoverManualReview("STATE_CONTRACT_ID_REQUIRED")\n            state_contract_id = self._validated_state_contract_id(self.state_contract_id)\n        else:\n            if self.state_contract_id is not None:\n                raise TurnoverContractError("state_contract_id must be absent unless return_type=STATE_CONTRACT_RETURN")\n            state_contract_id = None\n\n        primary_forbidden = return_type in {"OWN_USE_RETURN", "STATE_CONTRACT_RETURN"}\n        if primary_forbidden and (self.primary_document is not None or item_primary_present):\n            raise TurnoverContractError(f"primary document must be absent for {return_type}")\n\n        certificate_forbidden = return_type in {"OWN_USE_RETURN", "STATE_CONTRACT_RETURN"}\n        if certificate_forbidden and (self.permit is not None or item_permit_present):\n            raise TurnoverContractError(f"certificate data must be absent for {return_type}")\n        if self.permit is not None and item_permit_present:\n            raise TurnoverContractError("certificate data must be root-level or item-level, not both")\n\n        allowed_primary_types = _RETURN_PRIMARY_TYPES_BY_RETURN_TYPE[return_type]\n        root_primary_wire: dict[str, Any] | None = None\n        if self.primary_document is not None:\n            root_primary_wire = self.primary_document.to_return_wire(allowed=allowed_primary_types)\n\n        wires: list[dict[str, Any]] = []\n        for item in self.products_list:\n            if item.paid is not None and type(item.paid) is not bool:\n                raise TurnoverContractError("products_list[].paid must be boolean")\n\n            effective_primary = item.primary_document if item.primary_document is not None else self.primary_document\n            if return_type == "REMOTE_SALE_RETURN":\n                effective_paid = item.paid if item.paid is not None else self.paid\n                if effective_paid is None:\n                    raise TurnoverManualReview("LP_RETURN_PAID_REQUIRED")\n                if effective_paid is True and effective_primary is None:\n                    raise TurnoverManualReview("LP_RETURN_PRIMARY_DOCUMENT_REQUIRED")\n                if effective_paid is False and effective_primary is not None:\n                    raise TurnoverContractError("primary document must be absent when REMOTE_SALE_RETURN effective paid=false")\n            elif return_type in {"RETAIL_RETURN", "NOT_FOR_SALE_RETURN"}:\n                if effective_primary is None:\n                    raise TurnoverManualReview("LP_RETURN_PRIMARY_DOCUMENT_REQUIRED")\n\n            wires.append(item.to_wire(allowed_primary_types=allowed_primary_types))\n\n        if len({item["ki"] for item in wires}) != len(wires):\n            raise TurnoverContractError("products_list[].ki must be unique")\n\n        result: dict[str, Any] = {\n            "trade_participant_inn": _inn(self.trade_participant_inn, "trade_participant_inn"),\n            "return_type": return_type,\n            "products_list": wires,\n        }\n        if return_type == "REMOTE_SALE_RETURN" and self.paid is not None:\n            result["paid"] = self.paid\n        if root_primary_wire is not None:\n            result.update(root_primary_wire)\n        if self.permit is not None:\n            result.update(self.permit.to_wire())\n        if state_contract_id is not None:\n            result["state_contract_id"] = state_contract_id\n        return result\n'''
          path.write_text(s[:start] + replacement + s[end:], encoding="utf-8")

          p = "tests/test_m5_turnover.py"
          replace_once(
              p,
              '''    OperationReconciliationService,\n    PrimaryDocument,\n''',
              '''    OperationReconciliationService,\n    PermitDocument,\n    PrimaryDocument,\n''',
          )

          path = Path(p)
          s = path.read_text(encoding="utf-8")
          start = s.index("def test_lp_return_paid_root_item_precedence_and_missing_effective_paid() -> None:\n")
          end = s.index("\ndef test_return_reason_matrix_contains_all_confirmed_lp_cells_and_no_inference() -> None:\n", start)
          replacement = '''def test_remote_sale_return_paid_root_item_precedence_and_missing_effective_paid() -> None:\n    with pytest.raises(TurnoverManualReview, match="PAID_REQUIRED"):\n        LpReturnDocument(\n            trade_participant_inn=INN,\n            products_list=(ReturnProduct(CIS),),\n        ).to_wire()\n\n    root_paid_false = LpReturnDocument(\n        trade_participant_inn=INN,\n        products_list=(ReturnProduct(CIS),),\n        paid=False,\n    ).to_wire()\n    assert root_paid_false["paid"] is False\n    assert "paid" not in root_paid_false["products_list"][0]\n\n    item_override = LpReturnDocument(\n        trade_participant_inn=INN,\n        paid=False,\n        products_list=(\n            ReturnProduct(\n                CIS,\n                paid=True,\n                primary_document=PrimaryDocument("RECEIPT", "I-1", TODAY),\n            ),\n        ),\n    ).to_wire()\n    assert item_override["paid"] is False\n    assert item_override["products_list"][0]["paid"] is True\n    assert item_override["products_list"][0]["primary_document_number"] == "I-1"\n\n\ndef test_remote_sale_return_primary_document_exact_paid_semantics_and_item_override() -> None:\n    with pytest.raises(TurnoverManualReview, match="PRIMARY_DOCUMENT_REQUIRED"):\n        LpReturnDocument(\n            trade_participant_inn=INN,\n            products_list=(ReturnProduct(CIS),),\n            paid=True,\n        ).to_wire()\n\n    with pytest.raises(TurnoverContractError, match="paid=false"):\n        LpReturnDocument(\n            trade_participant_inn=INN,\n            products_list=(ReturnProduct(CIS),),\n            paid=False,\n            primary_document=PrimaryDocument("RECEIPT", "R-0", TODAY),\n        ).to_wire()\n\n    with pytest.raises(TurnoverContractError, match="paid=false"):\n        LpReturnDocument(\n            trade_participant_inn=INN,\n            products_list=(ReturnProduct(CIS, paid=False, primary_document=PrimaryDocument("RECEIPT", "I-0", TODAY)),),\n            paid=True,\n            primary_document=PrimaryDocument("RECEIPT", "ROOT", TODAY),\n        ).to_wire()\n\n    wire = LpReturnDocument(\n        trade_participant_inn=INN,\n        products_list=(\n            ReturnProduct(CIS, primary_document=PrimaryDocument("SALES_RECEIPT", "ITEM", TODAY)),\n        ),\n        paid=True,\n        primary_document=PrimaryDocument("RECEIPT", "ROOT", TODAY),\n    ).to_wire()\n    assert wire["primary_document_number"] == "ROOT"\n    assert wire["products_list"][0]["primary_document_number"] == "ITEM"\n\n\ndef test_non_remote_returns_reject_paid_at_root_and_item_levels() -> None:\n    for return_type, primary, state_contract_id in (\n        ("RETAIL_RETURN", PrimaryDocument("RECEIPT", "R", TODAY), None),\n        ("NOT_FOR_SALE_RETURN", PrimaryDocument("OTHER", "N", TODAY, custom_name="Other document"), None),\n        ("OWN_USE_RETURN", None, None),\n        ("STATE_CONTRACT_RETURN", None, "1234567890121123456789012"),\n    ):\n        with pytest.raises(TurnoverContractError, match="paid must be absent"):\n            LpReturnDocument(\n                trade_participant_inn=INN,\n                products_list=(ReturnProduct(CIS),),\n                paid=False,\n                primary_document=primary,\n                state_contract_id=state_contract_id,\n                return_type=return_type,\n            ).to_wire()\n        with pytest.raises(TurnoverContractError, match="paid must be absent"):\n            LpReturnDocument(\n                trade_participant_inn=INN,\n                products_list=(ReturnProduct(CIS, paid=False),),\n                primary_document=primary,\n                state_contract_id=state_contract_id,\n                return_type=return_type,\n            ).to_wire()\n\n\ndef test_retail_return_requires_primary_and_accepts_only_source_allowed_types() -> None:\n    with pytest.raises(TurnoverManualReview, match="PRIMARY_DOCUMENT_REQUIRED"):\n        LpReturnDocument(\n            trade_participant_inn=INN,\n            products_list=(ReturnProduct(CIS),),\n            return_type="RETAIL_RETURN",\n        ).to_wire()\n\n    for primary in (\n        PrimaryDocument("RECEIPT", "R-1", TODAY),\n        PrimaryDocument("SALES_RECEIPT", "S-1", TODAY),\n        PrimaryDocument("OTHER", "O-1", TODAY, custom_name="Other retail document"),\n    ):\n        wire = LpReturnDocument(\n            trade_participant_inn=INN,\n            products_list=(ReturnProduct(CIS),),\n            primary_document=primary,\n            return_type="RETAIL_RETURN",\n        ).to_wire()\n        assert "paid" not in wire\n        assert wire["primary_document_type"] == primary.document_type\n\n    with pytest.raises(TurnoverContractError, match="primary_document_custom_name"):\n        LpReturnDocument(\n            trade_participant_inn=INN,\n            products_list=(ReturnProduct(CIS),),\n            primary_document=PrimaryDocument("RECEIPT", "R-2", TODAY, custom_name="forbidden"),\n            return_type="RETAIL_RETURN",\n        ).to_wire()\n\n\ndef test_not_for_sale_return_requires_primary_and_restricts_primary_type() -> None:\n    with pytest.raises(TurnoverManualReview, match="PRIMARY_DOCUMENT_REQUIRED"):\n        LpReturnDocument(\n            trade_participant_inn=INN,\n            products_list=(ReturnProduct(CIS),),\n            return_type="NOT_FOR_SALE_RETURN",\n        ).to_wire()\n\n    for forbidden in ("RECEIPT", "SALES_RECEIPT"):\n        with pytest.raises(TurnoverContractError, match="unsupported primary_document_type"):\n            LpReturnDocument(\n                trade_participant_inn=INN,\n                products_list=(ReturnProduct(CIS),),\n                primary_document=PrimaryDocument(forbidden, "N-1", TODAY),\n                return_type="NOT_FOR_SALE_RETURN",\n            ).to_wire()\n\n    wire = LpReturnDocument(\n        trade_participant_inn=INN,\n        products_list=(ReturnProduct(CIS),),\n        primary_document=PrimaryDocument("OTHER", "N-2", TODAY, custom_name="Donation act"),\n        return_type="NOT_FOR_SALE_RETURN",\n    ).to_wire()\n    assert wire["primary_document_type"] == "OTHER"\n    assert wire["primary_document_custom_name"] == "Donation act"\n\n\ndef test_own_use_return_forbids_primary_and_certificate_data() -> None:\n    clean = LpReturnDocument(\n        trade_participant_inn=INN,\n        products_list=(ReturnProduct(CIS),),\n        return_type="OWN_USE_RETURN",\n    ).to_wire()\n    assert clean["return_type"] == "OWN_USE_RETURN"\n    assert "paid" not in clean\n\n    with pytest.raises(TurnoverContractError, match="primary document must be absent"):\n        LpReturnDocument(\n            trade_participant_inn=INN,\n            products_list=(ReturnProduct(CIS),),\n            primary_document=PrimaryDocument("OTHER", "O", TODAY, custom_name="Other"),\n            return_type="OWN_USE_RETURN",\n        ).to_wire()\n    with pytest.raises(TurnoverContractError, match="certificate data must be absent"):\n        LpReturnDocument(\n            trade_participant_inn=INN,\n            products_list=(ReturnProduct(CIS, permit=PermitDocument("DECLARATION", "C-1", TODAY)),),\n            return_type="OWN_USE_RETURN",\n        ).to_wire()\n\n\ndef test_state_contract_return_exact_id_and_absence_rules() -> None:\n    valid_id = "1234567890121123456789012"\n    wire = LpReturnDocument(\n        trade_participant_inn=INN,\n        products_list=(ReturnProduct(CIS),),\n        state_contract_id=valid_id,\n        return_type="STATE_CONTRACT_RETURN",\n    ).to_wire()\n    assert wire["state_contract_id"] == valid_id\n\n    with pytest.raises(TurnoverManualReview, match="STATE_CONTRACT_ID_REQUIRED"):\n        LpReturnDocument(\n            trade_participant_inn=INN,\n            products_list=(ReturnProduct(CIS),),\n            return_type="STATE_CONTRACT_RETURN",\n        ).to_wire()\n    with pytest.raises(TurnoverContractError, match="25 digits"):\n        LpReturnDocument(\n            trade_participant_inn=INN,\n            products_list=(ReturnProduct(CIS),),\n            state_contract_id="123",\n            return_type="STATE_CONTRACT_RETURN",\n        ).to_wire()\n    with pytest.raises(TurnoverContractError, match="13th character"):\n        LpReturnDocument(\n            trade_participant_inn=INN,\n            products_list=(ReturnProduct(CIS),),\n            state_contract_id="1234567890124123456789012",\n            return_type="STATE_CONTRACT_RETURN",\n        ).to_wire()\n    with pytest.raises(TurnoverContractError, match="state_contract_id must be absent"):\n        LpReturnDocument(\n            trade_participant_inn=INN,\n            products_list=(ReturnProduct(CIS),),\n            paid=False,\n            state_contract_id=valid_id,\n            return_type="REMOTE_SALE_RETURN",\n        ).to_wire()\n    with pytest.raises(TurnoverContractError, match="primary document must be absent"):\n        LpReturnDocument(\n            trade_participant_inn=INN,\n            products_list=(ReturnProduct(CIS),),\n            state_contract_id=valid_id,\n            primary_document=PrimaryDocument("OTHER", "S", TODAY, custom_name="Other"),\n            return_type="STATE_CONTRACT_RETURN",\n        ).to_wire()\n    with pytest.raises(TurnoverContractError, match="certificate data must be absent"):\n        LpReturnDocument(\n            trade_participant_inn=INN,\n            products_list=(ReturnProduct(CIS),),\n            state_contract_id=valid_id,\n            permit=PermitDocument("DECLARATION", "C-1", TODAY),\n            return_type="STATE_CONTRACT_RETURN",\n        ).to_wire()\n\n\ndef test_return_certificate_root_item_mutual_exclusion_and_tuple_validation() -> None:\n    with pytest.raises(TurnoverContractError, match="root-level or item-level"):\n        LpReturnDocument(\n            trade_participant_inn=INN,\n            products_list=(\n                ReturnProduct(CIS, permit=PermitDocument("DECLARATION", "ITEM-CERT", TODAY)),\n            ),\n            primary_document=PrimaryDocument("RECEIPT", "R", TODAY),\n            permit=PermitDocument("DECLARATION", "ROOT-CERT", TODAY),\n            return_type="RETAIL_RETURN",\n        ).to_wire()\n\n    with pytest.raises(TurnoverContractError, match="certificate_number"):\n        LpReturnDocument(\n            trade_participant_inn=INN,\n            products_list=(ReturnProduct(CIS),),\n            primary_document=PrimaryDocument("RECEIPT", "R", TODAY),\n            permit=PermitDocument("DECLARATION", "", TODAY),\n            return_type="RETAIL_RETURN",\n        ).to_wire()\n\n    root_wire = LpReturnDocument(\n        trade_participant_inn=INN,\n        products_list=(ReturnProduct(CIS),),\n        primary_document=PrimaryDocument("RECEIPT", "R", TODAY),\n        permit=PermitDocument("DECLARATION", "ROOT-CERT", TODAY),\n        return_type="RETAIL_RETURN",\n    ).to_wire()\n    assert root_wire["certificate_number"] == "ROOT-CERT"\n\n    item_wire = LpReturnDocument(\n        trade_participant_inn=INN,\n        products_list=(ReturnProduct(CIS, permit=PermitDocument("DECLARATION", "ITEM-CERT", TODAY)),),\n        primary_document=PrimaryDocument("RECEIPT", "R", TODAY),\n        return_type="RETAIL_RETURN",\n    ).to_wire()\n    assert item_wire["products_list"][0]["certificate_number"] == "ITEM-CERT"\n\n'''
          path.write_text(s[:start] + replacement + s[end+1:], encoding="utf-8")

          replace_once(
              p,
              '''            products_list=(ReturnProduct(CIS, paid=False),),\n            return_type="OWN_USE_RETURN",\n''',
              '''            products_list=(ReturnProduct(CIS),),\n            return_type="OWN_USE_RETURN",\n''',
          )

          p = "docs/M5_TURNOVER_CONTRACT.md"
          replace_once(
              p,
              '''Source: True API v726.0 dated 2026-09-04 and accepted `M5-TURNOVER-RESEARCH-001`.\n''',
              '''Source: True API v726.0 dated 2026-09-04, authoritative LP_RETURN schema §4.1.5 (PDF pp. 124-128), accepted M5 research, and official return-reason matrix pp. 789-790. Where the research shorthand differed, §4.1.5 is authoritative for LP_RETURN wire semantics.\n''',
          )

          path = Path(p)
          s = path.read_text(encoding="utf-8")
          start = s.index("## REMOTE_SALE_RETURN hardening\n")
          end = s.index("\n## Return reason matrix\n", start)
          replacement = '''## LP_RETURN exact §4.1.5 contract\n\n`LP_RETURN` wire validation follows True API v726.0 §4.1.5, PDF pp. 124-128. The generalized `RETURN_TO_CIRCULATION` operation is executable only through the exact conditional rules below; unknown combinations fail closed.\n\nCommon rules:\n\n- `trade_participant_inn` is required.\n- `products_list` is non-empty and `products_list[].ki` is unique.\n- `VENDING_RETURN` remains unsupported for `lp`.\n- item-level values override root-level values only where §4.1.5 defines such fallback/override semantics.\n- KPP/FIAS/product cost/WB-only fields are not synthesized into LP_RETURN.\n\n`paid`:\n\n- permitted only for `REMOTE_SALE_RETURN`; root `paid` and item `products_list[].paid` are both valid source locations; item value has priority over root; every item must resolve to an explicit boolean. Missing effective `paid` is `MANUAL_REVIEW / PAID_REQUIRED`.\n- for `RETAIL_RETURN`, `OWN_USE_RETURN`, `STATE_CONTRACT_RETURN`, `NOT_FOR_SALE_RETURN`, and every other non-REMOTE return, root and item `paid` are strictly absent.\n\nPrimary document:\n\n- `REMOTE_SALE_RETURN`: effective `paid=true` requires an effective primary document; effective `paid=false` requires the primary-document tuple to be absent for that item.\n- `RETAIL_RETURN`: effective primary document required.\n- `NOT_FOR_SALE_RETURN`: effective primary document required.\n- `OWN_USE_RETURN` and `STATE_CONTRACT_RETURN`: primary document strictly absent.\n- item primary-document fields override root fields for that item.\n- `RECEIPT` and `SALES_RECEIPT` are accepted only for `RETAIL_RETURN` / `REMOTE_SALE_RETURN`. `NOT_FOR_SALE_RETURN` uses `OTHER`; `primary_document_custom_name` is required only for `OTHER` and strictly absent for non-`OTHER`.\n\nState contract:\n\n- `STATE_CONTRACT_RETURN` requires `state_contract_id`.\n- it is strictly absent for all other return types.\n- validation is exact: 25 numeric characters; the 13th character is `1`, `2`, or `3`; the value is not normalized or mutated.\n\nCertificate / RD tuple:\n\n- certificate data is strictly absent for `STATE_CONTRACT_RETURN`, `OWN_USE_RETURN`, and unsupported `VENDING_RETURN`.\n- for return types where certificate data is allowed, it remains optional. If `certificate_type` is supplied, `certificate_number` and `certificate_date` belong to the same complete tuple.\n- root-level and item-level certificate data must not be supplied simultaneously.\n\nThe P0 WB FBS return alias remains `RETURN_REMOTE_SALE -> LP_RETURN -> REMOTE_SALE_RETURN` and is additionally type-locked by the assembler. Business success remains document `CHECKED_OK` plus fresh M1 CIS reconciliation to `INTRODUCED`. There is no generic LP_RETURN cancellation.\n'''
          path.write_text(s[:start] + replacement + s[end:], encoding="utf-8")

          for file in ("src/wbcz/turnover.py", "tests/test_m5_turnover.py"):
              compile(Path(file).read_text(encoding="utf-8"), file, "exec")
          PY
          git diff --check
          python -m compileall -q src tests/test_m5_turnover.py
          python -m pytest -q tests/test_m5_turnover.py
      - name: Commit authoritative LP_RETURN contract fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/wbcz/turnover.py tests/test_m5_turnover.py docs/M5_TURNOVER_CONTRACT.md
          git diff --cached --check
          git commit -m 'fix: enforce authoritative LP_RETURN wire contract'
          git push origin HEAD:m5/turnover-operations-001
