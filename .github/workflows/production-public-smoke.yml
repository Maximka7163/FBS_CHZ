name: Production public smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for production frontend and API
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://sellari-marking-fbs.vercel.app"
          EXPECTED_SHA="3fabe882dbc3e73d0e2df72fa429b6e40fa0c5bd"

          ok=0
          for i in $(seq 1 60); do
            echo "Attempt $i/60"

            root_code=$(curl -L -sS -o /tmp/root.html -w '%{http_code}' --max-time 15 "$BASE/" || true)
            health_code=$(curl -L -sS -o /tmp/health.json -w '%{http_code}' --max-time 15 "$BASE/api/health" || true)
            version_code=$(curl -L -sS -o /tmp/version.json -w '%{http_code}' --max-time 15 "$BASE/api/version" || true)
            csrf_code=$(curl -L -sS -o /tmp/csrf.json -w '%{http_code}' --max-time 15 "$BASE/api/auth/csrf" || true)

            echo "root=$root_code health=$health_code version=$version_code csrf=$csrf_code"

            if [[ "$root_code" == 200 && "$health_code" == 200 && "$version_code" == 200 && "$csrf_code" == 200 ]]; then
              python3 - <<'PY'
import json
from pathlib import Path

health = json.loads(Path("/tmp/health.json").read_text())
version = json.loads(Path("/tmp/version.json").read_text())
csrf = json.loads(Path("/tmp/csrf.json").read_text())

assert health.get("status") == "ok", health
assert health.get("service") == "wbcz-web", health
assert version.get("application_version") == "0.5.1", version
assert version.get("build_sha") == "3fabe882dbc3e73d0e2df72fa429b6e40fa0c5bd", version
assert isinstance(csrf.get("csrf_token"), str) and csrf["csrf_token"], csrf

print("PUBLIC_FRONTEND=PASS")
print("PUBLIC_API_HEALTH=PASS")
print("PUBLIC_API_VERSION=PASS")
print("PUBLIC_CSRF=PASS")
print("BACKEND_SHA=" + version["build_sha"])
PY
              ok=1
              break
            fi

            echo "--- health body ---"
            head -c 1000 /tmp/health.json 2>/dev/null || true
            echo
            echo "--- version body ---"
            head -c 1000 /tmp/version.json 2>/dev/null || true
            echo
            echo "--- csrf body ---"
            head -c 1000 /tmp/csrf.json 2>/dev/null || true
            echo

            sleep 5
          done

          if [[ "$ok" != 1 ]]; then
            echo "PRODUCTION_PUBLIC_SMOKE=FAIL"
            exit 1
          fi

          echo "PRODUCTION_PUBLIC_SMOKE=PASS"
