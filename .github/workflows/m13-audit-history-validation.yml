name: M13 audit history backend validation
on:
  push:
    branches: [m13/audit-history-001]
  workflow_dispatch:

env:
  WBCZ_ENV: test
  WBCZ_OWN_INN: "1234567890"
  WBCZ_PUBLIC_REGISTRATION_ENABLED: "false"
  WBCZ_AUDIT_PSEUDONYM_KEY: "m13-test-only-audit-pseudonym-key-0000000000000001"
  WBCZ_AUDIT_PSEUDONYM_KEY_ID: "m13-test-v1"
  M13_ACCEPTED_BASE: "a2cb6aecd61344bbae2ce8da222f9d29d3558f36"

jobs:
  validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wbcz_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d wbcz_test"
          --health-interval=2s --health-timeout=3s --health-retries=20
    env:
      WBCZ_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_test
      WBCZ_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_test
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}

      - name: Accepted base ancestry
        run: git merge-base --is-ancestor "$M13_ACCEPTED_BASE" HEAD

      - name: Historical migrations unchanged
        shell: bash
        run: |
          bad="$(git diff --name-only "$M13_ACCEPTED_BASE" HEAD -- migrations/versions | grep -E '^migrations/versions/(000[1-9]|001[0-3])_' || true)"
          if [ -n "$bad" ]; then
            echo "Historical migrations changed:"
            echo "$bad"
            exit 1
          fi

      - name: Frontend source unchanged
        run: git diff --exit-code "$M13_ACCEPTED_BASE" HEAD -- frontend src/wbcz_ui

      - name: M14 not started
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^|[/_.-])m14([/_.-]|$)'; then
            echo "M14 artifacts found"
            exit 1
          fi

      - run: python -m pip install -e ".[ui,test,web]"
      - run: python -m compileall -q src migrations

      - name: M13 contract documentation present
        run: |
          test -f docs/M13_AUDIT_HISTORY_CONTRACT.md
          grep -q "APPEND_ONLY=YES" docs/M13_AUDIT_HISTORY_CONTRACT.md
          grep -q "TAMPER_EVIDENT=YES" docs/M13_AUDIT_HISTORY_CONTRACT.md
          grep -q "NOT_EXTERNALLY_ANCHORED" docs/M13_AUDIT_HISTORY_CONTRACT.md

      - name: Migration head is M13
        shell: bash
        run: |
          head="$(alembic heads | awk '{print $1}')"
          test "$head" = "0014_m13_audit_history"

      - run: alembic upgrade head

      - name: Full Python regression
        run: python -m pytest -q tests

      - name: Focused M13 hash-chain JCS sanitizer tenant concurrency tests
        run: python -m pytest -q tests/test_m13_audit_history.py

      - name: Frontend regression
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build

  migration_path:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=2s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -e ".[ui,test,web]"
      - name: Create migration test database
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://postgres:postgres@127.0.0.1:5432/postgres", autocommit=True) as db:
              db.execute("DROP DATABASE IF EXISTS wbcz_m13_upgrade")
              db.execute("CREATE DATABASE wbcz_m13_upgrade")
          PY
      - name: Upgrade through M12
        env:
          WBCZ_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_m13_upgrade
        run: alembic upgrade 0013_m12_users_roles
      - name: Seed minimal M12 tenant
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine,text
          from wbcz_web.auth import hash_password
          url="postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_m13_upgrade"
          engine=create_engine(url,future=True)
          with engine.begin() as db:
              uid=db.scalar(text("INSERT INTO users(username,password_hash,is_active,is_admin,password_changed_at,password_version,password_must_change,email_normalized,account_state) VALUES ('legacy-owner',:p,true,false,now(),1,false,NULL,'ACTIVE') RETURNING id"),{"p":hash_password("legacy migration secure password")})
              db.execute(text("INSERT INTO organisations(id,name,is_active,created_by_user_id) VALUES ('11111111-1111-4111-8111-111111111111','Legacy M12',true,:u)"),{"u":uid})
              db.execute(text("INSERT INTO participants(id,organisation_id,inn,display_name,verification_state,is_active) VALUES ('22222222-2222-4222-8222-222222222222','11111111-1111-4111-8111-111111111111','1234567890','Legacy','VERIFIED',true)"))
              db.execute(text("INSERT INTO organisation_memberships(id,organisation_id,user_id,role,is_active,created_by_user_id) VALUES ('33333333-3333-4333-8333-333333333333','11111111-1111-4111-8111-111111111111',:u,'OWNER',true,:u)"),{"u":uid})
              db.execute(text("INSERT INTO audit_log(action,user_id,organisation_id,participant_id,entity_type,entity_id,metadata_json) VALUES ('BOOTSTRAP_COMPLETED',:u,'11111111-1111-4111-8111-111111111111','22222222-2222-4222-8222-222222222222','organisation','11111111-1111-4111-8111-111111111111','{}'::json)"),{"u":uid})
          engine.dispose()
          PY
      - name: Upgrade exactly 0013 to 0014
        env:
          WBCZ_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_m13_upgrade
          WBCZ_AUDIT_PSEUDONYM_KEY: "m13-test-only-audit-pseudonym-key-0000000000000001"
          WBCZ_AUDIT_PSEUDONYM_KEY_ID: "m13-test-v1"
        run: alembic upgrade 0014_m13_audit_history
      - name: Verify legacy seal and append-only guards
        run: |
          python - <<'PY'
          from uuid import uuid4
          from sqlalchemy import create_engine,text
          url="postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_m13_upgrade"
          engine=create_engine(url,future=True)
          with engine.begin() as db:
              assert db.scalar(text("select count(*) from audit_chain_heads"))==2
              assert db.scalar(text("select count(*) from audit_events where event_type='AUDIT_CHAIN_GENESIS'"))==2
              assert db.scalar(text("select count(*) from audit_events where event_type='LEGACY_HISTORY_IMPORTED'"))==2
              assert db.scalar(text("select count(*) from audit_log"))==1
              event_id=db.scalar(text("select event_id from audit_events limit 1"))
              chain_id=db.scalar(text("select chain_id from audit_chain_heads where scope_kind='SYSTEM'"))
              head_hash=db.scalar(text("select event_hash from audit_events where chain_id=:c and sequence=1"),{"c":chain_id})
              checkpoint_id=str(uuid4())
              db.execute(text("""
                insert into audit_checkpoints(
                  id,chain_id,through_sequence,head_event_hash,previous_checkpoint_hash,
                  checkpoint_hash,checkpoint_format_version,created_at
                ) values(:id,:c,1,:h,:z,:x,'SELLARI_AUDIT_CHECKPOINT_V1',now())
              """),{"id":checkpoint_id,"c":chain_id,"h":head_hash,"z":"0"*64,"x":"1"*64})

          def must_reject(sql,params):
              try:
                  with engine.begin() as db:
                      db.execute(text(sql),params)
              except Exception:
                  return
              raise AssertionError("append-only guard failed: "+sql)

          must_reject("update audit_events set action='X' where event_id=:id",{"id":event_id})
          must_reject("delete from audit_events where event_id=:id",{"id":event_id})
          must_reject("update audit_checkpoints set checkpoint_hash=:h where id=:id",{"id":checkpoint_id,"h":"2"*64})
          must_reject("delete from audit_checkpoints where id=:id",{"id":checkpoint_id})
          engine.dispose()
          PY
      - name: Downgrade M13
        env:
          WBCZ_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_m13_upgrade
        run: alembic downgrade 0013_m12_users_roles
