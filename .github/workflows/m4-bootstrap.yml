name: M4 temporary lifecycle bootstrap

on:
  push:
    branches:
      - m4/document-lifecycle-001

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m4/document-lifecycle-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/m4_apply_wiring.py
      - run: python -m compileall -q src tests
      - name: Commit patched M4 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm scripts/m4_apply_wiring.py .github/workflows/m4-bootstrap.yml
          git add src tests migrations docs
          git commit -m 'feat: wire M4 document lifecycle through Windows agent'
          git push origin HEAD:m4/document-lifecycle-001
