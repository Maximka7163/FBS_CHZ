name: FBS control dry-run validation

on:
  pull_request:
    paths:
      - "src/wbcz/control_engine.py"
      - "src/wbcz_web/api/routes.py"
      - "src/wbcz_web/services/control.py"
      - "src/wbcz_web/services/agent_orchestration.py"
      - "src/wbcz_web/services/workspace.py"
      - "frontend/**"
      - "tests/test_fbs_control_policy.py"
      - "tests/test_control.py"
      - "tests/test_wb_regression.py"
      - "tests/test_ui_application.py"
      - "tests/test_ui_modes.py"
      - "tests/test_web_v05.py"
      - "tests/test_p0_frontend_integration.py"
      - ".github/workflows/fbs-control-dryrun-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  WBCZ_ENV: test
  WBCZ_OWN_INN: "1234567890"
  WBCZ_AUDIT_PSEUDONYM_KEY: "fbs-control-ci-only-audit-pseudonym-key-20260924"
  WBCZ_AUDIT_PSEUDONYM_KEY_ID: "fbs-control-ci-v1"
  WBCZ_TRUE_API_WRITE_ENABLED: "false"
  WBCZ_TRUE_API_REAL_READ_ENABLED: "false"
  WBCZ_FBS_DRY_RUN_ONLY: "true"
  WBCZ_PRINTING_ENABLED: "false"
  WBCZ_PRINT_EXECUTION_ENABLED: "false"
  WBCZ_SUZ_FULL_KM_REMOTE_ACQUISITION_ENABLED: "false"

jobs:
  control-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wbcz_fbs_control
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wbcz_fbs_control"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      WBCZ_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_fbs_control
      WBCZ_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_fbs_control
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[ui,test,web]"

      - name: Build deterministic WB regression workbook
        run: |
          sudo install -d -m 0755 -o "$USER" -g "$USER" /mnt/data
          python scripts/generate_regression_workbook.py /mnt/data/REF_WB_archive_9.xlsx

      - name: Focused FBS control regressions
        run: |
          python -m pytest -q \
            tests/test_fbs_control_policy.py \
            tests/test_control.py \
            tests/test_wb_regression.py \
            tests/test_ui_application.py \
            tests/test_ui_modes.py \
            tests/test_web_v05.py::test_decisions_match_backend_core \
            tests/test_p0_frontend_integration.py::test_true_api_write_disabled_is_hard_stop_for_bulk_and_prepare \
            tests/test_p0_frontend_integration.py::test_agent_control_result_is_decision_only_while_write_gate_off \
            tests/test_p0_frontend_integration.py::test_sequence_control_queues_only_latest_event \
            tests/test_p0_frontend_integration.py::test_three_event_sequence_marks_all_older_events_superseded \
            tests/test_p0_frontend_integration.py::test_ambiguous_event_order_never_queues_true_api_check \
            tests/test_p0_frontend_integration.py::test_dry_run_blocks_bulk_and_prepare_write_without_creating_state \
            tests/test_p0_frontend_integration.py::test_workspace_evidence_is_explicit_whitelist_and_dryrun_runtime \
            tests/test_p0_frontend_integration.py::test_http_dry_run_bulk_bypass_is_typed_409_and_creates_no_write \
            tests/test_p0_frontend_integration.py::test_http_mock_control_ignores_agent_presence_when_live_read_is_disabled \
            tests/test_p0_frontend_integration.py::test_http_live_read_only_control_uses_agent_without_enabling_writes \
            tests/test_p0_frontend_integration.py::test_exact_duplicate_rows_create_one_event_and_one_cis_check \
            tests/test_p0_frontend_integration.py::test_live_ready_is_blocked_after_newer_overlapping_wb_event_before_any_write_state \
            tests/test_p0_frontend_integration.py::test_result_time_sequence_recheck_prevents_stale_ready_after_newer_import \
            tests/test_p0_frontend_integration.py::test_238_row_upload_agent_results_and_workspace_regression

      - name: Safety flag regression
        shell: bash
        run: |
          set -euo pipefail
          test "$WBCZ_TRUE_API_WRITE_ENABLED" = "false"
          test "$WBCZ_TRUE_API_REAL_READ_ENABLED" = "false"
          test "$WBCZ_FBS_DRY_RUN_ONLY" = "true"
          test "$WBCZ_PRINTING_ENABLED" = "false"
          test "$WBCZ_PRINT_EXECUTION_ENABLED" = "false"
          test "$WBCZ_SUZ_FULL_KM_REMOTE_ACQUISITION_ENABLED" = "false"

  full-backend-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wbcz_fbs_full
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wbcz_fbs_full"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      WBCZ_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_fbs_full
      WBCZ_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_fbs_full
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install full backend test dependencies
        run: python -m pip install -e ".[ui,test,web]"

      - name: Build deterministic WB regression workbook
        run: |
          sudo install -d -m 0755 -o "$USER" -g "$USER" /mnt/data
          python scripts/generate_regression_workbook.py /mnt/data/REF_WB_archive_9.xlsx

      - name: Full backend regression
        run: python -m pytest -q

  frontend-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend regression
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run typecheck
          npm run build
