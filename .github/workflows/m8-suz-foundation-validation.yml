name: M8 SUZ foundation validation

on:
  push:
    branches:
      - m8/suz-foundation-001
  workflow_dispatch:

permissions:
  contents: read

env:
  M8_BASE_SHA: 0d64e029abc88565aadafcc30bb6a74036aaa59b
  FROZEN_P0_SHA: 395701f1757711b5a11b9348d929182d40f51f0a
  WBCZ_ENV: test
  WBCZ_OWN_INN: "1234567890"
  WBCZ_TRUE_API_WRITE_ENABLED: "false"

jobs:
  linux-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wbcz_m8
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d wbcz_m8"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=20
    env:
      WBCZ_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_m8
      WBCZ_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_m8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove exact base, frozen P0 and M7 preservation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$M8_BASE_SHA")" = "$M8_BASE_SHA"
          test "$(git rev-parse "$M8_BASE_SHA")" = "$M8_BASE_SHA"
          test "$(git rev-parse origin/p0/test-candidate-001)" = "$FROZEN_P0_SHA"
          if git diff --name-only "$M8_BASE_SHA"...HEAD | grep '^frontend/'; then
            echo 'FRONTEND_SOURCE_CHANGES must remain NONE for M8 foundation' >&2; exit 1
          fi
          if git diff --name-only "$M8_BASE_SHA"...HEAD | grep -E '^migrations/versions/000[1-8]'; then
            echo 'historical migration changed in M8' >&2; exit 1
          fi
          git diff --quiet "$M8_BASE_SHA"...HEAD -- \
            src/wbcz/edo_lite.py \
            docs/M7_EDO_LITE_FOUNDATION_CONTRACT.md \
            migrations/versions/0008_m7_edo_lite_foundation.py \
            tests/test_m7_edo_lite_foundation.py \
            .github/workflows/m7-edo-lite-foundation-validation.yml
          if git diff --name-only "$M8_BASE_SHA"...HEAD | grep -Ei '(^|/)(m9)(_|/|\.)'; then
            echo 'M9 implementation must not start in M8' >&2; exit 1
          fi
          if find .github/workflows -maxdepth 1 -type f \( -name '*m8*bootstrap*.yml' -o -name '*m8*patch*.yml' \) -print -quit | grep .; then
            echo 'temporary M8 workflow remains at final head' >&2; exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        run: python -m pip install -e ".[ui,test,web]"
      - name: Build deterministic WB regression workbook
        run: |
          sudo install -d -m 0755 -o "$USER" -g "$USER" /mnt/data
          python scripts/generate_regression_workbook.py /mnt/data/REF_WB_archive_9.xlsx
          test -s /mnt/data/REF_WB_archive_9.xlsx
      - name: Migration head is M8 foundation
        shell: bash
        run: |
          set -euo pipefail
          test "$(alembic heads | tr -d '\r')" = '0009_m8_suz (head)'
          python - <<'PY'
          import os
          from sqlalchemy import create_engine
          e=create_engine(os.environ['WBCZ_TEST_DATABASE_URL'])
          with e.begin() as c:
              c.exec_driver_sql('DROP SCHEMA public CASCADE')
              c.exec_driver_sql('CREATE SCHEMA public')
          e.dispose()
          PY
          alembic upgrade head
          test "$(alembic current | tr -d '\r')" = '0009_m8_suz (head)'
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          e=create_engine(os.environ['WBCZ_TEST_DATABASE_URL'])
          with e.connect() as c:
              tables={row[0] for row in c.execute(text("select table_name from information_schema.tables where table_schema='public'"))}
              expected={'suz_connections','suz_orders','suz_order_items','suz_km_vault','suz_code_blocks','suz_reconciliation_events'}
              assert expected <= tables
              connection_cols={row[0].lower() for row in c.execute(text("select column_name from information_schema.columns where table_name='suz_connections'"))}
              assert 'token' not in connection_cols
              assert 'clienttoken' not in connection_cols
              assert 'registrationkey' not in connection_cols
              vault_cols={row[0].lower() for row in c.execute(text("select column_name from information_schema.columns where table_name='suz_km_vault'"))}
              assert not {'plaintext','plaintext_km','full_km','raw_km'} & vault_cols
              assert {'ciphertext','nonce','auth_tag','key_version','aad_hash','plaintext_sha256','ciphertext_sha256'} <= vault_cols
              assert c.execute(text("select count(*) from edo_lite_schema_registry where enabled_for_lp=true")).scalar_one() == 0
          e.dispose()
          PY
      - name: Focused M8 foundation tests
        run: python -m pytest -q tests/test_m8_suz_foundation.py
      - name: M7 M6 M5 M4 M3 M2 M1 regressions
        run: |
          python -m pytest -q tests/test_m7_edo_lite_foundation.py
          python -m pytest -q tests/test_m6_aggregation.py
          python -m pytest -q tests/test_m5_turnover.py
          python -m pytest -q tests/test_m4_document_lifecycle.py
          python -m pytest -q tests/test_m3_auth_signing.py
          python -m pytest -q tests/test_m2_reference_products.py
          python -m pytest -q tests/test_m1_cis_inventory.py
      - name: P0 regressions
        run: |
          python -m pytest -q tests/test_p0_document_assembler.py
          python -m pytest -q tests/test_write_pipeline.py
          python -m pytest -q tests/test_p0_endtoend_wiring.py
      - name: Full PostgreSQL backend regression
        run: python -m pytest -q
      - name: Frontend regression
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npm run typecheck
          npm test
          npm run build
          if grep -R -E 'markirovka\.crpt\.ru|WBCZ_AGENT_MACHINE_TOKEN|/api/agent/' dist; then
            echo 'forbidden production/agent boundary leaked into browser bundle' >&2; exit 1
          fi
      - name: M8 security and contract assertions
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E 'GENERIC_SUZ_HTTP|RAW_SUZ_URL|RAW_SUZ_METHOD|RAW_SUZ_HEADERS|ARBITRARY_SUZ_BODY|ARBITRARY_SIGNER' src/wbcz/suz_foundation.py src/wbcz_web/models/suz.py
          ! grep -R -E -- '-----BEGIN .*PRIVATE KEY-----' src frontend migrations
          ! grep -R -E 'WBCZ_AGENT_MACHINE_TOKEN=[A-Za-z0-9._~-]{16,}' src frontend migrations
          ! grep -Ei 'clienttoken|registrationkey|registration_key|plaintext_km|full_km|raw_km' migrations/versions/0009_m8_suz.py
          grep -F 'WBCZ_TRUE_API_WRITE_ENABLED=false' .env.production.example
          python - <<'PY'
          from wbcz.edo_lite import M7_MUTATION_REGISTRY, PRODUCTION_SCHEMA_REGISTRY
          from wbcz.suz_foundation import (
              PRODUCTION_SUZ_CORE_TRANSPORT_ENABLED,
              PRODUCTION_SUZ_WRITE_ENABLED,
              SUZ_CORE_CAPABILITIES,
              SUZ_RPS_LIMIT,
              STATIC_TOKEN_FALLBACK,
              LP_MANUAL_APPLICATION_REPORT_ALLOWED,
              M8_CORE_SUZ_HTTP_LOCATION,
          )
          from wbcz_web.models.suz import SuzConnectionRecord, SuzKmVaultRecord, SuzOrderItemRecord
          assert all(not x.enabled_for_lp for x in PRODUCTION_SCHEMA_REGISTRY.values())
          assert all(not x.enabled for x in M7_MUTATION_REGISTRY.values())
          assert not PRODUCTION_SUZ_CORE_TRANSPORT_ENABLED
          assert not PRODUCTION_SUZ_WRITE_ENABLED
          assert M8_CORE_SUZ_HTTP_LOCATION == 'UNRESOLVED'
          assert SUZ_RPS_LIMIT is None
          assert not STATIC_TOKEN_FALLBACK
          assert not LP_MANUAL_APPLICATION_REPORT_ALLOWED
          for cap in SUZ_CORE_CAPABILITIES.values():
              assert not cap.enabled
              assert cap.method is None and cap.path is None and cap.base is None
              assert cap.request_contract is None and cap.response_contract is None
          connection_cols=set(SuzConnectionRecord.__table__.columns.keys())
          assert not {'token','clientToken','client_token','registrationKey','registration_key'} & connection_cols
          vault_cols=set(SuzKmVaultRecord.__table__.columns.keys())
          assert not {'plaintext','plaintext_km','full_km','raw_km'} & vault_cols
          item_cols=set(SuzOrderItemRecord.__table__.columns.keys())
          assert 'serial_numbers' not in item_cols
          PY
          python -m pytest -q \
            tests/test_p0_endtoend_wiring.py::test_direct_vps_true_api_production_path_is_absent \
            tests/test_p0_endtoend_wiring.py::test_windows_runtime_and_outbound_agent_have_no_listener \
            tests/test_p0_endtoend_wiring.py::test_preflight_is_mutation_free_even_with_optional_cis

  windows-agent:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prove exact base and frozen P0
        shell: pwsh
        run: |
          $base=(git merge-base HEAD $env:M8_BASE_SHA).Trim()
          if ($base -ne $env:M8_BASE_SHA) { throw "wrong M8 base: $base" }
          $frozen=(git rev-parse origin/p0/test-candidate-001).Trim()
          if ($frozen -ne $env:FROZEN_P0_SHA) { throw "frozen P0 changed: $frozen" }
          $frontend=(git diff --name-only "$env:M8_BASE_SHA...HEAD" | Select-String '^frontend/')
          if ($frontend) { throw 'frontend source changed in M8 foundation' }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e ".[ui,test,web]"
      - name: M8 M7 M6 M5 focused tests
        shell: pwsh
        run: |
          python -m pytest -q tests/test_m8_suz_foundation.py
          python -m pytest -q tests/test_m7_edo_lite_foundation.py
          python -m pytest -q tests/test_m6_aggregation.py
          python -m pytest -q tests/test_m5_turnover.py
      - name: M4 M3 M2 M1 Windows regressions
        shell: pwsh
        run: |
          python -m pytest -q tests/test_m4_document_lifecycle.py
          python -m pytest -q tests/test_m3_auth_signing.py
          python -m pytest -q tests/test_m2_reference_products.py
          python -m pytest -q tests/test_m1_cis_inventory.py
          python -m pytest -q tests/test_windows_agent.py
      - name: P0 Windows safety regressions
        shell: pwsh
        run: |
          python -m pytest -q tests/test_p0_document_assembler.py
          python -m pytest -q `
            tests/test_p0_endtoend_wiring.py::test_windows_runtime_and_outbound_agent_have_no_listener `
            tests/test_p0_endtoend_wiring.py::test_preflight_is_mutation_free_even_with_optional_cis
