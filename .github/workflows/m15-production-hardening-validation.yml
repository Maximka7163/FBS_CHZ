name: M15 production hardening validation

on:
  push:
    branches: [m15/production-hardening-001]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  M15_BASE_COMMIT: "84afeee318c64ab3f09e3aef53f861e0ae5d24ba"
  M15_MIGRATION: "0016_m15_production_hardening"

jobs:
  generate-locks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Generate Python production lock
        run: |
          python -m pip install "pip==25.3" "pip-tools==7.5.1"
          pip-compile pyproject.toml --extra web --generate-hashes --strip-extras --output-file requirements.production.lock
      - name: Generate frontend lock
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m15-generated-locks
          path: |
            requirements.production.lock
            frontend/package-lock.json
          if-no-files-found: error

  focused-m15:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[web,test]"
      - name: Compile M15 modules
        run: |
          python -m py_compile \
            src/wbcz_web/services/production_hardening.py \
            src/wbcz_web/services/production_secrets.py \
            src/wbcz_web/services/worker_runtime.py \
            src/wbcz_web/services/agent_enrollment.py \
            src/wbcz_web/services/runtime_health.py \
            src/wbcz_web/middleware.py \
            src/wbcz_web/worker.py \
            src/wbcz/agent_identity.py
      - name: Focused M15 tests
        run: python -m pytest -q tests/test_m15_production_hardening.py
      - name: Secret scan
        run: python scripts/m15_secret_scan.py

  postgres-m15:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wbcz_m15
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d wbcz_m15"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WBCZ_ENV: test
      WBCZ_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_m15
      WBCZ_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_m15
      WBCZ_OWN_INN: "1234567890"
      WBCZ_COOKIE_SECURE: "false"
      WBCZ_BUILD_SHA: ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[web,test]"
      - name: Fresh migration to exact M15 revision
        run: |
          alembic upgrade "$M15_MIGRATION"
          test "$(alembic current | awk '{print $1}')" = "$M15_MIGRATION"
      - name: M15 downgrade and M14-to-M15 upgrade path
        run: |
          alembic downgrade 0015_m14_integration_settings
          test "$(alembic current | awk '{print $1}')" = "0015_m14_integration_settings"
          alembic upgrade "$M15_MIGRATION"
          test "$(alembic current | awk '{print $1}')" = "$M15_MIGRATION"
      - name: Focused PostgreSQL M15 tests
        run: python -m pytest -q tests/test_m15_postgres_runtime.py
      - name: M14 regression
        run: python -m pytest -q tests/test_m14_integration_settings.py

  frontend-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Generate lock for pre-lock validation
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Frontend install
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend regression
        working-directory: frontend
        run: |
          npm test
          npm run build
