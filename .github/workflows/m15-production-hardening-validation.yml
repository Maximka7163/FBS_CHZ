name: M15 production hardening validation

on:
  push:
    branches: [m15/production-hardening-001]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  M15_BASE_COMMIT: "84afeee318c64ab3f09e3aef53f861e0ae5d24ba"
  M15_MIGRATION: "0016_m15_production_hardening"

jobs:
  static-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WBCZ_POSTGRES_DB: wbcz_ci
      WBCZ_POSTGRES_SUPERUSER_PASSWORD: SYNTHETIC_CI_POSTGRES_PASSWORD_123456789
      WBCZ_APP_DB_PASSWORD: SYNTHETIC_CI_APP_PASSWORD_123456789
      WBCZ_MIGRATOR_DB_PASSWORD: SYNTHETIC_CI_MIGRATOR_PASSWORD_123456789
      WBCZ_BACKUP_DB_PASSWORD: SYNTHETIC_CI_BACKUP_PASSWORD_123456789
      WBCZ_APP_VERSION: "0.5.1"
      WBCZ_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WBCZ_DATABASE_URL: postgresql+psycopg://wbcz_app:SYNTHETIC_CI_APP_PASSWORD_123456789@marking-postgres:5432/wbcz_ci
      WBCZ_MIGRATION_DATABASE_URL: postgresql+psycopg://wbcz_migrator:SYNTHETIC_CI_MIGRATOR_PASSWORD_123456789@marking-postgres:5432/wbcz_ci
      WBCZ_OWN_INN: "1234567890"
      WBCZ_APP_URL: https://mark.example.test
      WBCZ_TRUSTED_HOSTS: mark.example.test
      WBCZ_TRUSTED_PROXY_CIDRS: 127.0.0.1/32
      WBCZ_REPORT_ARTIFACT_KEY_VERSION: artifact-v1
      WBCZ_AUDIT_PSEUDONYM_KEY_ID: audit-v1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Accepted-base ancestry and frozen surfaces
        run: |
          git merge-base --is-ancestor "$M15_BASE_COMMIT" HEAD
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          unexpected="$(git diff --name-only "$M15_BASE_COMMIT" HEAD -- migrations/versions | grep -v '^migrations/versions/0016_m15_production_hardening.py$' || true)"
          test -z "$unexpected" || { echo "historical migrations changed: $unexpected"; exit 1; }
          git diff --exit-code "$M15_BASE_COMMIT" HEAD -- frontend ':!frontend/package-lock.json' src/wbcz_ui
      - name: Install locked runtime and fixed test tools
        run: |
          python -m pip install -r requirements.production.lock
          python -m pip install --no-deps -e .
          python -m pip install "pytest==9.1.1" "httpx==0.28.1"
      - name: Production dependency and Action pin contracts
        run: |
          python scripts/m15_verify_dependency_lock.py
          python scripts/m15_actions_pin_contract.py
      - name: Compile Python
        run: python -m compileall -q src scripts tests
      - name: Focused M15 tests
        run: python -m pytest -q tests/test_m15_production_hardening.py
      - name: Repository secret scan
        run: python scripts/m15_secret_scan.py
      - name: Python vulnerability audit
        run: |
          python -m pip install "pip-audit==2.10.1"
          pip-audit -r requirements.production.lock --strict
      - name: Production compose contract
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Production feature-gate assertions
        run: |
          grep -F 'WBCZ_TRUE_API_WRITE_ENABLED: "false"' docker-compose.prod.yml
          grep -F 'WBCZ_PUBLIC_REGISTRATION_ENABLED: "false"' docker-compose.prod.yml
          grep -F 'WBCZ_AGENT_LEGACY_BOOTSTRAP_ENABLED: "false"' docker-compose.prod.yml
          grep -F 'marking-worker:' docker-compose.prod.yml
          grep -F 'marking_artifacts:/var/lib/wbcz/artifacts' docker-compose.prod.yml
          grep -F 'marking_secret_store:/var/lib/wbcz/secret-store' docker-compose.prod.yml

  postgres-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wbcz_m15
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d wbcz_m15"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WBCZ_ENV: test
      WBCZ_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_m15
      WBCZ_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_m15
      WBCZ_OWN_INN: "1234567890"
      WBCZ_COOKIE_SECURE: "false"
      WBCZ_BUILD_SHA: ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked runtime and fixed test tools
        run: |
          python -m pip install -r requirements.production.lock
          python -m pip install --no-deps -e .
          python -m pip install "pytest==9.1.1" "httpx==0.28.1"
      - name: Exact Alembic head
        run: test "$(alembic heads | awk '{print $1}')" = "$M15_MIGRATION"
      - name: Fresh migration to exact M15 revision
        run: |
          alembic upgrade "$M15_MIGRATION"
          test "$(alembic current | awk '{print $1}')" = "$M15_MIGRATION"
      - name: M14-to-M15 downgrade and upgrade path
        run: |
          alembic downgrade 0015_m14_integration_settings
          test "$(alembic current | awk '{print $1}')" = "0015_m14_integration_settings"
          alembic upgrade "$M15_MIGRATION"
          test "$(alembic current | awk '{print $1}')" = "$M15_MIGRATION"
      - name: Focused PostgreSQL M15 tests
        run: python -m pytest -q tests/test_m15_postgres_runtime.py
      - name: M14 M13 M12 focused regressions
        run: python -m pytest -q tests/test_m14_integration_settings.py tests/test_m13_audit_history.py tests/test_m12_users_roles.py
      - name: PostgreSQL migrator app backup role separation
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
          PGPASSWORD: postgres
          POSTGRES_DB: wbcz_roles
          POSTGRES_USER: postgres
          WBCZ_APP_DB_PASSWORD: SYNTHETIC_CI_APP_PASSWORD_123456789
          WBCZ_MIGRATOR_DB_PASSWORD: SYNTHETIC_CI_MIGRATOR_PASSWORD_123456789
          WBCZ_BACKUP_DB_PASSWORD: SYNTHETIC_CI_BACKUP_PASSWORD_123456789
        run: |
          psql -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE wbcz_roles'
          sh deploy/postgres/init-m15-roles.sh
          WBCZ_DATABASE_URL='postgresql+psycopg://wbcz_migrator:SYNTHETIC_CI_MIGRATOR_PASSWORD_123456789@127.0.0.1:5432/wbcz_roles' alembic upgrade "$M15_MIGRATION"
          test "$(PGPASSWORD="$WBCZ_MIGRATOR_DB_PASSWORD" psql -h 127.0.0.1 -U wbcz_migrator -d wbcz_roles -Atc 'select version_num from alembic_version')" = "$M15_MIGRATION"
          PGPASSWORD="$WBCZ_APP_DB_PASSWORD" psql -h 127.0.0.1 -U wbcz_app -d wbcz_roles -v ON_ERROR_STOP=1 -c "INSERT INTO worker_heartbeats(worker_id,role,instance_id,state,build_sha,started_at,heartbeat_at,metadata_json) VALUES ('ci-role-probe','worker','ci','RUNNING','ci',now(),now(),'{}'); SELECT worker_id FROM worker_heartbeats WHERE worker_id='ci-role-probe';"
          if PGPASSWORD="$WBCZ_APP_DB_PASSWORD" psql -h 127.0.0.1 -U wbcz_app -d wbcz_roles -v ON_ERROR_STOP=1 -c 'CREATE TABLE app_must_not_create(id integer)'; then
            echo "wbcz_app unexpectedly has DDL privileges"
            exit 1
          fi
          test "$(PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d wbcz_roles -Atc "select count(*) from pg_class c join pg_roles r on r.oid=c.relowner where c.relnamespace='public'::regnamespace and r.rolname='wbcz_app'")" = "0"
      - name: Full Python regression M15 through P0
        run: python -m pytest -q tests

  windows-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked runtime and fixed test tools
        run: |
          python -m pip install -r requirements.production.lock
          python -m pip install --no-deps -e .
          python -m pip install "pytest==9.1.1" "httpx==0.28.1"
      - name: Windows agent mocked regressions
        run: python -m pytest -q tests/test_windows_agent.py tests/test_agent_protocol_runtime.py

  frontend-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Locked frontend install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Frontend dependency vulnerability audit
        working-directory: frontend
        run: npm audit --audit-level=high

  release-candidate:
    needs: [static-security, postgres-regression, windows-agent, frontend-regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify final candidate identity and locks
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python scripts/m15_verify_dependency_lock.py
      - name: Generate locked SBOM
        run: |
          mkdir -p build
          python scripts/m15_sbom.py --output build/m15-sbom.cdx.json --build-sha "$(git rev-parse HEAD)"
      - name: Build exact release candidate image
        run: |
          SHA="$(git rev-parse HEAD)"
          docker build --build-arg APP_VERSION=0.5.1 --build-arg BUILD_SHA="$SHA" -t "wbcz-m15:$SHA" -f Dockerfile.backend .
          IMAGE_DIGEST="$(docker image inspect "wbcz-m15:$SHA" --format '{{.Id}}')"
          echo "WBCZ_IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          printf '%s\n' "$IMAGE_DIGEST" > build/m15-image-digest.txt
      - name: Generate exact-SHA release manifest
        run: python scripts/m15_release_manifest.py --output build/m15-release-manifest.json --sbom build/m15-sbom.cdx.json
      - name: Validate release artifact safety and exact identity
        run: |
          python scripts/m15_release_safety.py build/m15-sbom.cdx.json build/m15-release-manifest.json
          python - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path(".")
          manifest=json.loads((root/"build/m15-release-manifest.json").read_text())
          head=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          assert manifest["build_sha"] == head
          assert manifest["migration_revision"] == "0016_m15_production_hardening"
          lock=(root/"requirements.production.lock").read_bytes()
          assert manifest["dependency_lock_sha256"] == hashlib.sha256(lock).hexdigest()
          assert manifest["image_digest"].startswith("sha256:")
          PY
          sha256sum build/m15-sbom.cdx.json build/m15-release-manifest.json build/m15-image-digest.txt > build/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m15-final-release-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/m15-sbom.cdx.json
            build/m15-release-manifest.json
            build/m15-image-digest.txt
            build/SHA256SUMS
          if-no-files-found: error
