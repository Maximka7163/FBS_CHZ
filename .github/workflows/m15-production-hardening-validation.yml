name: M15 production hardening validation

on:
  push:
    branches:
      - m15/production-hardening-001
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  focused-m15:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[web,test]"
      - name: Compile M15 modules
        run: |
          python -m py_compile             src/wbcz_web/services/production_hardening.py             src/wbcz_web/services/production_secrets.py             src/wbcz_web/services/worker_runtime.py             src/wbcz_web/services/agent_enrollment.py             src/wbcz_web/services/runtime_health.py             src/wbcz_web/middleware.py             src/wbcz_web/worker.py             src/wbcz/agent_identity.py
      - name: Focused M15 tests
        run: python -m pytest -q tests/test_m15_production_hardening.py
      - name: M14 regression
        run: python -m pytest -q tests/test_m14_integration_settings.py
        env:
          WBCZ_TEST_DATABASE_URL: ""
      - name: Secret scan
        run: python scripts/m15_secret_scan.py
      - name: Generate draft SBOM
        run: python scripts/m15_sbom.py --output build/m15-sbom.cdx.json
      - name: Generate draft release manifest
        run: python scripts/m15_release_manifest.py --output build/m15-release-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m15-draft-release-contract
          path: |
            build/m15-sbom.cdx.json
            build/m15-release-manifest.json
          if-no-files-found: error

  postgres-m15:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wbcz_m15
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wbcz_m15"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WBCZ_ENV: test
      WBCZ_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_m15
      WBCZ_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/wbcz_m15
      WBCZ_OWN_INN: "1234567890"
      WBCZ_COOKIE_SECURE: "false"
      WBCZ_BUILD_SHA: ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[web,test]"
      - name: Fresh migrate to exact M15 revision
        run: |
          alembic upgrade 0016_m15_production_hardening
          test "$(python - <<'PY'
          from sqlalchemy import create_engine, text
          import os
          e=create_engine(os.environ["WBCZ_DATABASE_URL"])
          with e.connect() as c:
              print(c.execute(text("select version_num from alembic_version")).scalar_one())
          PY
          )" = "0016_m15_production_hardening"
      - name: Focused PostgreSQL M14 regression
        run: python -m pytest -q tests/test_m14_integration_settings.py

  frontend-freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Frontend regression
        working-directory: frontend
        run: |
          npm test
          npm run build
