name: M6 fix01 patch

on:
  push:
    branches:
      - m6/aggregation-001

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m6/aggregation-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        run: python scripts/m6_fix01_apply.py
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m compileall -q src tests/test_m6_aggregation.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/wbcz/aggregation.py tests/test_m6_aggregation.py docs/M6_AGGREGATION_CONTRACT.md .github/workflows/m6-aggregation-validation.yml
          git diff --cached --check
          git commit -m 'fix: align M6 aggregate identifiers and multiproduct statuses'
          git push origin HEAD:m6/aggregation-001
