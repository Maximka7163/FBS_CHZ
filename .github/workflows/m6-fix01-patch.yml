          '''Mixed-PG KITU is supported using the current v664 rules included in v726, not downgraded to the ordinary single-PG model. Ordinary KITU keeps the source-confirmed identical-child-status rule with `APPLIED`/`INTRODUCED`; for `APPLIED`, child emission types must also match. Multiproduct KITU is different: each child must be raw `INTRODUCED` or an explicitly runtime-confirmed raw value corresponding to the textual documented state «Сформирован»; `APPLIED` is not accepted merely because ordinary KITU supports it. Child statuses need not be identical, and `statusEx` may independently be absent or `WAIT_TRANSFER_TO_OWNER`.\n\nThe textual «Сформирован» still has no confirmed raw enum. No `FORMED` value is invented. `runtime_formed_status_values` defaults empty, so that branch fails closed until a raw value is confirmed at runtime. Thus `MULTIPRODUCT_KITU_INTRODUCED_PATH=IMPLEMENTED` and `MULTIPRODUCT_KITU_FORMED_PATH=RUNTIME_GATED`. Multiproduct transformation also removes the old child-status-equals-parent assumption; because the parent raw state is not established by the authoritative contract, mixed-PG transformation requires an explicitly runtime-confirmed parent raw formed-state value instead of inventing a parent status. The leading PG is explicit; at least one child must match it, and REMOVING must leave at least one leading-PG child. Child compatibility is evaluated using each child's actual PG/package type. Nested BOX is supported. The implementation does not invent a nesting-depth contract. Official non-owner/legacy traceability exceptions are not silently enabled.\n''')

          # Permanent final CI assertion for the two architect fixes.
