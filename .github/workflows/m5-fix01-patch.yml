name: M5 fix01 patch

on:
  push:
    branches:
      - m5/turnover-operations-001

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m5/turnover-operations-001
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply accepted M5 contract fixes only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              s = p.read_text(encoding="utf-8")
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old[:120]!r}")
              p.write_text(s.replace(old, new, 1), encoding="utf-8")

          p = "src/wbcz/turnover.py"
          replace_once(p,
          '''    TurnoverOperationKind.WITHDRAW: TurnoverOperationDefinition(\n        TurnoverOperationKind.WITHDRAW, "LK_RECEIPT", ("MANUAL",), (M5_PG,), ("DISTANCE",),\n        "WITHDRAWAL", "RETIRED", "LK_RECEIPT_CANCEL"),\n''',
          '''    TurnoverOperationKind.WITHDRAW: TurnoverOperationDefinition(\n        TurnoverOperationKind.WITHDRAW, "LK_RECEIPT", ("MANUAL",), (M5_PG,), (),\n        "WITHDRAWAL_REFERENCE_ONLY", "UNKNOWN", "LK_RECEIPT_CANCEL",\n        capability="NOT_EXECUTABLE_EXACT_REASON_CONTRACTS_UNAVAILABLE"),\n''')

          replace_once(p,
          '''@dataclass(frozen=True, slots=True)\nclass ReturnProduct:\n    ki: str\n    primary_document: PrimaryDocument | None = None\n    permit: PermitDocument | None = None\n\n    def to_wire(self, *, include_primary: bool, include_permit: bool) -> dict[str, Any]:\n        result: dict[str, Any] = {"ki": _cis(self.ki, "ki")}\n        if self.primary_document is not None:\n            if not include_primary:\n                raise TurnoverContractError("item primary document is forbidden by the selected root tuple")\n            result.update(self.primary_document.to_return_wire())\n        if self.permit is not None:\n            if not include_permit:\n                raise TurnoverContractError("item permit is forbidden by the selected root tuple")\n            result.update(self.permit.to_wire())\n        return result\n\n\n@dataclass(frozen=True, slots=True)\nclass LpReturnDocument:\n    trade_participant_inn: str\n    products_list: tuple[ReturnProduct, ...]\n    paid: bool | None\n    primary_document: PrimaryDocument | None = None\n    permit: PermitDocument | None = None\n    return_type: str = "REMOTE_SALE_RETURN"\n    document_type = "LP_RETURN"\n\n    def to_wire(self) -> dict[str, Any]:\n        if self.return_type in UNSUPPORTED_LP_RETURN_TYPES:\n            raise TurnoverManualReview("RETURN_TYPE_NOT_APPLICABLE_TO_LP")\n        if self.return_type != "REMOTE_SALE_RETURN":\n            raise TurnoverManualReview("RETURN_TYPE_MATRIX_NOT_CONFIRMED_FOR_M5_WIRE_ASSEMBLY")\n        if self.paid is None:\n            raise TurnoverManualReview("REMOTE_SALE_RETURN_PAID_REQUIRED")\n        if type(self.paid) is not bool:\n            raise TurnoverContractError("paid must be boolean")\n        if not self.products_list:\n            raise TurnoverContractError("products_list must be non-empty")\n        has_item_primary = any(item.primary_document is not None for item in self.products_list)\n        has_item_permit = any(item.permit is not None for item in self.products_list)\n        if self.primary_document is not None and has_item_primary:\n            raise TurnoverContractError("primary document must be root-level or item-level, not mixed")\n        if self.permit is not None and has_item_permit:\n            raise TurnoverContractError("permit must be root-level or item-level, not mixed")\n        if self.paid:\n            if self.primary_document is None and not all(item.primary_document is not None for item in self.products_list):\n                raise TurnoverManualReview("REMOTE_SALE_RETURN_PRIMARY_DOCUMENT_REQUIRED")\n        elif self.primary_document is not None or has_item_primary:\n            raise TurnoverContractError("primary document must be absent for REMOTE_SALE_RETURN paid=false")\n        wires = [\n            item.to_wire(include_primary=self.primary_document is None, include_permit=self.permit is None)\n            for item in self.products_list\n        ]\n        if len({item["ki"] for item in wires}) != len(wires):\n            raise TurnoverContractError("products_list[].ki must be unique")\n        result: dict[str, Any] = {\n            "trade_participant_inn": _inn(self.trade_participant_inn, "trade_participant_inn"),\n            "return_type": "REMOTE_SALE_RETURN",\n            "paid": self.paid,\n            "products_list": wires,\n        }\n        if self.primary_document is not None:\n            result.update(self.primary_document.to_return_wire())\n        if self.permit is not None:\n            result.update(self.permit.to_wire())\n        return result\n''',
          '''@dataclass(frozen=True, slots=True)\nclass ReturnProduct:\n    ki: str\n    paid: bool | None = None\n    primary_document: PrimaryDocument | None = None\n    permit: PermitDocument | None = None\n\n    def to_wire(self) -> dict[str, Any]:\n        result: dict[str, Any] = {"ki": _cis(self.ki, "ki")}\n        if self.paid is not None:\n            if type(self.paid) is not bool:\n                raise TurnoverContractError("products_list[].paid must be boolean")\n            result["paid"] = self.paid\n        if self.primary_document is not None:\n            result.update(self.primary_document.to_return_wire())\n        if self.permit is not None:\n            result.update(self.permit.to_wire())\n        return result\n\n\n@dataclass(frozen=True, slots=True)\nclass LpReturnDocument:\n    trade_participant_inn: str\n    products_list: tuple[ReturnProduct, ...]\n    paid: bool | None = None\n    primary_document: PrimaryDocument | None = None\n    permit: PermitDocument | None = None\n    return_type: str = "REMOTE_SALE_RETURN"\n    document_type = "LP_RETURN"\n\n    def to_wire(self) -> dict[str, Any]:\n        if self.return_type in UNSUPPORTED_LP_RETURN_TYPES:\n            raise TurnoverManualReview("RETURN_TYPE_NOT_APPLICABLE_TO_LP")\n        if self.return_type not in KNOWN_LP_RETURN_TYPES:\n            raise TurnoverManualReview("RETURN_TYPE_MATRIX_NOT_CONFIRMED_FOR_LP")\n        if self.paid is not None and type(self.paid) is not bool:\n            raise TurnoverContractError("paid must be boolean")\n        if not self.products_list:\n            raise TurnoverContractError("products_list must be non-empty")\n\n        wires: list[dict[str, Any]] = []\n        for item in self.products_list:\n            if item.paid is not None and type(item.paid) is not bool:\n                raise TurnoverContractError("products_list[].paid must be boolean")\n            effective_paid = item.paid if item.paid is not None else self.paid\n            if effective_paid is None:\n                raise TurnoverManualReview("LP_RETURN_PAID_REQUIRED")\n            effective_primary = item.primary_document if item.primary_document is not None else self.primary_document\n            if effective_paid is True and effective_primary is None:\n                raise TurnoverManualReview("LP_RETURN_PRIMARY_DOCUMENT_REQUIRED")\n            wires.append(item.to_wire())\n\n        if len({item["ki"] for item in wires}) != len(wires):\n            raise TurnoverContractError("products_list[].ki must be unique")\n        result: dict[str, Any] = {\n            "trade_participant_inn": _inn(self.trade_participant_inn, "trade_participant_inn"),\n            "return_type": self.return_type,\n            "products_list": wires,\n        }\n        if self.paid is not None:\n            result["paid"] = self.paid\n        if self.primary_document is not None:\n            result.update(self.primary_document.to_return_wire())\n        if self.permit is not None:\n            result.update(self.permit.to_wire())\n        return result\n''')

          replace_once(p,
          '''    TurnoverOperationKind.WITHDRAW: LkReceiptDistanceDocument,\n    TurnoverOperationKind.WITHDRAW_DISTANCE: LkReceiptDistanceDocument,\n''',
          '''    TurnoverOperationKind.WITHDRAW_DISTANCE: LkReceiptDistanceDocument,\n''')

          replace_once(p,
          '''    expected_cls = _EXPECTED_CLASS[normalized]\n    if not isinstance(document, expected_cls):\n        raise TurnoverContractError("operation/document DTO mismatch")\n    definition = TURNOVER_OPERATION_REGISTRY[normalized]\n''',
          '''    expected_cls = _EXPECTED_CLASS.get(normalized)\n    if expected_cls is None:\n        raise TurnoverManualReview("OPERATION_NOT_EXECUTABLE")\n    if not isinstance(document, expected_cls):\n        raise TurnoverContractError("operation/document DTO mismatch")\n    if (\n        normalized is TurnoverOperationKind.RETURN_REMOTE_SALE\n        and isinstance(document, LpReturnDocument)\n        and document.return_type != "REMOTE_SALE_RETURN"\n    ):\n        raise TurnoverContractError("RETURN_REMOTE_SALE requires return_type=REMOTE_SALE_RETURN")\n    definition = TURNOVER_OPERATION_REGISTRY[normalized]\n''')

          replace_once(p,
          '''RETURN_REASON_MATRIX: Mapping[tuple[str, str, str, str], str] = {\n    (M5_PG, "RETIRED", "DISTANCE", "REMOTE_SALE_RETURN"): "SUPPORTED",\n    (M5_PG, "RETIRED", "BY_SAMPLES", "REMOTE_SALE_RETURN"): "SUPPORTED",\n}\n''',
          '''RETURN_REASON_MATRIX: Mapping[tuple[str, str, str, str], str] = {\n    (M5_PG, "RETIRED", "DISTANCE", "REMOTE_SALE_RETURN"): "SUPPORTED",\n    (M5_PG, "RETIRED", "BY_SAMPLES", "REMOTE_SALE_RETURN"): "SUPPORTED",\n    (M5_PG, "RETIRED", "RETAIL", "RETAIL_RETURN"): "SUPPORTED",\n    (M5_PG, "RETIRED", "BY_SAMPLES", "RETAIL_RETURN"): "SUPPORTED",\n    (M5_PG, "RETIRED", "DISTANCE", "RETAIL_RETURN"): "SUPPORTED",\n    (M5_PG, "RETIRED", "OWN_USE", "OWN_USE_RETURN"): "SUPPORTED",\n    (M5_PG, "RETIRED", "PRODUCTION_USE", "OWN_USE_RETURN"): "SUPPORTED",\n    (M5_PG, "RETIRED", "MEDICAL_USE", "OWN_USE_RETURN"): "SUPPORTED",\n    (M5_PG, "RETIRED", "VETERINARY_USE", "OWN_USE_RETURN"): "SUPPORTED",\n    (M5_PG, "RETIRED", "STATE_SECRET", "STATE_CONTRACT_RETURN"): "SUPPORTED",\n    (M5_PG, "RETIRED", "DONATION", "NOT_FOR_SALE_RETURN"): "SUPPORTED",\n    (M5_PG, "RETIRED", "OWN_USE", "NOT_FOR_SALE_RETURN"): "SUPPORTED",\n    (M5_PG, "RETIRED", "PRODUCTION_USE", "NOT_FOR_SALE_RETURN"): "SUPPORTED",\n    (M5_PG, "RETIRED", "STATE_CONTRACT", "NOT_FOR_SALE_RETURN"): "SUPPORTED",\n}\n''')

          replace_once(p,
          '''    def validate_remote_sale_return(self, snapshots: Sequence[CisSnapshot]) -> PreconditionEvidence:\n        if not snapshots:\n            raise TurnoverContractError("return requires CIS snapshots")\n        for snapshot in snapshots:\n            self._fresh(snapshot)\n            self._owned(snapshot)\n            self._plain(snapshot)\n            if snapshot.status != "RETIRED":\n                raise TurnoverManualReview("REMOTE_RETURN_REQUIRES_RETIRED")\n            validate_return_reason_matrix(\n                pg=M5_PG,\n                current_status=snapshot.status,\n                current_withdraw_reason=snapshot.withdraw_reason,\n                return_type="REMOTE_SALE_RETURN",\n            )\n        return self._evidence(TurnoverOperationKind.RETURN_REMOTE_SALE, snapshots)\n''',
          '''    def validate_return(\n        self,\n        snapshots: Sequence[CisSnapshot],\n        *,\n        return_type: str,\n        operation_kind: TurnoverOperationKind = TurnoverOperationKind.RETURN_TO_CIRCULATION,\n    ) -> PreconditionEvidence:\n        if not snapshots:\n            raise TurnoverContractError("return requires CIS snapshots")\n        if return_type in UNSUPPORTED_LP_RETURN_TYPES:\n            raise TurnoverManualReview("RETURN_TYPE_NOT_APPLICABLE_TO_LP")\n        if return_type not in KNOWN_LP_RETURN_TYPES:\n            raise TurnoverManualReview("RETURN_TYPE_MATRIX_NOT_CONFIRMED_FOR_LP")\n        for snapshot in snapshots:\n            self._fresh(snapshot)\n            self._owned(snapshot)\n            self._plain(snapshot)\n            if snapshot.status != "RETIRED":\n                raise TurnoverManualReview("RETURN_REQUIRES_RETIRED")\n            validate_return_reason_matrix(\n                pg=M5_PG,\n                current_status=snapshot.status,\n                current_withdraw_reason=snapshot.withdraw_reason,\n                return_type=return_type,\n            )\n        return self._evidence(operation_kind, snapshots)\n\n    def validate_remote_sale_return(self, snapshots: Sequence[CisSnapshot]) -> PreconditionEvidence:\n        return self.validate_return(\n            snapshots,\n            return_type="REMOTE_SALE_RETURN",\n            operation_kind=TurnoverOperationKind.RETURN_REMOTE_SALE,\n        )\n''')

          replace_once(p,
          '''        if not snapshots and kind is not TurnoverOperationKind.CANCEL_WITHDRAWAL:\n            return ReconciliationResult(ReconciliationState.PENDING, document_status_raw, "FRESH_CIS_POSTCONDITION_REQUIRED", observed)\n        if kind in {TurnoverOperationKind.WITHDRAW, TurnoverOperationKind.WITHDRAW_DISTANCE}:\n            ok = all(item.status == "RETIRED" and item.withdraw_reason == "DISTANCE" for item in snapshots)\n''',
          '''        if kind is TurnoverOperationKind.WITHDRAW:\n            return ReconciliationResult(\n                ReconciliationState.MANUAL_REVIEW, document_status_raw, "OPERATION_NOT_EXECUTABLE", observed\n            )\n        if not snapshots and kind is not TurnoverOperationKind.CANCEL_WITHDRAWAL:\n            return ReconciliationResult(ReconciliationState.PENDING, document_status_raw, "FRESH_CIS_POSTCONDITION_REQUIRED", observed)\n        if kind is TurnoverOperationKind.WITHDRAW_DISTANCE:\n            ok = all(item.status == "RETIRED" and item.withdraw_reason == "DISTANCE" for item in snapshots)\n''')

          p = "tests/test_m5_turnover.py"
          replace_once(p,
          '''        TurnoverOperationKind.WITHDRAW: "LK_RECEIPT",\n        TurnoverOperationKind.WITHDRAW_DISTANCE: "LK_RECEIPT",\n''',
          '''        TurnoverOperationKind.WITHDRAW: "LK_RECEIPT",\n        TurnoverOperationKind.WITHDRAW_DISTANCE: "LK_RECEIPT",\n''')
          replace_once(p,
          '''    assert KNOWN_FAIL_CLOSED_DOCUMENT_TYPES["LP_CANCEL_SHIPMENT"] == "SOURCE_DOCUMENT_REQUIRED"\n    with pytest.raises(TurnoverContractError):\n        document_type_for_operation("ARBITRARY")\n''',
          '''    assert KNOWN_FAIL_CLOSED_DOCUMENT_TYPES["LP_CANCEL_SHIPMENT"] == "SOURCE_DOCUMENT_REQUIRED"\n    assert TURNOVER_OPERATION_REGISTRY[TurnoverOperationKind.WITHDRAW].capability == (\n        "NOT_EXECUTABLE_EXACT_REASON_CONTRACTS_UNAVAILABLE"\n    )\n    assert TURNOVER_OPERATION_REGISTRY[TurnoverOperationKind.WITHDRAW].supported_reasons == ()\n    with pytest.raises(TurnoverContractError):\n        document_type_for_operation("ARBITRARY")\n    with pytest.raises(TurnoverManualReview, match="OPERATION_NOT_EXECUTABLE"):\n        prepare_turnover_document(TurnoverOperationKind.WITHDRAW, _distance())\n''')

          old_start = s = Path(p).read_text(encoding="utf-8")
          start = s.index("def test_remote_return_paid_is_never_guessed_or_defaulted() -> None:\n")
          end = s.index("\ndef test_preconditions_require_fresh_owner_plain_state_and_raw_reason() -> None:\n", start)
          replacement = '''def test_lp_return_paid_root_item_precedence_and_missing_effective_paid() -> None:\n    with pytest.raises(TurnoverManualReview, match="PAID_REQUIRED"):\n        LpReturnDocument(\n            trade_participant_inn=INN,\n            products_list=(ReturnProduct(CIS),),\n            paid=None,\n        ).to_wire()\n\n    root_only = LpReturnDocument(\n        trade_participant_inn=INN,\n        products_list=(ReturnProduct(CIS),),\n        paid=False,\n    ).to_wire()\n    assert root_only["paid"] is False\n    assert "paid" not in root_only["products_list"][0]\n\n    item_only = LpReturnDocument(\n        trade_participant_inn=INN,\n        products_list=(ReturnProduct(CIS, paid=False),),\n        paid=None,\n    ).to_wire()\n    assert "paid" not in item_only\n    assert item_only["products_list"][0]["paid"] is False\n\n    mixed = LpReturnDocument(\n        trade_participant_inn=INN,\n        paid=False,\n        primary_document=PrimaryDocument("RECEIPT", "ROOT", TODAY),\n        products_list=(\n            ReturnProduct(CIS),\n            ReturnProduct(CIS2, paid=True, primary_document=PrimaryDocument("SALES_RECEIPT", "ITEM", TODAY)),\n        ),\n    ).to_wire()\n    assert mixed["paid"] is False\n    assert "paid" not in mixed["products_list"][0]\n    assert mixed["products_list"][1]["paid"] is True\n    assert mixed["primary_document_number"] == "ROOT"\n    assert mixed["products_list"][1]["primary_document_number"] == "ITEM"\n\n    with pytest.raises(TurnoverManualReview, match="PRIMARY_DOCUMENT_REQUIRED"):\n        LpReturnDocument(\n            trade_participant_inn=INN,\n            paid=False,\n            products_list=(ReturnProduct(CIS, paid=True),),\n        ).to_wire()\n\n\ndef test_lp_return_paid_false_does_not_invent_primary_document_prohibition() -> None:\n    root_doc = LpReturnDocument(\n        trade_participant_inn=INN,\n        products_list=(ReturnProduct(CIS),),\n        paid=False,\n        primary_document=PrimaryDocument("RECEIPT", "R-0", TODAY),\n    ).to_wire()\n    assert root_doc["paid"] is False\n    assert root_doc["primary_document_number"] == "R-0"\n\n    item_doc = LpReturnDocument(\n        trade_participant_inn=INN,\n        products_list=(ReturnProduct(CIS, paid=False, primary_document=PrimaryDocument("RECEIPT", "I-0", TODAY)),),\n        paid=None,\n    ).to_wire()\n    assert item_doc["products_list"][0]["paid"] is False\n    assert item_doc["products_list"][0]["primary_document_number"] == "I-0"\n\n\ndef test_lp_return_paid_true_requires_effective_primary_document() -> None:\n    with pytest.raises(TurnoverManualReview, match="PRIMARY_DOCUMENT_REQUIRED"):\n        LpReturnDocument(\n            trade_participant_inn=INN,\n            products_list=(ReturnProduct(CIS),),\n            paid=True,\n        ).to_wire()\n\n    wire = LpReturnDocument(\n        trade_participant_inn=INN,\n        products_list=(ReturnProduct(CIS),),\n        paid=True,\n        primary_document=PrimaryDocument("RECEIPT", "R-1", TODAY),\n    ).to_wire()\n    assert wire["paid"] is True\n    assert wire["primary_document_type"] == "RECEIPT"\n    assert wire["primary_document_number"] == "R-1"\n\n\ndef test_return_reason_matrix_contains_all_confirmed_lp_cells_and_no_inference() -> None:\n    confirmed = {\n        ("DISTANCE", "REMOTE_SALE_RETURN"),\n        ("BY_SAMPLES", "REMOTE_SALE_RETURN"),\n        ("RETAIL", "RETAIL_RETURN"),\n        ("BY_SAMPLES", "RETAIL_RETURN"),\n        ("DISTANCE", "RETAIL_RETURN"),\n        ("OWN_USE", "OWN_USE_RETURN"),\n        ("PRODUCTION_USE", "OWN_USE_RETURN"),\n        ("MEDICAL_USE", "OWN_USE_RETURN"),\n        ("VETERINARY_USE", "OWN_USE_RETURN"),\n        ("STATE_SECRET", "STATE_CONTRACT_RETURN"),\n        ("DONATION", "NOT_FOR_SALE_RETURN"),\n        ("OWN_USE", "NOT_FOR_SALE_RETURN"),\n        ("PRODUCTION_USE", "NOT_FOR_SALE_RETURN"),\n        ("STATE_CONTRACT", "NOT_FOR_SALE_RETURN"),\n    }\n    for prior_reason, return_type in confirmed:\n        validate_return_reason_matrix(\n            pg="lp", current_status="RETIRED", current_withdraw_reason=prior_reason, return_type=return_type\n        )\n\n    for prior_reason, return_type in (\n        ("STATE_SECRET", "REMOTE_SALE_RETURN"),\n        ("RETAIL", "OWN_USE_RETURN"),\n        ("DISTANCE", "STATE_CONTRACT_RETURN"),\n        (None, "NOT_FOR_SALE_RETURN"),\n    ):\n        with pytest.raises(TurnoverManualReview):\n            validate_return_reason_matrix(\n                pg="lp", current_status="RETIRED", current_withdraw_reason=prior_reason, return_type=return_type\n            )\n    with pytest.raises(TurnoverManualReview):\n        validate_return_reason_matrix(\n            pg="lp", current_status="RETIRED", current_withdraw_reason="DISTANCE", return_type="VENDING_RETURN"\n        )\n\n\ndef test_general_lp_return_uses_exact_matrix_and_remote_alias_stays_exact() -> None:\n    service = OperationPreconditionService(participant_inn=INN, now=lambda: NOW)\n    evidence = service.validate_return(\n        (_snapshot(status="RETIRED", withdraw_reason="OWN_USE"),),\n        return_type="OWN_USE_RETURN",\n    )\n    assert evidence.operation_kind is TurnoverOperationKind.RETURN_TO_CIRCULATION\n\n    prepared = prepare_turnover_document(\n        TurnoverOperationKind.RETURN_TO_CIRCULATION,\n        LpReturnDocument(\n            trade_participant_inn=INN,\n            products_list=(ReturnProduct(CIS, paid=False),),\n            return_type="OWN_USE_RETURN",\n        ),\n    )\n    assert prepared.raw_business_reason == "OWN_USE_RETURN"\n\n    with pytest.raises(TurnoverContractError, match="RETURN_REMOTE_SALE"):\n        prepare_turnover_document(\n            TurnoverOperationKind.RETURN_REMOTE_SALE,\n            LpReturnDocument(\n                trade_participant_inn=INN,\n                products_list=(ReturnProduct(CIS, paid=False),),\n                return_type="RETAIL_RETURN",\n            ),\n        )\n\n'''
          Path(p).write_text(s[:start] + replacement + s[end+1:], encoding="utf-8")

          replace_once(p,
          '''    unknown = reconcile.reconcile(\n        operation_kind=TurnoverOperationKind.WITHDRAW_DISTANCE,\n        document_status_raw="NEW_UNKNOWN_STATUS",\n        snapshots=(_snapshot(status="RETIRED", withdraw_reason="DISTANCE"),),\n    )\n    assert unknown.state is ReconciliationState.PENDING\n    assert unknown.document_status_raw == "NEW_UNKNOWN_STATUS"\n''',
          '''    unknown = reconcile.reconcile(\n        operation_kind=TurnoverOperationKind.WITHDRAW_DISTANCE,\n        document_status_raw="NEW_UNKNOWN_STATUS",\n        snapshots=(_snapshot(status="RETIRED", withdraw_reason="DISTANCE"),),\n    )\n    assert unknown.state is ReconciliationState.PENDING\n    assert unknown.document_status_raw == "NEW_UNKNOWN_STATUS"\n\n    generic = reconcile.reconcile(\n        operation_kind=TurnoverOperationKind.WITHDRAW,\n        document_status_raw="CHECKED_OK",\n        snapshots=(_snapshot(status="RETIRED", withdraw_reason="DISTANCE"),),\n    )\n    assert generic.state is ReconciliationState.MANUAL_REVIEW\n    assert generic.reason == "OPERATION_NOT_EXECUTABLE"\n''')

          p = "docs/M5_TURNOVER_CONTRACT.md"
          replace_once(p,
          '''| WITHDRAW / WITHDRAW_DISTANCE | LK_RECEIPT | MANUAL | yes | M5 exposes confirmed DISTANCE contract only |\n''',
          '''| WITHDRAW | LK_RECEIPT | MANUAL | yes | reference-only; not executable because exact reason-specific wire contracts beyond DISTANCE are unavailable |\n| WITHDRAW_DISTANCE | LK_RECEIPT | MANUAL | yes | executable confirmed DISTANCE contract |\n''')

          replace_once(p,
          '''- `paid` is a required explicit boolean. It is never defaulted or inferred.\n''',
          '''- `paid` must resolve explicitly at root or item level. `products_list[].paid` is an optional item override and has priority over root `paid`. It is never defaulted or inferred.\n''')
          replace_once(p,
          '''- `paid=true` requires the exact primary-document tuple.\n- `paid=false` does not invent a primary-document requirement and rejects supplied primary-document data for this subflow.\n- root/item primary-document and permit tuples are mutually exclusive when the schema permits either location.\n''',
          '''- effective `paid=true` requires the exact effective primary-document tuple. Item primary-document fields override root fields for that item.\n- effective `paid=false` does not require a primary document. v726.0 does not establish an absent-only rule here, so M5 does not invent a prohibition against otherwise source-valid supplied primary-document data.\n- root values may coexist with item overrides; item-level values take precedence for that item.\n''')

          replace_once(p,
          '''Confirmed cells implemented now:\n\n- `lp + RETIRED + DISTANCE + REMOTE_SALE_RETURN`\n- `lp + RETIRED + BY_SAMPLES + REMOTE_SALE_RETURN`\n\nOther documented return type names may appear in registry metadata, but an unconfirmed matrix cell is `MANUAL_REVIEW` / validation failure. `VENDING_RETURN` is not accepted for `lp`.\n''',
          '''Confirmed cells implemented now:\n\n- `REMOTE_SALE_RETURN`: prior `DISTANCE`, `BY_SAMPLES`.\n- `RETAIL_RETURN`: prior `RETAIL`, `BY_SAMPLES`, `DISTANCE`.\n- `OWN_USE_RETURN`: prior `OWN_USE`, `PRODUCTION_USE`, `MEDICAL_USE`, `VETERINARY_USE`.\n- `STATE_CONTRACT_RETURN`: prior `STATE_SECRET`.\n- `NOT_FOR_SALE_RETURN`: prior `DONATION`, `OWN_USE`, `PRODUCTION_USE`, `STATE_CONTRACT`.\n\nEvery cell is still keyed with `pg=lp` and current status `RETIRED`. Any combination not explicitly listed above is `MANUAL_REVIEW` / validation failure. `VENDING_RETURN` is not accepted for `lp`.\n''')

          replace_once(p,
          '''DISTANCE business success is two-stage: document `CHECKED_OK` and fresh M1 CIS reconciliation to `RETIRED` with raw `withdrawReason=DISTANCE`.\n''',
          '''DISTANCE business success is two-stage: document `CHECKED_OK` and fresh M1 CIS reconciliation to `RETIRED` with raw `withdrawReason=DISTANCE`.\n\nGeneric `WITHDRAW` is deliberately non-executable in M5. The accepted research did not provide implementation-ready reason-specific LK_RECEIPT wire contracts beyond DISTANCE, so generic WITHDRAW cannot silently reuse DISTANCE semantics.\n''')

          python_files = ["src/wbcz/turnover.py", "tests/test_m5_turnover.py"]
          for file in python_files:
              compile(Path(file).read_text(encoding="utf-8"), file, "exec")
          PY
          git diff --check
