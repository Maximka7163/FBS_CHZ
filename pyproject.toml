[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wbcz-core"
version = "0.4.0"
description = "WB FBS marking control core with live read-only True API"
requires-python = ">=3.12"
dependencies = ["openpyxl>=3.1.5,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27"]
ui = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[project.scripts]
wbcz = "wbcz.cli:main"
wbcz-ui = "wbcz_ui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
